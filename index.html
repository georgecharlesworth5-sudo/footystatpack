        <div class="slip-actions"><button class="slip-btn primary" data-bank-restore>Restore</button></div></div>
      <div class="slip-note">Bets are stored in this browser on this device only. The backup is a block of text you can paste back in on another device.</div>`;

    mainEl.innerHTML = header + bankFormHtml(st) + statsTable + `<div class="tr-section-title">Your bets</div>` + toggle + list + tools;
    bindBankroll();
  }

  function bankReadDraftField(el) {
    const f = el.dataset.bankF;
    bankDraft[f] = el.value;
    if (f === "sport" || f === "kind") renderBankroll();
    else { const h = mainEl.querySelector("#bank-hint"); if (h) h.innerHTML = bankHint(bankDraft); }
  }

  function bindBankroll() {
    mainEl.querySelectorAll("[data-bank-f]").forEach(el => {
      el.addEventListener(el.tagName === "SELECT" ? "change" : "input", () => bankReadDraftField(el));
    });
    const on = (sel, fn) => mainEl.querySelectorAll(sel).forEach(el => el.addEventListener("click", () => fn(el)));
    on("[data-bank-start]", () => {
      const v = Number(String(mainEl.querySelector("#bank-start").value).replace(/[£,\s]/g, ""));
      if (!(v > 0)) return;
      bank = { start: v, created: new Date().toISOString(), bets: [] }; bankSave(); buildTabs(); renderBankroll();
    });
    on("[data-bank-place]", () => {
      const d = bankDraft, dec = parseOdds(d.odds), stake = Number(String(d.stake).replace(/[£,\s]/g, ""));
      if (!(stake > 0) || dec == null) { bankMsg = "Enter a stake above zero and valid odds (2.5 or 5/2)."; renderBankroll(); return; }
      const outlay = stake * (d.kind === "ew" ? 2 : 1);
      const avail = bankStats().cash;
      if (outlay > avail + 1e-9) { bankMsg = `That stake is ${gbp(outlay)} but only ${gbp(avail)} is available.`; renderBankroll(); return; }
      const t = EW_TERMS[Number(d.ew)] || EW_TERMS[0];
      bank.bets.push({ id: Date.now(), placedAt: new Date().toISOString(), sport: d.sport, kind: d.kind, desc: (d.desc || "").trim(),
        stake, odds: dec, ewLabel: t[0], ewDen: t[1], ewPlaces: t[2], eventAt: d.when || "", fair: d.fair || null, status: "pending", returns: null, settledAt: null });
      bankSave(); bankMsg = ""; bankDraft = { sport: d.sport, kind: "single", desc: "", stake: "", odds: "", ew: 1, when: "", fair: null, source: "" };
      buildTabs(); renderBankroll();
    });
    on("[data-bank-clear]", () => { bankDraft = { sport: bankDraft.sport, kind: "single", desc: "", stake: "", odds: "", ew: 1, when: "", fair: null, source: "" }; bankMsg = ""; renderBankroll(); });
    on("[data-bank-view]", el => { bankView = el.dataset.bankView; renderBankroll(); });
    on("[data-bank-out]", el => {
      const id = Number(el.dataset.bankId);
      bankSettling = { id, outcome: el.dataset.bankOut, returns: null }; bankDelArmed = null; renderBankroll();
    });
    // Save as the time is picked, but only re-sort once the picker is closed (re-rendering mid-pick closes it on phones).
    mainEl.querySelectorAll("[data-bank-when]").forEach(el => {
      let dirty = false;
      const bet = () => bank.bets.find(x => String(x.id) === el.dataset.bankWhen);
      const save = () => { const t = bet(); if (t) { t.eventAt = el.value || ""; bankSave(); dirty = true; } };
      el.addEventListener("input", save);
      el.addEventListener("change", save);
      el.addEventListener("blur", () => {
        if (!dirty) return;
        const y = window.scrollY; renderBankroll(); window.scrollTo(0, y);
      });
    });
    on("[data-bank-cancel]", () => { bankSettling = null; renderBankroll(); });
    on("[data-bank-confirm]", el => {
      const b = bank.bets.find(x => x.id === Number(el.dataset.bankConfirm));
      const inp = mainEl.querySelector("[data-bank-ret]");
      const v = Number(String(inp.value).replace(/[£,\s]/g, ""));
      if (!b || !(v >= 0)) return;
      b.status = bankSettling.outcome; b.returns = Math.round(v * 100) / 100; b.settledAt = new Date().toISOString();
      bankSettling = null; bankSave(); buildTabs(); renderBankroll();
    });
    on("[data-bank-reopen]", el => {
      const b = bank.bets.find(x => x.id === Number(el.dataset.bankReopen)); if (!b) return;
      b.status = "pending"; b.returns = null; b.settledAt = null; bankSave(); buildTabs(); renderBankroll();
    });
    on("[data-bank-del]", el => {
      const id = Number(el.dataset.bankDel);
      if (bankDelArmed === id) { bank.bets = bank.bets.filter(x => x.id !== id); bankDelArmed = null; bankSave(); buildTabs(); }
      else bankDelArmed = id;
      renderBankroll();
    });
    on("[data-bank-copy]", el => copyText(JSON.stringify(bank), el));
    on("[data-bank-restore-toggle]", () => { const box = mainEl.querySelector("#bank-restore-box"); box.style.display = box.style.display === "none" ? "block" : "none"; });
    on("[data-bank-restore]", () => {
      try {
        const v = JSON.parse(mainEl.querySelector("#bank-restore-text").value);
        if (!v || !(v.start > 0) || !Array.isArray(v.bets)) throw new Error("bad");
        bank = v; bankSave(); buildTabs(); renderBankroll();
      } catch (e) { bankMsg = "That doesn't look like a backup."; renderBankroll(); }
    });
    on("[data-bank-reset]", () => {
      if (bankDelArmed === "reset") { bank = null; try { localStorage.removeItem(BANK_STORE); } catch (e) {} bankDelArmed = null; buildTabs(); }
      else bankDelArmed = "reset";
      renderBankroll();
    });
  }

  // Hand a bet slip over to the Bankroll tab as a draft bet.
  function slipEarliest(items) {
    const t = items.filter(i => i.date).map(i => `${i.date}T${/^\d{2}:\d{2}/.test(i.time || "") ? i.time.slice(0, 5) : "12:00"}`).sort();
    return t[0] ? t[0].slice(-5) : "";
  }
  function bankWhen(b) { return (b.eventAt || "").slice(-5); }   // time of day only (older bets may hold a full date-time)
  function bankOrder(a, b) {
    const ap = a.status === "pending", bp = b.status === "pending";
    if (ap !== bp) return ap ? -1 : 1;                       // pending bets first
    const ae = bankWhen(a), be = bankWhen(b);
    if (ap) {                                                // pending: soonest event first, undated last
      if (ae && be) return ae.localeCompare(be) || a.placedAt.localeCompare(b.placedAt);
      if (ae !== be) return ae ? -1 : 1;
      return a.placedAt.localeCompare(b.placedAt);
    }
    return (be || b.placedAt).localeCompare(ae || a.placedAt);  // settled: most recent first
  }
  function bankFromSlip() {
    const items = slip.items; if (!items.length) return;
    const sports = new Set(items.map(i => (i.key.split("|")[0] === "nfl" ? "NFL" : "Football")));
    const st = slipStats(items);
    bankDraft = { sport: sports.size === 1 ? [...sports][0] : "Other", kind: items.length > 1 ? "builder" : "single",
      desc: items.map(i => i.label).join(" + ").slice(0, 160), stake: "", odds: "", ew: 1, when: slipEarliest(items), fair: st.fair || null, source: "bet slip" };
    bankMsg = "";
    activeLeague = BANKROLL; footballMenuOpen = false; render(); window.scrollTo(0, 0);
  }

  // ---------- Bet slip ----------
  function slipStats(items) {
    const prob = items.reduce((a, i) => a * i.confidence, 1);
    const games = new Map();
    items.forEach(i => {
      const g = i.key.split("|").slice(0, 4).join("|");
      games.set(g, (games.get(g) || 0) + 1);
    });
    const sameGame = Array.from(games.values()).some(n => n > 1);
    if (!sameGame) return { n: items.length, prob, fair: prob > 0 ? 1 / prob : null, sameGame, product: prob, productFair: prob > 0 ? 1 / prob : null, approx: false };
    const j = slipJointProb(items);
    return { n: items.length, prob: j.prob, fair: j.prob > 0 ? 1 / j.prob : null, sameGame, product: prob, productFair: prob > 0 ? 1 / prob : null, approx: j.approx };
  }

  function slipSummaryHtml(items) {
    if (!items.length) return "";
    const st = slipStats(items);
    const lines = [
      `<div class="slip-line"><span>Selections</span><b>${st.n}</b></div>`,
      `<div class="slip-line"><span>${st.sameGame ? "Chance every leg lands (same-game adjusted)" : "Chance every leg lands (model)"}</span><b>${(st.prob * 100).toFixed(1)}%</b></div>`,
      `<div class="slip-line"><span>${st.sameGame ? "Adjusted fair odds (break-even)" : "Fair odds (break-even)"}</span><b>${st.fair ? st.fair.toFixed(2) : "-"}</b></div>`,
    ];
    if (st.sameGame) lines.push(`<div class="slip-line" style="opacity:.7"><span>Legs simply multiplied</span><span>${(st.product * 100).toFixed(1)}% &middot; ${st.productFair ? st.productFair.toFixed(2) : "-"}</span></div>`);
    let notes = `<div class="slip-note">Fair odds are 1 divided by the model's chance. A bookmaker price for the whole slip above that would be value <i>if the model is right</i>. The model's confidence is a rough guide, not a guarantee.</div>`;
    if (st.sameGame) notes += `<div class="slip-note slip-warn">Some selections are from the same game, so they move together (a home win and over 1.5 goals, say). The adjusted figure rebuilds that game from the model's expected goals (corners, cards and NFL points the same way) and works out how often the legs land together. Different kinds of leg (goals v corners v cards) are treated as independent, so the figure is still an estimate. Compare a bookmaker's bet-builder price with the <b>adjusted</b> fair odds, not the multiplied ones, and remember builders carry a margin of roughly 5-10%.${st.approx ? " Some legs couldn't be matched to a current fixture, so those are multiplied." : ""}</div>`;
    return `<div class="slip-summary">${lines.join("")}${notes}</div>`;
  }

  function slipText(items, name) {
    const st = slipStats(items);
    const rows = items.map(i => `${i.label} (${i.league}, ${i.date}${i.time ? " " + i.time : ""})`);
    return (name ? name + "\n" : "") + rows.join("\n") + `\nModel chance all ${st.n} land: ${(st.prob * 100).toFixed(1)}% (${st.sameGame ? "same-game adjusted " : ""}fair odds ${st.fair ? st.fair.toFixed(2) : "-"})`;
  }

  function fmtSavedAt(iso) {
    const d = new Date(iso);
    return isNaN(d) ? "" : d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) + " " +
      d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  }

  function renderSlip() {
    const items = slip.items;
    const itemsHtml = items.map((it, idx) => `<div class="slip-item">
        <span class="slip-item-main">${it.label}<span class="slip-item-sub">${it.league} · ${it.date}${it.time ? " " + it.time : ""} · model ${pct(it.confidence)}</span></span>
        <button class="slip-x" data-slip-remove="${idx}" aria-label="Remove">✕</button>
      </div>`).join("");

    const currentHtml = items.length ? `
      ${itemsHtml}
      <div id="slip-summary">${slipSummaryHtml(items)}</div>
      <input class="slip-name" id="slip-name" maxlength="60" placeholder="Name this slip (optional)">
      <div class="slip-actions">
        <button class="slip-btn primary" id="slip-save">Save slip</button>
        <button class="slip-btn quiet" id="slip-copy">Copy as text</button>
        <button class="slip-btn quiet" id="slip-bank">Place as virtual bet</button>
        <button class="slip-btn quiet" id="slip-clear">Clear</button>
      </div>`
      : `<div class="empty">${slipJustSaved ? "Slip saved below." : "Your slip is empty."}<br>Tap a percentage on any fixture card, or the <b>+</b> on a Best Bets pick, to add it here.</div>`;

    const savedHtml = savedSlips.length ? `<div class="tr-section-title">Saved slips</div>` + savedSlips.map(sv => {
      const st = slipStats(sv.items);
      const lines = sv.items.map(i => `<div class="slip-line"><span>${i.label} <span class="tr-chip-n">${i.date}</span></span><span>${pct(i.confidence)}</span></div>`).join("");
      const meta = [`${sv.items.length} selection${sv.items.length === 1 ? "" : "s"}`,
        `model ${(st.prob * 100).toFixed(1)}% all land`,
        st.fair ? `fair odds ${st.fair.toFixed(2)}` : null].filter(Boolean).join(" · ");
      return `<div class="slip-summary" data-saved="${sv.id}">
        <div class="slip-line"><b>${escAttr(sv.name) || "Slip"}</b><span>${fmtSavedAt(sv.savedAt)}</span></div>
        <div class="slip-note" style="margin:0 0 6px">${meta}</div>
        ${lines}
        <div class="slip-actions" style="margin:10px 0 0">
          <button class="slip-btn quiet" data-saved-load="${sv.id}">Load into slip</button>
          <button class="slip-btn quiet" data-saved-copy="${sv.id}">Copy as text</button>
          <button class="slip-btn quiet" data-saved-del="${sv.id}">${slipDeleteArmed === sv.id ? "Tap again to delete" : "Delete"}</button>
        </div>
      </div>`;
    }).join("") : "";

    mainEl.innerHTML = `<div class="bb-intro">Build a slip by tapping any percentage on a fixture card, or the + on a Best Bets pick. Slips are kept in this browser only.</div>` + currentHtml + savedHtml;

    const persist = () => slipSave(SLIP_STORE, slip);
    mainEl.querySelectorAll("[data-slip-remove]").forEach(b => b.addEventListener("click", () => {
      slip.items.splice(+b.dataset.slipRemove, 1); persist(); buildTabs(); renderSlip();
    }));

    const copyText = async (text, btn) => {
      try { await navigator.clipboard.writeText(text); const o = btn.textContent; btn.textContent = "Copied"; setTimeout(() => { btn.textContent = o; }, 1500); }
      catch (e) { btn.textContent = "Copy failed"; }
    };
    const saveBtn = mainEl.querySelector("#slip-save");
    if (saveBtn) saveBtn.addEventListener("click", () => {
      const name = (mainEl.querySelector("#slip-name").value || "").trim();
      savedSlips.unshift({ id: Date.now(), name, savedAt: new Date().toISOString(),
        items: slip.items.map(i => ({ ...i })) });
      slipSave(SLIP_SAVED_STORE, savedSlips);
      slip = { items: [], stake: "" }; persist(); slipJustSaved = true;
      buildTabs(); renderSlip();
    });
    const copyBtn = mainEl.querySelector("#slip-copy");
    if (copyBtn) copyBtn.addEventListener("click", () => copyText(slipText(slip.items, (mainEl.querySelector("#slip-name").value || "").trim()), copyBtn));
    const bankBtnEl = mainEl.querySelector("#slip-bank");
    if (bankBtnEl) bankBtnEl.addEventListener("click", bankFromSlip);
    const clearBtn = mainEl.querySelector("#slip-clear");
    if (clearBtn) clearBtn.addEventListener("click", () => { slip = { items: [], stake: "" }; persist(); slipJustSaved = false; buildTabs(); renderSlip(); });

    mainEl.querySelectorAll("[data-saved-load]").forEach(b => b.addEventListener("click", () => {
      const sv = savedSlips.find(x => String(x.id) === b.dataset.savedLoad); if (!sv) return;
      slip = { items: sv.items.map(i => ({ ...i })), stake: sv.stake || "" }; persist(); slipJustSaved = false; buildTabs(); renderSlip();
      window.scrollTo(0, 0);
    }));
    mainEl.querySelectorAll("[data-saved-copy]").forEach(b => b.addEventListener("click", () => {
      const sv = savedSlips.find(x => String(x.id) === b.dataset.savedCopy); if (sv) copyText(slipText(sv.items, sv.name), b);
    }));
    mainEl.querySelectorAll("[data-saved-del]").forEach(b => b.addEventListener("click", () => {
      const id = Number(b.dataset.savedDel);
      if (slipDeleteArmed === id) {
        savedSlips = savedSlips.filter(x => x.id !== id); slipSave(SLIP_SAVED_STORE, savedSlips); slipDeleteArmed = null;
      } else { slipDeleteArmed = id; }
      renderSlip();
    }));
  }

  // ---------- Track Record ----------
  // Reads BETS_LOG (written by track_bets.py). Everything is pre-computed
  // there per sport ("all" / "football" / "nfl"), so switching sport here
  // is just picking a different block - no maths in the browser.
  function trFmtDate(iso) {
    if (!iso) return "";
    return new Date(iso + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" });
  }

  function trPctClass(p, total) {
    return total === 0 ? "" : p >= 55 ? "pct-hi" : p <= 40 ? "pct-lo" : "";
  }

  function trCategoryLabel(c, showSport) {
    const isWin = c.metric === "team_win" || c.metric === "moneyline";
    const base = isWin ? (c.sport === "nfl" ? "Moneyline" : "Team Win")
      : c.metric === "btts" ? `BTTS ${c.direction}`
      : `${ALL_METRIC_LABELS[c.metric] || c.metric} ${c.direction}`;
    return showSport && c.sport === "nfl" ? `NFL ${base}` : base;
  }

  function trBarRow(label, hits, total, pctVal, note) {
    return `<div class="tr-bar-row">
      <span class="tr-bar-label">${label}</span>
      <div class="tr-bar-wrap"><div class="tr-bar ${pctVal <= 40 ? "lo" : ""}" style="width:${pctVal}%"></div></div>
      <span class="tr-bar-val ${trPctClass(pctVal, total)}">${pctVal}% <span class="tr-chip-n">(${hits}/${total})</span></span>
      ${note ? `<span class="tr-bar-note">${note}</span>` : ""}
    </div>`;
  }

  function trPendingBadge(bucket) {
    const text = { upcoming: "UPCOMING", awaiting: "AWAITING RESULT", overdue: "OVERDUE" }[bucket];
    return `<span class="tr-badge ${bucket === "overdue" ? "tr-overdue" : "tr-pending"}">${text}</span>`;
  }

  function trPendingSection(block, matches) {
    const p = block.pending;
    if (!p.total) return "";
    const parts = [];
    if (p.awaiting) parts.push(`${p.awaiting} awaiting results`);
    if (p.overdue) parts.push(`${p.overdue} overdue`);
    if (p.upcoming) parts.push(`${p.upcoming} upcoming`);

    const rows = matches.map(m => `<div class="tr-pend-row">
      <span class="tr-pend-date">${trFmtDate(m.date)}</span>
      <span class="tr-pend-match">${m.match}<span class="tr-chip-n"> · ${m.league} · ${m.picks} pick${m.picks === 1 ? "" : "s"}</span></span>
      ${trPendingBadge(m.bucket)}
    </div>`).join("");

    return `<details class="tr-pending-box">
      <summary>${p.total} pending pick${p.total === 1 ? "" : "s"} across ${matches.length} match${matches.length === 1 ? "" : "es"} <span class="tr-chip-n">(${parts.join(" · ")})</span></summary>
      <div class="tr-pend-body">
        <div class="tr-note"><b>Awaiting result</b>: played in the last week but not in the results feed yet - football-data.co.uk often lags (see the freshness strip). Picks still without a result more than a week after the match date (usually postponements) are voided automatically and drop out of every count; if a result turns up later they're settled after all. Picks on games rearranged to a known new date are voided as soon as that date is in the fixtures files.</div>
        ${rows}
      </div>
    </details>`;
  }

  function trRecentSection(recent) {
    if (!recent.length) return "";
    const shown = trShowAllRecent ? recent : recent.slice(0, 15);
    const rows = shown.map(r => {
      const isWin = r.metric === "team_win" || r.metric === "moneyline";
      const hit = r.result === "hit";
      return `<div class="bb-row">
        <span class="tr-badge ${hit ? "tr-hit" : "tr-miss"}">${hit ? "HIT" : "MISS"}</span>
        <span class="bb-teams" style="flex:2">${r.label}
          <div class="tr-recent-sub">${r.match} · ${trFmtDate(r.date)} · ${isWin ? "winner" : "actual"} ${r.actual}</div>
        </span>
        <span class="bb-league">${r.league}</span>
        <span class="bb-pct">${Math.round(r.confidence * 100)}%</span>
      </div>`;
    }).join("");
    const toggle = recent.length > 15
      ? `<div class="window-toggle"><a class="sort-toggle-link" data-tr-more="1">${trShowAllRecent ? "Show fewer" : `Show all ${recent.length}`}</a></div>`
      : "";
    return `<div class="tr-section-title">Recent settled picks</div>${rows}${toggle}`;
  }

  function trMarketLabel(m, showSport) {
    const metric = ALL_METRIC_LABELS[m.metric] || m.metric;
    const base = (m.metric === "team_win" || m.metric === "moneyline") ? (m.sport === "nfl" ? "Team to win (moneyline)" : "Team to win")
      : m.metric === "btts" ? `BTTS ${m.direction}`
      : `${m.level === "team" ? "Team" : "Match"} ${metric} ${m.direction} ${m.line}`;
    return showSport && m.sport === "nfl" ? `NFL ${base}` : base;
  }

  function trBreakEvenSection(markets, showSport) {
    if (!markets.length) return "";
    const rows = markets.map(m => `<div class="tr-be-row">
      <span class="tr-be-label">${trMarketLabel(m, showSport)}</span>
      <span class="tr-be-hit ${trPctClass(m.pct, m.total)}">${m.pct}% <span class="tr-chip-n">(${m.hits}/${m.total})</span></span>
      <span class="tr-be-odds"><b>${m.breakeven_odds ? m.breakeven_odds.toFixed(2) : "—"}</b>${m.total < 20 ? ' <span class="tr-chip-n">small sample</span>' : ""}</span>
      <span class="tr-be-odds tr-be-safe">${m.safe_odds ? m.safe_odds.toFixed(2) : "—"}</span>
    </div>`).join("");
    return `<div class="tr-section-title">Break-even odds</div>
      <div class="tr-note">The decimal odds each market needed to break even at its hit rate so far (flat stakes). If the price you can get is above the number, the picks so far would have made money at that price; below it, lost money. <b>Safe</b> uses a pessimistic hit rate that allows for small samples - the more picks, the closer the two numbers get. Includes picks the calibration filter kept out of Best Bets, so every market keeps being measured. Compare against real prices: this isn't the bookmaker's price, just the bar it has to beat.</div>
      <div class="tr-be-row tr-be-head"><span class="tr-be-label">Market</span><span class="tr-be-hit">Hit rate</span><span class="tr-be-odds">Break-even</span><span class="tr-be-odds tr-be-safe">Safe</span></div>
      ${rows}`;
  }

  // All / Football / NFL switch, shared by Track Record and Odds & Calibration.
  function trSportToggleHtml() {
    const hasNfl = BETS_LOG.blocks.nfl.overall.total > 0 || BETS_LOG.blocks.nfl.pending.total > 0;
    return `<div class="tr-sport-toggle">${[["all", "All"], ["football", "Football"], ["nfl", "NFL"]]
      .filter(([key]) => key !== "nfl" || hasNfl)
      .map(([key, name]) => `<a data-tr-sport="${key}" class="${trSport === key ? "tr-sport-active" : ""}">${name}</a>`).join("")}</div>`;
  }

  function bindTrSportToggle(rerender) {
    mainEl.querySelectorAll("[data-tr-sport]").forEach(link => {
      link.addEventListener("click", () => { trSport = link.dataset.trSport; rerender(); });
    });
  }

  // The 80% check: picks rated 80%+, and the 80-87% slice on its own.
  function trEightySection(at80) {
    if (!at80 || !at80.all || !at80.all.total) return "";
    const row = (label, d) => {
      if (!d.total) return "";
      const gap = d.pct - d.avg_confidence;
      const verdict = d.total < 20 ? "small sample"
        : gap >= -3 ? "on target" : gap >= -8 ? "slightly over-confident" : "over-confident";
      return `<div class="tr-be-row">
        <span class="tr-be-label">${label}</span>
        <span class="tr-be-hit ${trPctClass(d.pct, d.total)}">${d.pct}% <span class="tr-chip-n">(${d.hits}/${d.total})</span></span>
        <span class="tr-be-odds"><b>${d.avg_confidence}%</b></span>
        <span class="tr-be-odds tr-be-safe">${d.breakeven_odds ? d.breakeven_odds.toFixed(2) : "—"}</span>
      </div>
      <div class="tr-note" style="margin:-2px 0 8px">${verdict}</div>`;
    };
    const low = at80.low;
    const lowMarkets = low.markets.filter(m => m.total >= 2).map(m => `<div class="tr-be-row">
        <span class="tr-be-label">${trMarketLabel(m, trSport === "all")}</span>
        <span class="tr-be-hit ${trPctClass(m.pct, m.total)}">${m.pct}% <span class="tr-chip-n">(${m.hits}/${m.total})</span></span>
        <span class="tr-be-odds"><b>${m.avg_confidence}%</b></span>
        <span class="tr-be-odds tr-be-safe">${m.breakeven_odds ? m.breakeven_odds.toFixed(2) : "—"}</span>
      </div>`).join("");
    return `<div class="tr-section-title">80% check</div>
      <div class="tr-note">Picks the model rated 80% or higher, against how often they actually landed. <b>80-87%</b> is the slice that only reaches Best Bets because some markets have a bar below the default 87% (team to win, corners Over 7.5), so it is where over-confidence would show first. Break-even is the decimal odds needed to profit at that hit rate.</div>
      <div class="tr-be-row tr-be-head"><span class="tr-be-label">Rated</span><span class="tr-be-hit">Landed</span><span class="tr-be-odds">Said</span><span class="tr-be-odds tr-be-safe">Break-even</span></div>
      ${row("80%+ (all)", at80.all)}${row("80-87% only", low)}
      ${lowMarkets ? `<div class="tr-note">80-87% picks by market:</div>${lowMarkets}` : ""}`;
  }

  // ---- Racing revision guide (data from racing.py -> racing_data.js) ----
  let racingCode = "flat";
  let racingWindow = "all";
  let racingCourse = "";
  let racingCourseSort = "races";
  let racingFavBand = "";
  let racingView = "today";      // "today" or "history"
  let racingTodayFilter = "";    // "", Strong, Good, Open, Avoid
  let racingTodaySort = "time";
  let racingTodaySec3 = 0;       // minimum 2nd-favourite top-3 chance (%), 0 = any
  let racingTodayRegion = "";    // "", uk, ire
  try {
    const sv = localStorage.getItem("racingCode");
    if (sv === "flat" || sv === "jumps") racingCode = sv;
  } catch (e) {}

  function racingRoiClass(roi, n) { return n < 30 ? "" : roi > 0 ? "pct-hi" : roi <= -12 ? "pct-lo" : ""; }

  function racingRows(items, titleName, winLabel) {
    if (!items || !items.length) return "";
    const rows = items.map(m => `<div class="tr-be-row">
      <span class="tr-be-label">${escAttr(m.name)}${m.n < 30 ? ' <span class="tr-chip-n">small sample</span>' : ""}</span>
      <span class="tr-be-hit">${m.fav}% <span class="tr-chip-n">(${m.n})</span></span>
      <span class="tr-be-odds ${racingRoiClass(m.roi, m.n)}"><b>${m.roi > 0 ? "+" : ""}${m.roi}%</b></span>
      <span class="tr-be-odds tr-be-safe">${m.top3}%</span>
    </div>`).join("");
    return `<div class="tr-section-title">${titleName}</div>
      <div class="tr-be-row tr-be-head"><span class="tr-be-label"></span><span class="tr-be-hit">${winLabel || "Fav wins"}</span><span class="tr-be-odds">${winLabel ? "ROI" : "Fav ROI"}</span><span class="tr-be-odds tr-be-safe">Top 3</span></div>${rows}`;
  }

  // Average / median winning price per group (e.g. per race type).
  function racingPriceRows(items, titleName) {
    if (!items || !items.length) return "";
    const rows = items.map(m => `<div class="tr-be-row">
      <span class="tr-be-label">${escAttr(m.name)}${m.n < 30 ? ' <span class="tr-chip-n">small sample</span>' : ""}</span>
      <span class="tr-be-hit"><b>${m.avgw.toFixed(1)}</b></span>
      <span class="tr-be-odds">${m.medw.toFixed(1)}</span>
      <span class="tr-be-odds tr-be-safe">${m.n}</span>
    </div>`).join("");
    return `<div class="tr-section-title">${titleName}</div>
      <div class="tr-note">Betfair Starting Price of the winner. The average is pulled up by the odd big-priced winner, so the median (the typical winner) is shown too.</div>
      <div class="tr-be-row tr-be-head"><span class="tr-be-label"></span><span class="tr-be-hit">Average</span><span class="tr-be-odds">Median</span><span class="tr-be-odds tr-be-safe">Races</span></div>${rows}`;
  }

  // Which horse in the betting wins: favourite, 2nd favourite and so on.
  function racingMarketPosition(items) {
    if (!items || !items.length) return "";
    const rows = items.map(m => `<div class="tr-be-row">
      <span class="tr-be-label">${escAttr(m.name)}</span>
      <span class="tr-be-hit">${m.share}% <span class="tr-chip-n">(${m.n})</span></span>
      <span class="tr-be-odds ${m.roi === undefined ? "" : racingRoiClass(m.roi, 100)}"><b>${m.roi === undefined ? "-" : (m.roi > 0 ? "+" : "") + m.roi + "%"}</b></span>
      <span class="tr-be-odds tr-be-safe">${m.avgp ? m.avgp.toFixed(2) : "-"}</span>
    </div>`).join("");
    return `<div class="tr-section-title">Which horse wins: market position</div>
      <div class="tr-note">Share of races won by the favourite, the 2nd favourite and so on, and what you'd have made backing that position in every race at Betfair Starting Price (after commission). Average price is what that position typically was.</div>
      <div class="tr-be-row tr-be-head"><span class="tr-be-label"></span><span class="tr-be-hit">Races won</span><span class="tr-be-odds">ROI</span><span class="tr-be-odds tr-be-safe">Avg price</span></div>${rows}`;
  }

  // Second favourites in detail (needs sec_bsp in the data).
  function racingSecond(sec) {
    if (!sec || !sec.overall || !sec.overall.n) return "";
    const o = sec.overall;
    const chip = (label, val, cls) => `<div class="tr-category-chip"><span>${label}</span><span class="${cls || ""}"><b>${val}</b></span></div>`;
    return `<div class="tr-section-title">Second favourites</div>
      <div class="tr-summary">
        <div class="tr-summary-main"><span class="tr-summary-pct">${o.fav}%</span>
          <span class="tr-summary-label">of 2nd favourites won, from ${o.n.toLocaleString("en-GB")} races</span></div>
        <div class="tr-category-grid">
          ${chip("2nd favourite ROI", (o.roi > 0 ? "+" : "") + o.roi + "%", racingRoiClass(o.roi, o.n))}
          ${chip("Average price", o.favp.toFixed(2))}
          ${chip("Average price when they win", o.avgw ? o.avgw.toFixed(1) : "-")}
        </div></div>`
      + racingRows(sec.by_price, "2nd favourite by price", "Wins")
      + racingRows(sec.by_type, "2nd favourite by race type", "Wins")
      + racingRows(sec.by_dist, "2nd favourite by distance", "Wins")
      + racingRows(sec.by_field, "2nd favourite by field size", "Wins");
  }

  function racingHeadline(o) {
    if (!o || !o.n) return `<div class="empty">No races in this selection.</div>`;
    const chip = (label, val, cls) => `<div class="tr-category-chip"><span>${label}</span><span class="${cls || ""}"><b>${val}</b></span></div>`;
    return `<div class="tr-summary">
      <div class="tr-summary-main">
        <span class="tr-summary-pct">${o.fav}%</span>
        <span class="tr-summary-label">favourites won, from ${o.n.toLocaleString("en-GB")} races</span>
      </div>
      <div class="tr-category-grid">
        ${chip("Favourite ROI", (o.roi > 0 ? "+" : "") + o.roi + "%", racingRoiClass(o.roi, o.n))}
        ${chip("Winner in top 3", o.top3 + "%")}
        ${chip("Avg favourite price", o.favp.toFixed(2))}
        ${chip("Average winner price", o.avgw.toFixed(1))}
        ${chip("Median winner price", o.medw.toFixed(1))}
      </div></div>`;
  }

  // ---- Today's races, matched to the race-profile ratings ----
  const RC_TIER_ORDER = ["Strong", "Good", "Open", "Avoid"];
  const RC_FIELD_BANDS = [[6, "6 or fewer"], [9, "7-9"], [12, "10-12"], [16, "13-16"], [999, "17+"]];
  const rcFieldBand = n => RC_FIELD_BANDS.find(([max]) => n <= max)[1];

  function racingViewToggle() {
    return `<div class="tr-sport-toggle">${[["today", "Today's races"], ["results", "Results"], ["history", "History"], ["compare", "UK v Ireland"]]
      .map(([k, n]) => `<a data-rc-view="${k}" class="${racingView === k ? "tr-sport-active" : ""}">${n}</a>`).join("")}</div>`;
  }
  function bindRacingView() {
    mainEl.querySelectorAll("[data-rc-view]").forEach(a => a.addEventListener("click", () => { racingView = a.dataset.rcView; renderRacing(); }));
  }

  // Rates one race from its kind (flat/jumps + race type) and its exact
  // field size, using the fitted curves in RACING_DATA.guide.models.
  // Falls back to the code-level curve for rare race types.
  function rcLookup(r) {
    // Irish races use the Irish ratings once that data is loaded, else the UK ones.
    const irishOk = r.region === "ire" && typeof RACING_DATA_IRE !== "undefined" && RACING_DATA_IRE.guide && RACING_DATA_IRE.guide.models;
    const g = irishOk ? RACING_DATA_IRE.guide : RACING_DATA.guide;
    if (!g || !g.models) return null;
    const own = g.models[`${r.code}|${r.rtype}`];
    const m = own || g.models[r.code];
    if (!m) return null;
    const z = Math.log(Math.min(Math.max(r.runners, 2), 30)) - 2.3;
    const pr = k => {
      const b = m[k] || (g.models[r.code] || {})[k];
      return b ? Math.round(100 / (1 + Math.exp(-(b[0] + b[1] * z)))) : null;
    };
    const fav = pr("fav");
    const tier = fav >= 45 ? "Strong" : fav >= 35 ? "Good" : fav >= 27 ? "Open" : "Avoid";
    const big = r.runners >= 8;   // top-3 finish is only measured in fields of 8+ (3 places paid)
    return { n: m.n, fav, sec: pr("sec"), top3: pr("top3"), sec3: big ? pr("sec3") : null, fav3: big ? pr("fav3") : null, tier, level: own ? "kind" : "code", src: irishOk || r.region !== "ire" ? (r.region === "ire" ? "ire" : "uk") : "uk-fallback" };
  }

  function rcCourseNote(r) {
    const grp = r.code === "flat" ? "flat" : "jumps";
    const src = r.region === "ire" && typeof RACING_DATA_IRE !== "undefined" && RACING_DATA_IRE.codes ? RACING_DATA_IRE : RACING_DATA;
    const codeData = src.codes[grp];
    if (!codeData) return "";
    const courses = codeData.windows.all.courses;
    const key = Object.keys(courses).find(c => c.toLowerCase() === r.course.toLowerCase());
    if (!key) return "";
    const c = courses[key].overall;
    if (c.n < 100) return "";
    return ` &middot; ${escAttr(key)} favs ${c.fav}% <span class="tr-chip-n">(${grp} avg ${codeData.windows.all.overall.fav}%)</span>`;
  }

  function rcScorecard() {
    if (typeof RACING_RESULTS === "undefined" || !RACING_RESULTS.races || !RACING_RESULTS.races.length) {
      return `<div class="tr-section-title">Results scorecard</div><div class="tr-note">No outcomes recorded yet. The workflow records finished races each morning and evening; the first ones appear after its next run.</div>`;
    }
    const tiers = ["Strong", "Good", "Open", "Avoid"];
    const acc = {};
    const add = (k, f) => { const a = acc[k] || (acc[k] = { n: 0, predFav: 0, fav: 0, favN: 0, predSec: 0, secN: 0, sec3: 0, predSec3: 0, sec3N: 0, top3: 0, predTop3: 0, top3N: 0 }); f(a); };
    let total = 0;
    for (const r of RACING_RESULTS.races) {
      const rate = rcLookup({ region: r.region || "uk", code: r.code, rtype: r.rtype, runners: r.ran });
      if (!rate) continue;
      total++;
      for (const k of ["all", rate.tier, "R" + (r.region || "uk")]) add(k, a => {
        a.n++;
        if (r.fav != null) { a.favN++; a.fav += r.fav; a.predFav += rate.fav; }
        if (r.win_rank != null) { a.top3N++; a.top3 += r.win_rank <= 3 ? 1 : 0; a.predTop3 += rate.top3 ?? 0; }
        if (r.sec_pos != null && rate.sec3 != null) { a.sec3N++; a.sec3 += r.sec_pos >= 1 && r.sec_pos <= 3 ? 1 : 0; a.predSec3 += rate.sec3; }
      });
    }
    const pct = (x, n) => n ? Math.round(100 * x / n) + "%" : "-";
    const line = (label, a) => a ? `<tr><td>${label}</td><td>${a.n}</td><td>${pct(a.fav, a.favN)}</td><td>${a.favN ? Math.round(a.predFav / a.favN) + "%" : "-"}</td><td>${pct(a.top3, a.top3N)}</td><td>${a.top3N ? Math.round(a.predTop3 / a.top3N) + "%" : "-"}</td><td>${a.sec3N ? pct(a.sec3, a.sec3N) + " / " + Math.round(a.predSec3 / a.sec3N) + "%" : "-"}</td></tr>` : "";
    const rows = [line("All races", acc.all), ...tiers.map(t => line(t, acc[t])), line("UK", acc.Ruk), line("Ireland", acc.Rire)].join("");
    const small = acc.all && acc.all.n < 100 ? `<div class="tr-note"><b>Small sample so far (${acc.all.n} races).</b> Hit rates move a lot on a few results; treat anything under about 100 races per row as noise.</div>` : "";
    const recent = [...RACING_RESULTS.races].reverse().slice(0, 12).map(r => {
      const rate = rcLookup({ region: r.region || "uk", code: r.code, rtype: r.rtype, runners: r.ran });
      const res = r.fav == null ? "favourite tied" : r.fav ? "fav won" : `fav ${r.fav_pos ? "finished " + r.fav_pos : "did not finish"}`;
      return `<div class="tr-pend-row"><b>${r.date.slice(5)} ${r.time}</b> ${escAttr(r.course)} ${rate ? `<span class="rc-tier rc-tier-${rate.tier.toLowerCase()}">${rate.tier}</span> predicted fav ${rate.fav}%` : ""} &rarr; ${res}${r.win_rank ? `, winner was ${r.win_rank}${["th","st","nd","rd"][r.win_rank % 100 > 10 && r.win_rank % 100 < 14 ? 0 : Math.min(r.win_rank % 10, 4) % 4]} in the betting` : ""}</div>`;
    }).join("");
    return `<div class="tr-section-title">Results scorecard</div>
      <div class="tr-note">Every finished race since recording began, scored against the rating that race kind gets today. <b>Actual</b> = how often it happened, <b>Pred</b> = what the ratings said on average. Updated ${escAttr(RACING_RESULTS.updated || "")} UK time.</div>
      ${small}
      <table class="rc-score"><thead><tr><th></th><th>Races</th><th>Fav won</th><th>Pred</th><th>Winner top 3 in betting</th><th>Pred</th><th>2nd fav top 3 (actual / pred)</th></tr></thead><tbody>${rows}</tbody></table>
      <details class="tr-pending-box"><summary>Latest results</summary><div class="tr-pend-body">${recent}</div></details>`;
  }

  function renderRacingToday() {
    const intro = `<div class="bb-intro">Today's UK and Irish races, each rated from how that kind of race (flat or jumps, race type) has played out over the last ${RACING_DATA.codes.flat.seasons.length} seasons, adjusted for the exact number of runners. Distance and course were tested and added nothing reliable, so they're shown for context only. <b>Strong</b> = the favourite usually wins, <b>Avoid</b> = wide open, favourites rarely win. This shows how <i>predictable</i> a race is, not whether a price is good value: the market already prices these patterns in, and backtesting found no lasting profit from them.</div>`;
    const cardOk = typeof RACING_TODAY !== "undefined" && RACING_TODAY.races && RACING_TODAY.races.length;
    if (!cardOk || !RACING_DATA.guide) {
      mainEl.innerHTML = racingViewToggle() + intro + `<div class="empty">${!RACING_DATA.guide ? "The race ratings aren't in racing_data.js yet." : "No racecard loaded yet."}<br>${!RACING_DATA.guide ? "Upload the latest racing_data.js." : "It's fetched each morning by the &quot;Update Today's Races&quot; workflow (or run racing_today.py)."}</div>`;
      bindRacingView();
      return;
    }
    const today = new Date().toLocaleDateString("en-CA", { timeZone: "Europe/London" });
    const stale = RACING_TODAY.date === today ? ""
      : RACING_TODAY.date > today
        ? `<div class="tr-note"><b>This is the card for ${RACING_TODAY.date} (tomorrow).</b> It switches to the day's own card at the morning refresh.</div>`
        : `<div class="tr-note"><b>This card is for ${RACING_TODAY.date}</b>, not today. It refreshes each morning and evening.</div>`;
    const allRows = RACING_TODAY.races.map(r => ({ region: "uk", ...r, rate: rcLookup({ region: "uk", ...r }) })).filter(r => r.rate);
    const hasIre = allRows.some(r => r.region === "ire");
    if (!hasIre) racingTodayRegion = "";
    const rows = allRows.filter(r => !racingTodayRegion || r.region === racingTodayRegion);
    const regionToggle = hasIre ? `<div class="tr-sport-toggle">${[["", "All"], ["uk", "UK"], ["ire", "Ireland"]]
      .map(([k, n]) => `<a data-rc-rg="${k}" class="${racingTodayRegion === k ? "tr-sport-active" : ""}">${n}</a>`).join("")}</div>` : "";
    const counts = {};
    rows.forEach(r => { counts[r.rate.tier] = (counts[r.rate.tier] || 0) + 1; });

    const chips = `<div class="tr-sport-toggle" style="flex-wrap:wrap">${[["", `All (${rows.length})`], ...RC_TIER_ORDER.map(t => [t, `${t} (${counts[t] || 0})`])]
      .map(([k, n]) => `<a data-rc-tf="${k}" class="${racingTodayFilter === k ? "tr-sport-active" : ""}">${n}</a>`).join("")}</div>`;
    const hasSec3 = rows.some(r => r.rate.sec3 != null);
    if (!hasSec3) racingTodaySec3 = 0;
    const sorts = [["time", "Time"], ["fav", "Favourite %"], ["sec", "2nd fav %"], ["top3", "Top 3 %"], ...(hasSec3 ? [["sec3", "2nd fav top 3 %"]] : [])];
    const sec3Chips = hasSec3
      ? `<div class="tr-sport-toggle" style="flex-wrap:wrap"><span class="tr-chip-n" style="align-self:center;margin-right:6px">2nd fav finishes top 3:</span>${[[0, "Any"], [50, "50%+"], [60, "60%+"], [70, "70%+"]]
          .map(([k, n]) => `<a data-rc-s3="${k}" class="${racingTodaySec3 === k ? "tr-sport-active" : ""}">${n}</a>`).join("")}</div>`
      : `<div class="tr-note">2nd-favourite top-3 chances need place-market data. Run <b>python3 racing.py --places</b> once (and the same with <b>--region ire</b>) to add them.</div>`;
    const sortLine = `<div class="window-toggle">Sort: ${sorts.map(([k, n]) => `<a class="sort-toggle-link" data-rc-ts="${k}"${racingTodaySort === k ? ' style="color:var(--ink);font-weight:700"' : ""}>${n}</a>`).join(" &middot; ")}</div>`;

    const reliable = rows.filter(r => r.rate.level !== "code");
    const top = (key, dir, n) => reliable.filter(r => r.rate[key] != null).sort((a, b) => dir * ((b.rate[key] ?? -1) - (a.rate[key] ?? -1))).slice(0, n);
    const li = (r, key) => `<b>${r.time}</b> ${escAttr(r.course)} <span class="tr-chip-n">${r.rate[key]}%</span>`;
    const summary = rows.length >= 6 ? `<div class="tr-section-title">Today at a glance</div>
      <div class="tr-note"><b>Favourite most likely:</b> ${top("fav", 1, 3).map(r => li(r, "fav")).join(" &middot; ")}<br>
      <b>Winner most likely from the top 3 in the betting:</b> ${top("top3", 1, 3).map(r => li(r, "top3")).join(" &middot; ")}<br>
      <b>Best for a 2nd favourite:</b> ${top("sec", 1, 3).map(r => li(r, "sec")).join(" &middot; ")} <span class="tr-chip-n">(weaker pattern)</span><br>
      ${hasSec3 ? `<b>2nd favourite most likely to finish top 3:</b> ${top("sec3", 1, 3).map(r => li(r, "sec3")).join(" &middot; ")}<br>` : ""}<b>Most open, treat with care:</b> ${top("fav", -1, 3).map(r => li(r, "fav")).join(" &middot; ")}</div>` : "";

    let shown = rows.filter(r => (!racingTodayFilter || r.rate.tier === racingTodayFilter)
      && (!racingTodaySec3 || (r.rate.sec3 != null && r.rate.sec3 >= racingTodaySec3)));
    if (racingTodaySort !== "time") shown = [...shown].sort((a, b) => (b.rate[racingTodaySort] ?? -1) - (a.rate[racingTodaySort] ?? -1));
    const typeLabel = r => `${{ flat: "Flat", hurdle: "Hurdle", chase: "Chase", bumper: "Bumper" }[r.code]} ${r.rtype}`;
    const list = shown.map(r => `<div class="rc-race">
      <div class="rc-race-top"><span class="rc-time">${r.time}</span><span class="rc-course">${escAttr(r.course)}${r.region === "ire" ? ' <span class="tr-chip-n">IRE</span>' : ""}</span>
        <span class="rc-tier rc-tier-${r.rate.tier.toLowerCase()}">${r.rate.tier}</span></div>
      <div class="rc-race-sub">${escAttr(r.name)}<br>${typeLabel(r)} &middot; ${r.distance || "?"} &middot; ${r.runners} runners${r.going ? " &middot; " + escAttr(r.going) : ""}</div>
      <div class="rc-race-stats">Fav wins <b>${r.rate.fav}%</b> &middot; 2nd fav <b>${r.rate.sec ?? "-"}%</b> &middot; winner in top 3 <b>${r.rate.top3}%</b>${r.rate.sec3 != null ? ` &middot; 2nd fav top 3 <b>${r.rate.sec3}%</b>` : ""}
        <span class="tr-chip-n">(${r.rate.level === "kind" ? `${r.rate.n.toLocaleString("en-GB")} ${r.region === "ire" && r.rate.src === "ire" ? "Irish " : ""}${r.rtype.toLowerCase()} races` : "broad flat/jumps average only"}${r.rate.src === "uk-fallback" ? ", UK ratings used - Irish data not loaded" : ""})</span>${rcCourseNote(r)}</div>
    </div>`).join("");

    mainEl.innerHTML = racingViewToggle() + intro + stale + regionToggle + chips + sec3Chips + summary + sortLine
      + (shown.length ? list : `<div class="empty">No races in this group today.</div>`)
      + `<div class="tr-note">Card from Sporting Life, ${escAttr(RACING_TODAY.generated || "")} UK time. Irish races use the Irish ratings once the Irish data is loaded. Field sizes are declared runners so far and can change. Race kinds and thresholds come from racing.py.</div>`;
    bindRacingView();
    mainEl.querySelectorAll("[data-rc-rg]").forEach(a => a.addEventListener("click", () => { racingTodayRegion = a.dataset.rcRg; renderRacingToday(); }));
    mainEl.querySelectorAll("[data-rc-s3]").forEach(a => a.addEventListener("click", () => { racingTodaySec3 = +a.dataset.rcS3; renderRacingToday(); }));
    mainEl.querySelectorAll("[data-rc-tf]").forEach(a => a.addEventListener("click", () => { racingTodayFilter = a.dataset.rcTf; renderRacingToday(); }));
    mainEl.querySelectorAll("[data-rc-ts]").forEach(a => a.addEventListener("click", () => { racingTodaySort = a.dataset.rcTs; renderRacingToday(); }));
  }

  // ---- UK v Ireland ----
  function renderRacingCompare() {
    const toggle = racingViewToggle();
    const intro = `<div class="bb-intro">Do fewer favourites win in Irish racing? Betfair Starting Price results for Irish and UK races over the same period, compared two ways: the raw averages, and like-for-like (Irish races against UK races of the same kind and number of runners), because Ireland runs a different mix of races.</div>`;
    if (typeof RACING_DATA_IRE === "undefined" || !RACING_DATA_IRE.codes) {
      mainEl.innerHTML = toggle + intro + `<div class="empty">The Irish data isn't loaded yet.<br>Build it once from your phone: in a-Shell run <b>python3 racing.py --region ire --start 2023-05-01</b>, then upload racing_data_ire.js and data/racing_races_ire.csv.</div>`;
      bindRacingView();
      return;
    }
    const UK = RACING_DATA, IE = RACING_DATA_IRE;
    const code = racingCode === "jumps" ? "jumps" : "flat";
    const codeToggle = `<div class="tr-sport-toggle">${[["flat", "Flat"], ["jumps", "Jumps"]]
      .map(([k, n]) => `<a data-rc-code="${k}" class="${code === k ? "tr-sport-active" : ""}">${n}</a>`).join("")}</div>`;
    const uk = UK.codes[code].windows.all, ie = IE.codes[code] ? IE.codes[code].windows.all : null;
    if (!ie || !ie.overall.n) {
      mainEl.innerHTML = toggle + codeToggle + intro + `<div class="empty">No Irish ${code} races stored.</div>`;
      bindRacingView(); bindCmpCode(); return;
    }
    const z2 = (a, b) => {   // two-proportion z for favourite win %
      const p1 = a.fav / 100, p2 = b.fav / 100, n1 = a.n, n2 = b.n, p = (p1 * n1 + p2 * n2) / (n1 + n2);
      const se = Math.sqrt(p * (1 - p) * (1 / n1 + 1 / n2));
      return se ? (p2 - p1) / se : 0;
    };
    const diffCell = (a, b) => {
      if (!a || !b || !a.n || !b.n) return `<span class="tr-be-odds">-</span>`;
      const d = Math.round((b.fav - a.fav) * 10) / 10, z = z2(a, b);
      const cls = Math.abs(z) < 2 || Math.min(a.n, b.n) < 30 ? "" : d < 0 ? "pct-lo" : "pct-hi";
      return `<span class="tr-be-odds ${cls}"><b>${d > 0 ? "+" : ""}${d}</b></span>`;
    };
    const row = (label, a, b) => `<div class="tr-be-row">
      <span class="tr-be-label">${escAttr(label)}</span>
      <span class="tr-be-hit">${a ? a.fav + "%" : "-"} <span class="tr-chip-n">(${a ? a.n : 0})</span></span>
      <span class="tr-be-hit">${b ? b.fav + "%" : "-"} <span class="tr-chip-n">(${b ? b.n : 0})</span></span>
      ${diffCell(a, b)}</div>`;
    const head = `<div class="tr-be-row tr-be-head"><span class="tr-be-label"></span><span class="tr-be-hit">UK</span><span class="tr-be-hit">Ireland</span><span class="tr-be-odds">Diff (pts)</span></div>`;
    const byName = (arr, name) => (arr || []).find(x => x.name === name);
    const section = (title, ukArr, ieArr, order) => {
      const names = order || (ieArr || []).map(x => x.name);
      const rows = names.map(n => ({ n, a: byName(ukArr, n), b: byName(ieArr, n) })).filter(r => r.a || r.b)
        .map(r => row(r.n, r.a, r.b)).join("");
      return rows ? `<div class="tr-section-title">${title}</div>${head}${rows}` : "";
    };

    const o1 = uk.overall, o2 = ie.overall;
    const headline = `<div class="tr-section-title">Headline</div>${head}${row("Favourite win %", o1, o2)}
      <div class="tr-be-row"><span class="tr-be-label">Favourite ROI at BSP</span><span class="tr-be-hit">${o1.roi > 0 ? "+" : ""}${o1.roi}%</span><span class="tr-be-hit">${o2.roi > 0 ? "+" : ""}${o2.roi}%</span><span class="tr-be-odds"></span></div>
      <div class="tr-be-row"><span class="tr-be-label">Winner in top 3</span><span class="tr-be-hit">${o1.top3}%</span><span class="tr-be-hit">${o2.top3}%</span><span class="tr-be-odds"></span></div>
      <div class="tr-be-row"><span class="tr-be-label">Median winner price</span><span class="tr-be-hit">${o1.medw}</span><span class="tr-be-hit">${o2.medw}</span><span class="tr-be-odds"></span></div>
      <div class="tr-be-row"><span class="tr-be-label">Avg field size</span><span class="tr-be-hit">-</span><span class="tr-be-hit">-</span><span class="tr-be-odds"></span></div>`.replace(/<div class="tr-be-row"><span class="tr-be-label">Avg field size[\s\S]*?<\/div>/, "");

    const jumpsCodes = code === "jumps"
      ? section("Hurdle, chase or bumper", uk.by_code.map(m => ({ ...m, name: { hurdle: "Hurdles", chase: "Chases", bumper: "Bumpers" }[m.name] || m.name })), ie.by_code.map(m => ({ ...m, name: { hurdle: "Hurdles", chase: "Chases", bumper: "Bumpers" }[m.name] || m.name }))) : "";
    const body = headline + jumpsCodes
      + section("By race type", uk.by_type, ie.by_type)
      + section("By field size", uk.by_field, ie.by_field, ["6 or fewer", "7-9", "10-12", "13-16", "17+"])
      + section("By distance", uk.by_dist, ie.by_dist)
      + section("By the favourite's price", uk.by_favprice, ie.by_favprice, ["Under 2.0", "2.0-3.0", "3.0-5.0", "5.0+"]);

    // Like-for-like: Irish results against UK races of the same kind and field size.
    let like = "";
    const v = IE.vs_uk;
    if (v && v.overall && v.overall.fav) {
      const verdict = m => {
        if (!m || !m.fav) return "";
        const z = m.fav.z, gap = Math.round((m.fav.actual - m.fav.expected) * 10) / 10;
        if (Math.abs(z) < 2) return `no clear difference (${gap > 0 ? "+" : ""}${gap} pts)`;
        return z < 0 ? `fewer favourites win: ${gap} pts` : `more favourites win: +${gap} pts`;
      };
      const g = v.by_group[code];
      const lrow = (label, m) => m && m.fav ? `<div class="tr-be-row"><span class="tr-be-label">${escAttr(label)} <span class="tr-chip-n">(${m.n})</span></span>
        <span class="tr-be-hit">${m.fav.actual}%</span><span class="tr-be-hit">${m.fav.expected}%</span>
        <span class="tr-be-odds ${Math.abs(m.fav.z) >= 2 && m.n >= 30 ? (m.fav.z < 0 ? "pct-lo" : "pct-hi") : ""}"><b>${m.fav.z > 0 ? "+" : ""}${m.fav.z}</b></span></div>` : "";
      const lhead = `<div class="tr-be-row tr-be-head"><span class="tr-be-label"></span><span class="tr-be-hit">Irish actual</span><span class="tr-be-hit">UK-like expected</span><span class="tr-be-odds">z</span></div>`;
      const types = Object.entries(v.by_type).filter(([, m]) => m.fav && (code === "flat" ? true : true)).map(([t, m]) => lrow(t, m)).join("");
      like = `<div class="tr-section-title">Like-for-like (favourite win %)</div>
        <div class="tr-note"><b>Overall, Irish ${code} racing: ${verdict(g)}.</b> "Expected" is what UK races of the same kind (flat/jumps, race type) and the same field size would produce. <b>z</b> is how many standard errors apart they are: beyond about 2 (or -2) is unlikely to be chance.${g && g.sec ? `<br>Second favourites: actual ${g.sec.actual}% v ${g.sec.expected}% expected (z ${g.sec.z}). Winner in top 3: ${g.top3.actual}% v ${g.top3.expected}% (z ${g.top3.z}).` : ""}</div>
        ${lhead}${lrow("All Irish " + code, g)}${lrow("Both codes", v.overall)}
        <div class="tr-note">By race type (flat and jumps together):</div>${lhead}${types}`;
    } else {
      like = `<div class="tr-note">The like-for-like comparison needs the UK data next to racing.py when the Irish set is built. Re-run <b>python3 racing.py --region ire</b> from the same folder as the UK data.</div>`;
    }

    mainEl.innerHTML = toggle + codeToggle + intro
      + `<div class="tr-note">Irish data: ${IE.races_stored.toLocaleString("en-GB")} races, ${trFmtDate(IE.codes[code].first_date)} ${IE.codes[code].first_date.slice(0, 4)} to ${trFmtDate(IE.codes[code].last_date)} ${IE.codes[code].last_date.slice(0, 4)}. Difference columns are coloured only when the gap is unlikely to be chance and both samples are at least 30 races.</div>`
      + like + body;
    bindRacingView(); bindCmpCode();
  }
  function bindCmpCode() {
    mainEl.querySelectorAll("[data-rc-code]").forEach(a => a.addEventListener("click", () => {
      racingCode = a.dataset.rcCode;
      try { localStorage.setItem("racingCode", racingCode); } catch (e) {}
      renderRacingCompare();
    }));
  }

  function renderRacing() {
    if (typeof RACING_DATA !== "undefined" && RACING_DATA.codes && racingView === "today") { renderRacingToday(); return; }
    if (typeof RACING_DATA !== "undefined" && RACING_DATA.guide && racingView === "results") {
      mainEl.innerHTML = racingViewToggle() + rcScorecard();
      bindRacingView();
      return;
    }
    if (typeof RACING_DATA !== "undefined" && RACING_DATA.codes && racingView === "compare") { renderRacingCompare(); return; }
    renderRacingHistory();
  }

  function renderRacingHistory() {
    if (typeof RACING_DATA === "undefined" || !RACING_DATA.codes) {
      mainEl.innerHTML = `<div class="empty">No racing data yet.<br>It is built by racing.py in the "Update Racing Guide" workflow. Run it once from the Actions tab to load the history, then it updates daily.</div>`;
      return;
    }
    const code = RACING_DATA.codes[racingCode] || RACING_DATA.codes.flat;
    if (!code.windows[racingWindow]) racingWindow = "all";
    const win = code.windows[racingWindow];
    const courseNames = Object.keys(code.windows.all.courses).sort();
    if (racingCourse && !win.courses[racingCourse]) racingCourse = "";

    const codeToggle = `<div class="tr-sport-toggle">${[["flat", "Flat"], ["jumps", "Jumps"]]
      .map(([k, n]) => `<a data-rc-code="${k}" class="${racingCode === k ? "tr-sport-active" : ""}">${n}</a>`).join("")}</div>`;
    const seasonLabel = s => s === code.current ? `${s} (so far)` : s;
    const windows = [["all", `Last ${code.seasons.length} seasons`], ...code.seasons.map(s => [s, seasonLabel(s)])];
    const windowToggle = `<div class="tr-sport-toggle">${windows
      .map(([k, n]) => `<a data-rc-win="${k}" class="${racingWindow === k ? "tr-sport-active" : ""}">${n}</a>`).join("")}</div>`;
    const favToggle = `<div class="tr-sport-toggle" style="flex-wrap:wrap"><span class="tr-chip-n" style="align-self:center;margin-right:6px">Favourite priced:</span>${[["", "Any"], ...["Under 2.0", "2.0-3.0", "3.0-5.0", "5.0+"].map(b => [b, b])]
      .map(([k, n]) => `<a data-rc-fb="${k}" class="${racingFavBand === k ? "tr-sport-active" : ""}">${n}</a>`).join("")}</div>`;
    const courseSelect = `<div class="window-toggle"><select id="rcCourse" style="font:inherit;color:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:0;padding:8px;max-width:100%">
      <option value="">All courses</option>
      ${courseNames.map(c => `<option value="${escAttr(c)}"${c === racingCourse ? " selected" : ""}>${escAttr(c)} (${code.windows.all.courses[c].overall.n})</option>`).join("")}
    </select></div>`;

    const intro = `<div class="bb-intro">What usually happens in UK ${code.label.toLowerCase()} racing, from ${code.windows.all.overall.n.toLocaleString("en-GB")} races over the last ${code.seasons.length} seasons (${trFmtDate(code.first_date)} ${code.first_date.slice(0, 4)} to ${trFmtDate(code.last_date)} ${code.last_date.slice(0, 4)}). Favourite = shortest Betfair Starting Price. ROI is a £1 bet on the favourite at that price after Betfair's ${Math.round(RACING_DATA.commission * 100)}% commission; the "Top 3" column is how often the winner came from the market's three shortest. Descriptive history, not a prediction.${code.label === "Jumps" ? " Jumps seasons run 1 May to 30 April and include bumpers." : " Flat seasons are calendar years and include all-weather."}</div>`;

    let body;
    if (!racingCourse) {
      const courses = Object.entries(win.courses).map(([name, c]) => ({ name, ...c.overall })).filter(c => c.n >= 1);
      const minN = racingWindow === "all" ? 100 : 40;
      const ranked = courses.filter(c => c.n >= minN);
      const best = [...ranked].sort((a, b) => b.fav - a.fav).slice(0, 4);
      const worst = [...ranked].sort((a, b) => a.fav - b.fav).slice(0, 4);
      const line = c => `${escAttr(c.name)} <b>${c.fav}%</b> <span class="tr-chip-n">(${c.n})</span>`;
      const extremes = ranked.length >= 8
        ? `<div class="tr-section-title">Courses to note</div>
           <div class="tr-note"><b>Favourites do best at:</b> ${best.map(line).join(" &middot; ")}<br><b>Favourites do worst at:</b> ${worst.map(line).join(" &middot; ")}<br>Courses with at least ${minN} races only.</div>` : "";
      const sorters = [["races", "Most races"], ["fav", "Fav win %"], ["roi", "Fav ROI"]];
      courses.sort((a, b) => racingCourseSort === "fav" ? b.fav - a.fav : racingCourseSort === "roi" ? b.roi - a.roi : b.n - a.n);
      const courseRows = courses.map(c => `<div class="tr-be-row" data-rc-course="${escAttr(c.name)}" style="cursor:pointer">
        <span class="tr-be-label">${escAttr(c.name)}${c.n < 30 ? ' <span class="tr-chip-n">small sample</span>' : ""}</span>
        <span class="tr-be-hit">${c.fav}% <span class="tr-chip-n">(${c.n})</span></span>
        <span class="tr-be-odds ${racingRoiClass(c.roi, c.n)}"><b>${c.roi > 0 ? "+" : ""}${c.roi}%</b></span>
        <span class="tr-be-odds tr-be-safe">${c.top3}%</span>
      </div>`).join("");
      const view = racingFavBand && win.filtered && win.filtered[racingFavBand] ? win.filtered[racingFavBand] : win;
      const filterNote = view === win ? "" : `<div class="tr-note">Showing only races where the favourite's Betfair price was <b>${racingFavBand}</b>. The winner-price split and course guide below the tables use all prices.</div>`;
      body = filterNote + racingHeadline(view.overall)
        + (code.label === "Jumps" ? racingRows(view.by_code.map(m => ({ ...m, name: { hurdle: "Hurdles", chase: "Chases", bumper: "Bumpers (NH Flat)" }[m.name] || m.name })), "By type of race: hurdle, chase or bumper") : "")
        + (view === win ? racingRows(win.by_favprice, "By the favourite's price") + racingMarketPosition(win.market_position) : "")
        + racingRows(view.by_type, "By race type")
        + racingPriceRows(view.by_type, "Winning price by race type")
        + racingRows(view.by_dist, "By distance")
        + racingRows(view.by_field, "By field size")
        + (view === win ? (win.second ? racingSecond(win.second) : `<div class="tr-note">Second-favourite prices aren't in the data yet. Re-run racing.py with --refetch to add them.</div>`) : "")
        + (win.winner_price.length ? `<div class="tr-section-title">Where winners come from</div>
            <div class="tr-note">Share of all races won by a horse at each Betfair price.</div>` + win.winner_price.map(b => trBarRow(escAttr(b.name), b.n, win.overall.n, Math.round(b.share), "")).join("") : "")
        + extremes
        + `<div class="tr-section-title">Course guide</div>
           <div class="window-toggle">Sort: ${sorters.map(([k, n]) => `<a class="sort-toggle-link" data-rc-sort="${k}"${racingCourseSort === k ? ' style="color:var(--ink);font-weight:700"' : ""}>${n}</a>`).join(" &middot; ")}</div>
           <div class="tr-note">Tap a course for its own profile.</div>
           <div class="tr-be-row tr-be-head"><span class="tr-be-label">Course</span><span class="tr-be-hit">Fav wins</span><span class="tr-be-odds">Fav ROI</span><span class="tr-be-odds tr-be-safe">Top 3</span></div>${courseRows}`;
    } else {
      const c = win.courses[racingCourse];
      const detail = racingWindow === "all"
        ? (code.label === "Jumps" ? racingRows((c.by_code || []).map(m => ({ ...m, name: { hurdle: "Hurdles", chase: "Chases", bumper: "Bumpers (NH Flat)" }[m.name] || m.name })), "Hurdle, chase or bumper") : "")
          + racingRows(c.by_favprice, "By the favourite's price")
          + racingRows(c.by_type, "By race type") + racingPriceRows(c.by_type, "Winning price by race type")
          + racingRows(c.by_dist, "By distance") + racingRows(c.by_field, "By field size")
        : `<div class="tr-note">Pick "Last ${code.seasons.length} seasons" for this course's split by race type, distance and field size - single seasons only show the headline, as the samples get thin.</div>`;
      const all = code.windows.all.courses[racingCourse].overall;
      const compare = `<div class="tr-note">Whole ${code.label} average: favourites win <b>${win.overall.fav}%</b> (ROI ${win.overall.roi > 0 ? "+" : ""}${win.overall.roi}%). ${escAttr(racingCourse)}: <b>${c.overall.fav}%</b> (ROI ${c.overall.roi > 0 ? "+" : ""}${c.overall.roi}%).</div>`;
      body = `<div class="tr-section-title">${escAttr(racingCourse)}</div>` + racingHeadline(c.overall) + compare + detail;
    }

    mainEl.innerHTML = racingViewToggle() + codeToggle + windowToggle + (racingCourse ? "" : favToggle) + intro + courseSelect + body;
    bindRacingView();

    mainEl.querySelectorAll("[data-rc-code]").forEach(a => a.addEventListener("click", () => {
      racingCode = a.dataset.rcCode; racingWindow = "all"; racingCourse = "";
      try { localStorage.setItem("racingCode", racingCode); } catch (e) {}
      renderRacing();
    }));
    mainEl.querySelectorAll("[data-rc-fb]").forEach(a => a.addEventListener("click", () => { racingFavBand = a.dataset.rcFb; renderRacing(); }));
    mainEl.querySelectorAll("[data-rc-win]").forEach(a => a.addEventListener("click", () => { racingWindow = a.dataset.rcWin; renderRacing(); }));
    mainEl.querySelectorAll("[data-rc-sort]").forEach(a => a.addEventListener("click", () => { racingCourseSort = a.dataset.rcSort; renderRacing(); }));
    mainEl.querySelectorAll("[data-rc-course]").forEach(a => a.addEventListener("click", () => { racingCourse = a.dataset.rcCourse; renderRacing(); window.scrollTo(0, 0); }));
    const sel = mainEl.querySelector("#rcCourse");
    if (sel) sel.addEventListener("change", () => { racingCourse = sel.value; renderRacing(); });
  }

  function renderModelCheck() {
    if (typeof BETS_LOG === "undefined" || !BETS_LOG.blocks) {
      mainEl.innerHTML = `<div class="empty">No track record data yet.<br>This is generated by track_bets.py, which runs automatically as part of the Actions - check back after the next run.</div>`;
      return;
    }
    const block = BETS_LOG.blocks[trSport] || BETS_LOG.blocks.all;

    const calibrationHtml = block.calibration.length
      ? `<div class="tr-section-title">Confidence check</div>
         <div class="tr-note">When the model says it's X% confident, how often does the pick land? Bands where the hit rate sits well below the stated confidence mean the model is overconfident there.</div>` +
        block.calibration.map(b => trBarRow(`Said ~${b.avg_confidence}%`, b.hits, b.total, b.pct,
          b.total < 15 ? "small sample" : "")).join("")
      : "";

    const intro = `<div class="bb-intro">How the picks would have fared against bookmaker prices, and whether the model's stated confidence can be trusted. Built from the same settled picks as the Track Record tab.</div>`;
    mainEl.innerHTML = trSportToggleHtml() + intro + trEightySection(block.at_80) + trBreakEvenSection(block.markets, trSport === "all") + calibrationHtml;
    bindTrSportToggle(renderModelCheck);
  }

  function renderTrackRecord() {
    if (typeof BETS_LOG === "undefined" || !BETS_LOG.blocks) {
      mainEl.innerHTML = `<div class="empty">No track record data yet.<br>This is generated by track_bets.py, which runs automatically as part of the Actions - check back after the next run.</div>`;
      return;
    }

    const block = BETS_LOG.blocks[trSport] || BETS_LOG.blocks.all;
    const inSport = item => trSport === "all" || item.sport === trSport;
    const overall = block.overall;

    const sportToggle = trSportToggleHtml();

    const since = BETS_LOG.logging_since ? ` since ${trFmtDate(BETS_LOG.logging_since)}` : "";
    const intro = `<div class="bb-intro">Every Best Bets pick logged${since}, settled automatically once the result is in. Football results come from football-data.co.uk, NFL from nflverse.</div>`;

    const p = block.pending;
    const pendingBits = [];
    if (p.awaiting) pendingBits.push(`${p.awaiting} awaiting results`);
    if (p.overdue) pendingBits.push(`${p.overdue} overdue`);
    if (p.upcoming) pendingBits.push(`${p.upcoming} upcoming`);

    const formChip = (label, f) => f.total
      ? `<span>${label} <b class="${trPctClass(f.pct, f.total)}">${f.pct}%</b> <span class="tr-chip-n">(${f.hits}/${f.total})</span></span>` : "";

    const summaryHtml = `<div class="tr-summary">
      <div class="tr-summary-main">
        <span class="tr-summary-pct ${trPctClass(overall.pct, overall.total)}">${overall.total > 0 ? overall.pct + "%" : "—"}</span>
        <span class="tr-summary-label">${overall.hits}/${overall.total} settled picks hit${p.total ? ` · ${p.total} pending` : ""}</span>
      </div>
      <div class="tr-form">
        ${formChip("Last 7 days", block.form.last_7)}
        ${formChip("Last 30 days", block.form.last_30)}
        ${pendingBits.length ? `<span class="tr-chip-n">Pending: ${pendingBits.join(" · ")}</span>` : ""}
        ${block.held_back && block.held_back.total ? `<span class="tr-chip-n" title="Picks the calibration filter kept out of Best Bets, tracked anyway">Held back by calibration: ${block.held_back.pct}% (${block.held_back.hits}/${block.held_back.total})</span>` : ""}
      </div>
      <div class="tr-category-grid">
        ${block.by_category.map(c => `<div class="tr-category-chip">
            <span>${trCategoryLabel(c, trSport === "all")}</span>
            <span class="${trPctClass(c.pct, c.total)}">${c.pct}% <span class="tr-chip-n">(${c.hits}/${c.total})</span></span>
          </div>`).join("") || '<div class="bb-empty">No settled picks yet</div>'}
      </div>
    </div>`;

    const lb = block.lowered_bar;
    const loweredHtml = lb ? `<div class="tr-section-title">Since the lower bar</div>
      <div class="tr-note">From ${trFmtDate(lb.since)}, goals, corners, cards and BTTS picks only need 82% (was 87%) to reach Best Bets. These are the picks that only exist because of that change, tracked on their own.
        <div class="tr-form" style="margin-top:8px">
          <span>New picks (82-87%) <b class="${trPctClass(lb.new.pct, lb.new.total)}">${lb.new.total ? lb.new.pct + "%" : "-"}</b> <span class="tr-chip-n">(${lb.new.hits}/${lb.new.total}${lb.new.total ? ", model said " + lb.new.stated + "%" : ""})</span></span>
          <span>Old-bar picks, same period <b class="${trPctClass(lb.old_bar_same_period.pct, lb.old_bar_same_period.total)}">${lb.old_bar_same_period.total ? lb.old_bar_same_period.pct + "%" : "-"}</b> <span class="tr-chip-n">(${lb.old_bar_same_period.hits}/${lb.old_bar_same_period.total}${lb.old_bar_same_period.total ? ", model said " + lb.old_bar_same_period.stated + "%" : ""})</span></span>
          ${lb.pending ? `<span class="tr-chip-n">${lb.pending} pending</span>` : ""}
        </div>
        ${lb.by_market.map(m => trBarRow(m.market.charAt(0).toUpperCase() + m.market.slice(1).replace(/_/g, " "), m.hits, m.total, m.pct)).join("")}
        <div style="margin-top:6px">${lb.new.total < 100 ? `<b>Small sample so far (${lb.new.total} settled).</b> Judge it by whether the hit rate sits near what the model said (the replay behind the change found about 83-87% at these levels), and give it a few hundred picks before drawing conclusions.` : "The test: the hit rate should sit close to what the model said."}</div>
      </div>` : "";

    const leaguesHtml = block.leagues.length > 1
      ? `<div class="tr-section-title">By league</div>` +
        block.leagues.map(l => trBarRow(l.league, l.hits, l.total, l.pct)).join("")
      : "";

    const recent = BETS_LOG.recent.filter(inSport);
    const pendingMatches = BETS_LOG.pending_matches.filter(inSport);

    mainEl.innerHTML = sportToggle + intro + summaryHtml + loweredHtml + leaguesHtml +
      trRecentSection(recent) + trPendingSection(block, pendingMatches);

    bindTrSportToggle(renderTrackRecord);
    const more = mainEl.querySelector("[data-tr-more]");
    if (more) more.addEventListener("click", () => { trShowAllRecent = !trShowAllRecent; renderTrackRecord(); });
  }

  function cupFixtureCard(fixture) {
    const p = fixture.predictions;
    const flag = flagBadges(fixture);
    const note = fixture.note ? `<div class="note">⚠ ${fixture.note.trim()}</div>` : "";
    const leagueLine = fixture.cross_division
      ? `<div class="cup-leagues">${fixture.home_league} v ${fixture.away_league}</div>`
      : "";

    return `<details class="fixture">
      <summary>
        <span class="kickoff">${fixture.time || "--:--"}</span>
        <span class="teams">${fixture.home_team}<span class="v">v</span>${fixture.away_team}</span>
        ${flag}
        ${quickStat(fixture)}
        <span class="chev">▸</span>
      </summary>
      <div class="detail">
        ${leagueLine}
        ${note}
        ${matchResultBlock(fixture)}
        <div class="metric-grid">
          ${metricBlock("Full-Time Goals", p.goals, fixture.home_team, fixture.away_team)}
          ${metricBlock("Corners", p.corners, fixture.home_team, fixture.away_team)}
          ${metricBlock("Cards", p.cards, fixture.home_team, fixture.away_team)}
          ${metricBlock("1st-Half Goals", p.first_half_goals, fixture.home_team, fixture.away_team)}
          ${metricBlock("2nd-Half Goals", p.second_half_goals, fixture.home_team, fixture.away_team)}
        </div>
        <div class="sample-note">Form sample: ${fixture.home_form_sample} home games, ${fixture.away_form_sample} away games</div>
      </div>
    </details>`;
  }

  // ---------- NFL ----------
  function nflMoneylineBlock(fixture) {
    const ml = fixture.predictions?.points?.moneyline;
    if (!ml) return "";
    const highest = Math.max(ml.home_win, ml.away_win);
    const options = [
      { label: fixture.home_team, pct: ml.home_win,
        spec: { metric: "moneyline", scope: "home", team: fixture.home_team, direction: fixture.home_team, label: `${fixture.home_team} to win` } },
      { label: fixture.away_team, pct: ml.away_win,
        spec: { metric: "moneyline", scope: "away", team: fixture.away_team, direction: fixture.away_team, label: `${fixture.away_team} to win` } },
    ];
    return `<div class="mr-block">
      <div class="metric-title">Moneyline</div>
      <div class="mr-row">
        ${options.map(o => `
          <div class="mr-option ${o.pct === highest ? 'mr-favourite' : ''}">
            <div class="mr-label">${o.label}</div>
            <div class="mr-pct ${o.pct === highest ? 'pct-hi' : ''}">${pctBtn(o.spec, o.pct)}</div>
          </div>
        `).join("")}
      </div>
    </div>`;
  }

  function nflOuRows(entries, fixture) {
    return (entries || []).map(ou => {
      const overPct = ou.over;
      const barColor = overPct >= 0.5 ? "var(--green)" : "var(--accent)";
      return `<div class="ou-row">
        <span class="ou-line">O/U ${ou.line}</span>
        <div class="ou-bar-wrap"><div class="ou-bar" style="width:${Math.round(overPct*100)}%;background:${barColor}"></div></div>
        <span class="ou-pct ${overPct >= 0.55 ? 'pct-hi' : overPct <= 0.4 ? 'pct-lo' : ''}">${pctBtn({ metric: "points", scope: "match", direction: "Over", line: ou.line,
          label: `${fixture.home_team} v ${fixture.away_team} - Over ${ou.line} Total Points` }, overPct)}</span>
      </div>`;
    }).join("");
  }

  function nflTotalPointsCard(fixture) {
    const p = fixture.predictions?.points;
    if (!p) return "";
    return `<div class="metric-card">
      <div class="metric-title">Total Points <span style="opacity:0.6">· over %</span></div>
      <div class="metric-expected">${p.expected_total}<span class="label">expected</span></div>
      ${nflOuRows(p.total_over_under, fixture)}
    </div>`;
  }

  function nflSplitRows(entries, team, scope, metricKey) {
    return (entries || []).map(ou => `<div class="split-ou-row">
      <span class="split-ou-line">${ou.line}</span>
      <span class="split-ou-pct ${ou.over >= 0.55 ? 'pct-hi' : ou.over <= 0.4 ? 'pct-lo' : ''}">${pctBtn({ metric: metricKey, scope, team, direction: "Over", line: ou.line,
        label: `${team} - Over ${ou.line} ${NFL_METRIC_LABELS[metricKey] || metricKey}` }, ou.over)}</span>
    </div>`).join("");
  }

  function nflSplitCard(title, m, homeTeam, awayTeam, metricKey) {
    if (!m) return "";
    return `<div class="metric-card">
      <div class="metric-title">${title} <span style="opacity:0.6">· over %</span></div>
      <div class="metric-split" style="border-top:none;padding-top:0;margin-top:0">
        <div class="metric-split-col">
          <div class="metric-split-title">${homeTeam}</div>
          <div class="metric-split-expected">${m.expected_home}</div>
          ${nflSplitRows(m.home_over_under, homeTeam, "home", metricKey)}
        </div>
        <div class="metric-split-col">
          <div class="metric-split-title">${awayTeam}</div>
          <div class="metric-split-expected">${m.expected_away}</div>
          ${nflSplitRows(m.away_over_under, awayTeam, "away", metricKey)}
        </div>
      </div>
    </div>`;
  }

  function seasonStatLeaderRows(leaders) {
    if (!leaders || Object.keys(leaders).length === 0) {
      return `<div class="split-ou-row"><span class="split-ou-line">No stats yet this season</span></div>`;
    }
    return Object.entries(STAT_LEADER_LABELS).map(([key, label]) => {
      const leader = leaders[key];
      if (!leader) return "";
      return `<div class="split-ou-row">
        <span class="split-ou-line">${label} — ${leader.player}</span>
        <span>${leader.avg_yards} yds/gm</span>
      </div>`;
    }).join("");
  }

  function nflSeasonLeadersBlock(fixture) {
    const leaders = fixture.season_stat_leaders;
    if (!leaders) return "";
    return `<div class="metric-split">
      <div class="metric-split-col">
        <div class="metric-split-title">${fixture.home_team} — season leaders</div>
        ${seasonStatLeaderRows(leaders.home)}
      </div>
      <div class="metric-split-col">
        <div class="metric-split-title">${fixture.away_team} — season leaders</div>
        ${seasonStatLeaderRows(leaders.away)}
      </div>
    </div>`;
  }

  function standingsRows(s) {
    if (!s || !s.record) {
      return `<div class="split-ou-row"><span class="split-ou-line">No standings available</span></div>`;
    }
    const divLabel = s.division_rank ? `${ordinal(s.division_rank)} in ${s.division || "division"}` : (s.division || "");
    const rows = [
      ["Record", `${s.record}${divLabel ? ` (${divLabel})` : ""}`],
      ["Pass Off", `${s.passing_offense.ypg} ypg (${ordinal(s.passing_offense.rank)})`],
      ["Rush Off", `${s.rushing_offense.ypg} ypg (${ordinal(s.rushing_offense.rank)})`],
      ["Pass Def", `${s.passing_defense.ypg} ypg (${ordinal(s.passing_defense.rank)})`],
      ["Rush Def", `${s.rushing_defense.ypg} ypg (${ordinal(s.rushing_defense.rank)})`],
    ];
    return rows.map(([label, value]) => `<div class="split-ou-row">
      <span class="split-ou-line">${label}</span>
      <span>${value}</span>
    </div>`).join("");
  }

  function nflStandingsBlock(obj) {
    const standings = obj.standings;
    if (!standings) return "";
    return `<div class="metric-split">
      <div class="metric-split-col">
        <div class="metric-split-title">${obj.home_team} — standings</div>
        ${standingsRows(standings.home)}
      </div>
      <div class="metric-split-col">
        <div class="metric-split-title">${obj.away_team} — standings</div>
        ${standingsRows(standings.away)}
      </div>
    </div>`;
  }

  function nflFixtureCard(fixture, badge) {
    slipCtx = { sport: "nfl", league: "NFL", fx: fixture };
    try { return nflFixtureCardHtml(fixture, badge); } finally { slipCtx = null; }
  }

  function nflFixtureCardHtml(fixture, badge) {
    const p = fixture.predictions;
    const marketBadge = fixture.market_blended ? `<span class="flag-market">M</span>` : "";
    const flag = fixture.low_sample ? `<span class="flag">thin sample</span>` : "";
    const note = fixture.note ? `<div class="note">⚠ ${fixture.note.trim()}</div>` : "";
    const badgeHtml = badge ? `<span class="fixture-badge">${badge}</span>` : "";

    return `<details class="fixture">
      <summary>
        <span class="kickoff">${fixture.time || "--:--"}</span>
        <span class="teams">${fixture.home_team}<span class="v">v</span>${fixture.away_team}</span>
        ${badgeHtml}
        ${marketBadge}${flag}
        <span class="chev">▸</span>
      </summary>
      <div class="detail">
        ${note}
        ${nflMoneylineBlock(fixture)}
        <div class="metric-grid">
          ${nflTotalPointsCard(fixture)}
          ${nflSplitCard("Team Points", p.points, fixture.home_team, fixture.away_team, "points")}
          ${nflSplitCard("Passing TDs", p.passing_tds, fixture.home_team, fixture.away_team, "passing_tds")}
          ${nflSplitCard("Rushing TDs", p.rushing_tds, fixture.home_team, fixture.away_team, "rushing_tds")}
          ${nflSplitCard("Passing Yards", p.passing_yards, fixture.home_team, fixture.away_team, "passing_yards")}
          ${nflSplitCard("Rushing Yards", p.rushing_yards, fixture.home_team, fixture.away_team, "rushing_yards")}
        </div>
        ${nflSeasonLeadersBlock(fixture)}
        ${nflStandingsBlock(fixture)}
        <div class="sample-note">Form sample: ${fixture.home_form_sample} recent games (${fixture.home_team}), ${fixture.away_form_sample} recent games (${fixture.away_team})</div>
      </div>
    </details>`;
  }

  const STAT_LEADER_LABELS = { passing: "Passing", rushing: "Rushing", receiving: "Receiving" };

  function statLeaderRows(leaders) {
    if (!leaders || Object.keys(leaders).length === 0) {
      return `<div class="split-ou-row"><span class="split-ou-line">No stats available</span></div>`;
    }
    return Object.entries(STAT_LEADER_LABELS).map(([key, label]) => {
      const leader = leaders[key];
      if (!leader) return "";
      return `<div class="split-ou-row">
        <span class="split-ou-line">${label} — ${leader.player}</span>
        <span>${leader.yards} yds</span>
      </div>`;
    }).join("");
  }

  function nflResultCard(game) {
    return `<details class="fixture">
      <summary>
        <span class="kickoff">${game.time || "--:--"}</span>
        <span class="teams">${game.home_team} <b>${game.home_score}</b><span class="v">-</span><b>${game.away_score}</b> ${game.away_team}</span>
        <span class="chev">▸</span>
      </summary>
      <div class="detail">
        <div class="metric-split">
          <div class="metric-split-col">
            <div class="metric-split-title">${game.home_team}</div>
            ${statLeaderRows(game.stat_leaders && game.stat_leaders.home)}
          </div>
          <div class="metric-split-col">
            <div class="metric-split-title">${game.away_team}</div>
            ${statLeaderRows(game.stat_leaders && game.stat_leaders.away)}
          </div>
        </div>
        ${nflStandingsBlock(game)}
      </div>
    </details>`;
  }

  function renderNflRecentResults() {
    const results = (typeof NFL_STATPACK_DATA !== "undefined") ? NFL_STATPACK_DATA.recent_results : null;
    if (!results || results.length === 0) return "";
    const weekLabel = results[0].week ? `Week ${results[0].week}` : "Most recent week";
    if (nflHideResults) {
      return `<div class="window-toggle"><a href="#" class="sort-toggle-link" data-nfl-results="show">Show recent results (${results.length})</a></div>`;
    }
    return `<div class="date-group">
      <div class="date-label">Recent Results — ${weekLabel}</div>
      <div class="window-toggle"><a href="#" class="sort-toggle-link" data-nfl-results="hide">Hide recent results</a></div>
      ${results.map(nflResultCard).join("")}
    </div>`;
  }

  function bindNflResultsToggle() {
    const link = mainEl.querySelector("[data-nfl-results]");
