<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stat Pack</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF7F0;
    --surface: #FDFBF5;
    --surface-hover: #F3EDDC;
    --ink: #1A1A1A;
    --ink-dim: #4A4536;
    --accent: #8B1E1E;
    --green: #2F5233;
    --red: #8B1E1E;
    --meta: #8A8574;
    --rule: #DCD5C2;
    --data: 'Source Serif 4', Georgia, serif;
    --display: 'Playfair Display', Georgia, serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--data);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ---------- Ticker ---------- */
  /* ---------- Header ---------- */
  header {
    padding: 28px 20px 16px;
    max-width: 920px;
    margin: 0 auto;
  }
  .eyebrow {
    font-family: var(--data);
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--meta);
    margin-bottom: 6px;
  }
  h1 {
    font-family: var(--display);
    font-weight: 900;
    font-size: clamp(36px, 7vw, 56px);
    margin: 0;
    letter-spacing: -0.01em;
    text-align: center;
  }
  .freshness-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }
  .freshness-chip {
    font-family: var(--data);
    font-size: 11px;
    border-radius: 0;
    padding: 5px 9px;
    border: 1px solid var(--rule);
    color: var(--ink-dim);
    white-space: nowrap;
  }
  .freshness-chip .dot-status {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .freshness-fresh .dot-status { background: var(--green); }
  .freshness-lagging .dot-status { background: var(--accent); }
  .freshness-stale .dot-status { background: var(--red); }
  .freshness-fresh { border-color: rgba(107,155,110,0.4); }
  .freshness-lagging { border-color: rgba(232,163,61,0.4); }
  .freshness-stale { border-color: rgba(181,83,62,0.4); }

  /* ---------- League tabs ---------- */
  .tabs {
    /* Stays pinned to the top of the screen while the page scrolls, so any
       tab is one tap away however far down a long list you are. */
    position: sticky;
    top: 0;
    z-index: 15;
    background: var(--bg);
    display: flex;
    gap: 2px;
    max-width: 920px;
    margin: 0 auto;
    padding: 0 20px;
    border-bottom: 1px solid var(--rule);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab, .tab-wrap {
    flex-shrink: 0;
  }
  .tab {
    font-family: var(--data);
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--meta);
    background: none;
    border: none;
    padding: 12px 14px;
    cursor: pointer;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    transition: color 0.15s;
  }
  .tab:hover { color: var(--ink-dim); }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .tab:focus-visible, .fixture summary:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .tab .count {
    color: var(--meta);
    font-size: 10px;
    margin-left: 4px;
  }
  .tab-wrap {
    position: relative;
    display: inline-block;
  }
  .chev-dd {
    font-size: 9px;
    margin-left: 2px;
    display: inline-block;
  }
  .football-dropdown {
    /* position is set inline (fixed, with computed top/left) rather than
       here - see buildTabs(). It used to be position:absolute inside
       .tab-wrap, but .tabs now scrolls horizontally (overflow-x:auto),
       which per spec makes the browser clip vertical overflow too,
       cutting the dropdown off. Fixed positioning off the button's own
       on-screen rect sidesteps that clipping entirely. */
    z-index: 20;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 0;
    padding: 6px;
    min-width: 220px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .dropdown-item {
    display: block;
    width: 100%;
    text-align: left;
    font-family: var(--data);
    font-size: 13px;
    color: var(--ink-dim);
    background: none;
    border: none;
    padding: 9px 10px;
    cursor: pointer;
    border-radius: 0;
    white-space: nowrap;
  }
  .dropdown-item:hover {
    background: var(--surface-hover);
    color: var(--ink);
  }
  .dropdown-item.active {
    color: var(--accent);
  }
  .dropdown-item .count {
    color: var(--meta);
    font-size: 10px;
    margin-left: 4px;
  }
  .dropdown-divider {
    height: 1px;
    background: var(--rule);
    margin: 4px 2px;
  }

  .fixture-badge {
    font-family: var(--data);
    font-size: 10px;
    color: var(--meta);
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  /* ---------- Best Bets ---------- */
  .bb-intro {
    font-size: 12px;
    color: var(--meta);
    padding: 14px 4px 4px;
  }
  .window-toggle {
    font-family: var(--data);
    font-size: 12px;
    color: var(--meta);
    padding: 14px 4px 8px;
  }
  .window-toggle a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px dotted var(--accent);
  }
  .sort-toggle-active {
    color: var(--accent);
    font-weight: 600;
  }
  .window-toggle a.sort-toggle-link {
    color: var(--meta);
    text-decoration: none;
    border-bottom: 1px dotted var(--meta);
    cursor: pointer;
  }
  .sort-toggle-link:hover { color: var(--ink-dim); }
  .window-toggle a:hover { opacity: 0.8; }
  .bb-filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    padding: 10px 4px 4px;
    border-top: 1px solid var(--rule);
    margin-top: 8px;
  }
  .bb-filter-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: var(--data);
    font-size: 11px;
    color: var(--ink-dim);
    cursor: pointer;
    white-space: nowrap;
  }
  .bb-filter-item input[type="checkbox"] {
    accent-color: var(--accent);
    cursor: pointer;
  }
  .bb-category {
    margin: 18px 0 8px;
  }
  .bb-category-title {
    font-family: var(--data);
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--accent);
    padding: 8px 4px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 6px;
  }
  .bb-split {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
  }
  .bb-column-title {
    font-family: var(--data);
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--ink-dim);
    padding: 2px 4px 6px;
  }
  .bb-empty {
    font-family: var(--data);
    font-size: 11px;
    color: var(--meta);
    padding: 8px 4px;
  }
  .bb-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 0;
    padding: 10px 14px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .bb-rank {
    font-family: var(--data);
    font-size: 12px;
    color: var(--meta);
    width: 16px;
  }
  .bb-teams {
    font-family: var(--data);
    font-weight: 600;
    font-size: 13px;
    flex: 1;
    min-width: 160px;
  }
  .bb-teams .v { color: var(--meta); font-weight: 400; margin: 0 5px; }
  .bb-league {
    font-family: var(--data);
    font-size: 10px;
    color: var(--meta);
    letter-spacing: 0.04em;
  }
  /* ---- Bet slip ---- */
  .bb-add {
    font-family: var(--data);
    font-size: 15px;
    line-height: 1;
    width: 26px; height: 26px;
    color: var(--ink-dim);
    background: transparent;
    border: 1px solid var(--rule);
    cursor: pointer;
    flex: none;
  }
  .bb-add.in-slip { background: var(--green); color: #fff; border-color: var(--green); }
  .slip-btn {
    font-family: var(--data);
    font-size: 12px;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--ink-dim);
    padding: 6px 12px;
    cursor: pointer;
  }
  .slip-btn.primary { background: var(--ink); color: var(--bg, #fff); border-color: var(--ink); }
  .slip-btn.quiet { border-color: var(--rule); color: var(--ink-dim); }
  .slip-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 18px; }
  .slip-item { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--rule); padding: 10px 12px; margin-bottom: 6px; }
  .slip-item-main { flex: 1; min-width: 150px; font-family: var(--data); font-size: 13px; font-weight: 600; }
  .slip-item-sub { display: block; font-weight: 400; font-size: 10px; color: var(--meta); margin-top: 2px; }
  .slip-odds, .slip-stake, .slip-name {
    font-family: var(--data); font-size: 14px; color: var(--ink);
    background: var(--bg, transparent); border: 1px solid var(--rule); padding: 5px 7px; width: 70px;
  }
  .slip-name { width: 100%; box-sizing: border-box; }
  .slip-x { background: transparent; border: none; color: var(--meta); font-size: 16px; cursor: pointer; padding: 2px 6px; }
  .bank-form label { display: block; font-family: var(--data); font-size: 12px; color: var(--ink-dim); margin: 8px 0 0; }
  .bank-form label > select, .bank-form label > input { margin-top: 3px; display: block; }
  .bank-form .slip-name { width: 100%; }
  .bank-row { display: flex; gap: 10px; }
  .bank-row label { flex: 1; }
  .bank-table td, .bank-table th { font-size: 11px; padding: 5px 3px; }
  .bank-bet { margin: 10px 0; }
  .bank-settle { margin-top: 8px; }
  .slip-btn { min-height: 36px; }
  .slip-summary { background: var(--surface); border: 1px solid var(--rule); padding: 12px 14px; margin: 12px 0; font-family: var(--data); font-size: 12px; }
  .slip-line { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; }
  .slip-line b { font-size: 14px; }
  .slip-note { font-family: var(--data); font-size: 11px; color: var(--meta); line-height: 1.5; margin-top: 8px; }
  .slip-warn { color: var(--accent); }
  .bb-label {
    font-family: var(--data);
    font-size: 12px;
    color: var(--ink-dim);
    min-width: 90px;
  }
  .bb-pct {
    font-family: var(--data);
    font-weight: 700;
    font-size: 14px;
    min-width: 44px;
    text-align: right;
  }

  /* ---------- Track Record ---------- */
  .tr-summary {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 0;
    padding: 18px;
    margin: 14px 0 20px;
  }
  .tr-summary-main {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 16px;
  }
  .tr-summary-pct {
    font-family: var(--data);
    font-weight: 700;
    font-size: 32px;
  }
  .tr-summary-label {
    font-family: var(--data);
    font-size: 12px;
    color: var(--ink-dim);
  }
  .tr-category-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 8px;
  }
  .tr-category-chip {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: 0;
    padding: 8px 10px;
    font-family: var(--data);
    font-size: 11px;
    color: var(--ink-dim);
  }
  .tr-chip-n { color: var(--meta); font-size: 10px; }
  .tr-badge {
    font-family: var(--data);
    font-size: 10px;
    letter-spacing: 0.05em;
    border-radius: 0;
    padding: 3px 8px;
    white-space: nowrap;
  }
  .tr-hit { color: var(--green); border: 1px solid var(--green); }
  .tr-miss { color: var(--red); border: 1px solid var(--red); }
  .tr-pending { color: var(--meta); border: 1px solid var(--meta); }
  .tr-overdue { color: var(--accent); border: 1px solid var(--accent); }
  .tr-sport-toggle {
    display: flex;
    gap: 16px;
    font-family: var(--data);
    font-size: 12px;
    padding: 14px 4px 0;
  }
  .tr-sport-toggle a {
    color: var(--meta);
    border-bottom: 1px dotted var(--meta);
    cursor: pointer;
  }
  .tr-sport-toggle a:hover { color: var(--ink-dim); }
  .tr-sport-toggle a.tr-sport-active {
    color: var(--accent);
    border-bottom: 1px solid var(--accent);
    font-weight: 600;
  }
  .tr-form {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    font-family: var(--data);
    font-size: 12px;
    color: var(--ink-dim);
    margin: -6px 0 16px;
  }
  .tr-section-title {
    font-family: var(--data);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--meta);
    padding: 18px 4px 8px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 8px;
  }
  .rc-score { width: 100%; border-collapse: collapse; font-size: 12px; margin: 6px 0 10px; }
  .rc-score th, .rc-score td { padding: 5px 4px; text-align: center; border-bottom: 1px solid var(--line, #8883); }
  .rc-score th { font-weight: 600; font-size: 11px; }
  .rc-score td:first-child, .rc-score th:first-child { text-align: left; }
  .tr-note {
    font-family: var(--data);
    font-size: 11px;
    color: var(--meta);
    padding: 2px 4px 8px;
    line-height: 1.5;
  }
  .tr-bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--data);
    font-size: 12px;
    padding: 5px 4px;
  }
  .tr-bar-label { width: 130px; flex-shrink: 0; color: var(--ink-dim); }
  .tr-bar-wrap { flex: 1; height: 6px; background: var(--rule); }
  .tr-bar { height: 100%; background: var(--green); }
  .tr-bar.lo { background: var(--red); }
  .tr-bar-val { min-width: 92px; text-align: right; font-weight: 700; }
  .tr-bar-note { font-size: 10px; color: var(--meta); min-width: 64px; }
  .tr-recent-sub {
    font-weight: 400;
    font-size: 11px;
    color: var(--meta);
    margin-top: 2px;
  }
  .tr-pending-box {
    background: var(--surface);
    border: 1px solid var(--rule);
    margin: 22px 0 8px;
  }
  .tr-pending-box summary {
    cursor: pointer;
    padding: 12px 14px;
    font-family: var(--data);
    font-size: 12px;
    color: var(--ink-dim);
  }
  .tr-be-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-family: var(--data);
    font-size: 12px;
    padding: 6px 4px;
    border-bottom: 1px solid var(--rule);
  }
  .tr-be-head { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--meta); }
  .tr-be-label { flex: 1; min-width: 0; color: var(--ink-dim); }
  .tr-be-hit { width: 92px; text-align: right; font-weight: 700; }
  .tr-be-odds { width: 64px; text-align: right; }
  .tr-be-safe { color: var(--meta); }
  .tr-pend-body { padding: 0 14px 10px; }
  .tr-pend-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--data);
    font-size: 12px;
    padding: 7px 0;
    border-top: 1px solid var(--rule);
  }
  .tr-pend-date { width: 48px; flex-shrink: 0; color: var(--meta); }
  .tr-pend-match { flex: 1; min-width: 0; }

  /* ---------- Fixture list ---------- */
  main {
    max-width: 920px;
    margin: 0 auto;
    padding: 20px;
  }
  .date-group {
    margin-bottom: 6px;
  }
  .date-label {
    font-family: var(--data);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--meta);
    padding: 18px 4px 8px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 8px;
  }
  .fixture {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 0;
    margin-bottom: 8px;
    transition: background 0.15s;
  }
  .fixture:hover { background: var(--surface-hover); }
  .fixture summary {
    list-style: none;
    cursor: pointer;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .fixture summary::-webkit-details-marker { display: none; }
  .kickoff {
    font-family: var(--data);
    font-size: 12px;
    color: var(--meta);
    min-width: 44px;
  }
  .teams {
    font-family: var(--data);
    font-size: 14px;
    font-weight: 600;
    flex: 1;
    min-width: 180px;
  }
  .teams .v { color: var(--meta); font-weight: 400; margin: 0 6px; }
  .pos-badge {
    font-family: var(--data);
    font-size: 10px;
    font-weight: 400;
    color: var(--meta);
    margin-left: 4px;
    white-space: nowrap;
  }
  .quick-stats {
    display: flex;
    gap: 16px;
    font-family: var(--data);
    font-size: 11px;
  }
  .quick-stat { color: var(--ink-dim); white-space: nowrap; }
  .quick-stat b { color: var(--ink); }
  /* Tappable percentages on fixture cards: tap to add that pick to the bet slip. */
  .pct-add {
    font: inherit; color: inherit; background: none; border: none; border-radius: 0;
    padding: 1px 4px; margin: -1px -4px; cursor: pointer;
    border-bottom: 1px dotted var(--meta);
  }
  .pct-add:hover { background: var(--surface); }
  .pct-add.in-slip { outline: 1px solid var(--green); border-bottom-color: transparent; }
  .pct-add.in-slip::after { content: " \2713"; font-size: 0.85em; color: var(--green); }
  .rc-race { border-top: 1px solid var(--rule); padding: 9px 4px; }
  .rc-race-top { display: flex; align-items: baseline; gap: 8px; }
  .rc-time { font-weight: 700; min-width: 42px; }
  .rc-course { font-weight: 600; flex: 1; }
  .rc-tier { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border: 1px solid var(--rule); }
  .rc-tier-strong { color: var(--green); border-color: var(--green); font-weight: 700; }
  .rc-tier-good { color: var(--green); }
  .rc-tier-open { color: var(--meta); }
  .rc-tier-avoid { color: var(--red); border-color: var(--red); font-weight: 700; }
  .rc-race-sub { font-size: 12px; color: var(--ink-dim); margin: 2px 0 0 50px; }
  .rc-race-stats { font-size: 12px; margin: 3px 0 0 50px; }
  .pct-hi { color: var(--green); }
  .pct-lo { color: var(--red); }
  .flag {
    font-size: 10px;
    font-family: var(--data);
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 0;
    padding: 2px 6px;
    letter-spacing: 0.05em;
  }
  .flag-market {
    font-size: 10px;
    font-weight: 700;
    font-family: var(--data);
    color: var(--green);
    border: 1px solid var(--green);
    border-radius: 0;
    padding: 2px 5px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .chev {
    color: var(--meta);
    font-family: var(--data);
    transition: transform 0.15s;
  }
  .fixture[open] .chev { transform: rotate(90deg); }

  /* ---------- Expanded detail ---------- */
  .detail {
    padding: 4px 16px 18px;
    border-top: 1px solid var(--rule);
  }
  .note {
    font-size: 12px;
    color: var(--accent);
    background: rgba(232,163,61,0.08);
    border: 1px solid rgba(232,163,61,0.25);
    border-radius: 0;
    padding: 8px 10px;
    margin: 12px 0;
    line-height: 1.5;
  }
  .cup-leagues {
    font-family: var(--data);
    font-size: 11px;
    color: var(--meta);
    letter-spacing: 0.04em;
    margin-top: 4px;
  }
  .metric-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-top: 14px;
  }
  .mr-block {
    margin-top: 14px;
  }
  .mr-row {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }
  .mr-option {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: 0;
    padding: 12px 10px;
    text-align: center;
  }
  .mr-option.mr-favourite {
    border-color: var(--green);
  }
  .mr-label {
    font-family: var(--data);
    font-size: 11px;
    color: var(--ink-dim);
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mr-pct {
    font-family: var(--data);
    font-weight: 700;
    font-size: 18px;
  }
  .metric-card {
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: 0;
    padding: 12px 14px;
  }
  .metric-title {
    font-family: var(--data);
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--meta);
    margin-bottom: 8px;
  }
  .metric-expected {
    font-family: var(--data);
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .metric-expected .label { font-size: 10px; color: var(--meta); font-weight: 400; margin-left: 4px; }
  .ou-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--data);
    font-size: 12px;
    padding: 4px 0;
    border-top: 1px solid var(--rule);
  }
  .ou-row:first-of-type { border-top: none; }
  .ou-line { color: var(--ink-dim); }
  .ou-bar-wrap {
    flex: 1;
    height: 6px;
    background: var(--rule);
    border-radius: 0;
    margin: 0 10px;
    overflow: hidden;
  }
  .ou-bar {
    height: 100%;
    background: var(--accent);
  }
  .ou-pct { min-width: 38px; text-align: right; }
  .btts-row {
    font-family: var(--data);
    font-size: 12px;
    color: var(--ink-dim);
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--rule);
  }
  .metric-split {
    display: flex;
    gap: 10px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--rule);
  }
  .metric-split-col {
    flex: 1;
    min-width: 0;
  }
  .metric-split-title {
    font-family: var(--data);
    font-size: 10px;
    color: var(--meta);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .metric-split-expected {
    font-family: var(--data);
    font-weight: 700;
    font-size: 15px;
    margin: 2px 0 4px;
  }
  .split-ou-row {
    display: flex;
    justify-content: space-between;
    font-family: var(--data);
    font-size: 10px;
    padding: 2px 0;
    color: var(--ink-dim);
  }
  .split-ou-line { color: var(--meta); }
  .sample-note {
    font-family: var(--data);
    font-size: 10px;
    color: var(--meta);
    margin-top: 12px;
  }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--meta);
    font-family: var(--data);
    font-size: 13px;
    line-height: 1.8;
  }

  footer {
    max-width: 920px;
    margin: 20px auto 40px;
    padding: 0 20px;
    color: var(--meta);
    font-family: var(--data);
    font-size: 11px;
  }

  @media (max-width: 560px) {
    .quick-stats { display: none; }
    .teams { font-size: 13px; }
    .tr-bar-label { width: 96px; }
    .tr-bar-val { min-width: 78px; }
    .tr-bar-note { display: none; }
    .tr-be-hit { width: 78px; }
    .tr-be-odds { width: 50px; }
  }
</style>
</head>
<body>

  <header>
    <h1>Stat Pack</h1>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main id="main">
    <div class="empty">Loading…</div>
  </main>

  <footer>
    Data: football-data.co.uk (results) + fixturedownload.com (fixtures). Poisson model — treat as a signal, not a certainty.
  </footer>

<script src="statpack_data.js"></script>
<script src="bets_log.js"></script>
<script src="nfl_statpack_data.js"></script>
<script src="racing_data.js"></script>
<script src="racing_today.js" onerror="void 0"></script>
<script src="racing_results.js" onerror="void 0"></script>
<script src="racing_data_ire.js" onerror="void 0"></script>
<script>
(function () {
  const LEAGUE_ORDER = ["E0", "E1", "E2", "E3", "SC0", "I1", "SP1", "D1", "F1", "MLS"];
  const BEST_BETS = "__BEST_BETS__";
  const TODAY = "__TODAY__";
  const TRACK_RECORD = "__TRACK_RECORD__";
  const MODEL_CHECK = "__MODEL_CHECK__";
  const SLIP = "__SLIP__";
  const BANKROLL = "__BANKROLL__";
  const RACING = "__RACING__";
  const EFL_CUP = "__EFL_CUP__";
  const CASH_BUILDER = "__CASH_BUILDER__";
  const NFL = "__NFL__";
  const NEAR_TERM_WINDOW_DAYS = 4; // one weekend round (Fri-Mon) - covers a single gameweek without pulling in next week's fixtures too
  let showFullSeason = false; // toggled by the "Show full season" link in league views
  let footballMenuOpen = false; // toggled by clicking the "Football" tab
  let bestBetsSortMode = "confidence"; // toggled by the sort-order links on the Best Bets tab
  let bestBetsHiddenMetrics = new Set(); // metrics unchecked by the filter row - empty means "show everything"
  let bestBetsMarketOnly = false; // toggled by the "Market-matched only" checkbox
  let trSport = "all"; // Track Record sport toggle: all / football / nfl
  // NFL "Recent Results" visibility - remembered between visits (per-device).
  let nflHideResults = false;
  try { nflHideResults = localStorage.getItem("nflHideResults") === "1"; } catch (e) {}
  // ---------- Bet slip state ----------
  // Selections picked on Best Bets, kept in this browser (localStorage), so
  // they survive a refresh and the daily data updates. Per-device: a slip
  // saved on your phone won't appear on your laptop.
  const SLIP_STORE = "betSlipCurrent", SLIP_SAVED_STORE = "betSlipSaved";
  function slipLoad(key, fallback) {
    try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; } catch (e) { return fallback; }
  }
  function slipSave(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }
  let slip = slipLoad(SLIP_STORE, { items: [], stake: "" });
  if (!slip || !Array.isArray(slip.items)) slip = { items: [], stake: "" };
  let savedSlips = slipLoad(SLIP_SAVED_STORE, []);
  if (!Array.isArray(savedSlips)) savedSlips = [];
  let slipDeleteArmed = null; // id of a saved slip awaiting its second "Delete" tap
  let slipJustSaved = false;
  let trShowAllRecent = false; // Track Record "show all recent picks" toggle
  let data = (typeof STATPACK_DATA !== "undefined") ? STATPACK_DATA.generated_leagues : null;
  let activeLeague = null;

  const tabsEl = document.getElementById("tabs");
  const mainEl = document.getElementById("main");

  // ---- Tappable percentages on fixture cards -> bet slip ----
  // Every percentage on a card is wrapped by pctBtn(), which describes the
  // pick (in the same shape Best Bets uses, so the same pick added from
  // either place is recognised as one pick) and registers it. One click
  // handler on <main> does the adding/removing for all of them.
  const PICK_REG = new Map();
  let slipCtx = null;   // the fixture whose card is being built right now
  const NFL_METRIC_LABELS = { points: "Points", passing_tds: "Passing TDs", rushing_tds: "Rushing TDs",
    passing_yards: "Passing Yards", rushing_yards: "Rushing Yards" };

  function pctBtn(spec, prob) {
    if (!slipCtx || prob == null) return pct(prob);
    const fx = slipCtx.fx;
    const p = { sport: slipCtx.sport, home_team: fx.home_team, away_team: fx.away_team, league_name: slipCtx.league,
      date: fx.date || "", time: fx.time || "", team: null, line: null, ...spec,
      confidence: Math.round(prob * 1000) / 1000 };
    const key = slipKey(p);
    PICK_REG.set(key, p);
    const on = inSlip(p);
    return `<button type="button" class="pct-add${on ? " in-slip" : ""}" data-slip-key="${escAttr(key)}" title="${on ? "On your bet slip - tap to remove" : "Tap to add to your bet slip"}">${pct(prob)}</button>`;
  }

  mainEl.addEventListener("click", (e) => {
    const b = e.target.closest && e.target.closest(".pct-add");
    if (!b) return;
    e.preventDefault();
    e.stopPropagation();
    const key = b.dataset.slipKey;
    const idx = slip.items.findIndex(i => i.key === key);
    if (idx >= 0) {
      slip.items.splice(idx, 1);
    } else {
      const p = PICK_REG.get(key);
      if (!p) return;
      slip.items.push({ key, label: p.label, league: p.league_name, date: p.date, time: p.time || "", confidence: p.confidence });
    }
    slipJustSaved = false;
    slipSave(SLIP_STORE, slip);
    const inNow = slip.items.some(i => i.key === key);
    mainEl.querySelectorAll(".pct-add").forEach(el => { if (el.dataset.slipKey === key) el.classList.toggle("in-slip", inNow); });
    buildTabs();
  });

  if (!data) {
    mainEl.innerHTML = '<div class="empty">No statpack_data.js found next to this file.<br>Run build_statpack.py, then open this page from the same folder.</div>';
    return;
  }

  const availableLeagues = LEAGUE_ORDER.filter(code => data[code]);
  if (availableLeagues.length === 0) {
    mainEl.innerHTML = '<div class="empty">No league data found. Run fetch_data.py and build_statpack.py first.</div>';
    return;
  }
  activeLeague = TODAY;

  function pct(n) { return Math.round(n * 100) + "%"; }

  function ordinal(n) {
    if (!n) return "";
    const s = ["th", "st", "nd", "rd"], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }

  function posBadge(position) {
    if (!position) return "";
    return `<span class="pos-badge">${ordinal(position)}</span>`;
  }

  function parseFixtureDate(d) {
    const parts = (d || "").split("/");
    if (parts.length !== 3) return null;
    const dt = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
    return isNaN(dt) ? null : dt;
  }

  // Sortable timestamp combining date + kickoff time - used to put
  // fixtures back into chronological order before grouping/display,
  // rather than trusting the source file's row order. Confirmed this
  // matters in practice: a rearranged fixture (e.g. moved to a later
  // date for European-fixture reasons) can sit earlier in the source
  // CSV than fixtures that kept their original, earlier date, which
  // otherwise showed matches out of date order on the page. Undated
  // fixtures sort last (Infinity) rather than disappearing or
  // clumping at the start.
  function fixtureTimestamp(fx) {
    const d = parseFixtureDate(fx.date);
    if (!d) return Infinity;
    // No kick-off time yet (TBC): sort after timed games that day and stay
    // on the Today list until the day ends, rather than looking like 00:00.
    const [hh, mm] = (fx.time || "23:59").split(":").map(Number);
    return d.getTime() + ((isNaN(hh) ? 0 : hh) * 60 + (isNaN(mm) ? 0 : mm)) * 60000;
  }

  function sortByKickoff(fixtures) {
    return [...fixtures].sort((a, b) => fixtureTimestamp(a) - fixtureTimestamp(b));
  }

  function fmtDate(d) {
    // d like "22/08/2026" -> "FRI 22 AUG"
    const parts = (d || "").split("/");
    if (parts.length !== 3) return d || "TBC";
    const dt = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
    if (isNaN(dt)) return d;
    return dt.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }).toUpperCase();
  }

  function isFootballView(league) {
    return availableLeagues.includes(league) || league === EFL_CUP || league === CASH_BUILDER;
  }

  function buildTabs() {
    tabsEl.innerHTML = "";
    // The football dropdown lives on <body>, not inside tabsEl (see below),
    // so clearing tabsEl doesn't remove a stale copy - do that here.
    const staleMenu = document.getElementById("football-dropdown-menu");
    if (staleMenu) staleMenu.remove();

    const todayBtn = document.createElement("button");
    todayBtn.className = "tab" + (activeLeague === TODAY ? " active" : "");
    todayBtn.innerHTML = "Today";
    todayBtn.addEventListener("click", () => { activeLeague = TODAY; footballMenuOpen = false; render(); });
    tabsEl.appendChild(todayBtn);

    // Football is a single top-level tab with a dropdown underneath it -
    // every league, EFL Cup, and Cash Builder used to each get their own
    // top-level slot, which stopped being manageable once NFL joined
    // them as a genuinely different sport needing its own space.
    const footballWrap = document.createElement("div");
    footballWrap.className = "tab-wrap";

    const footballBtn = document.createElement("button");
    footballBtn.className = "tab" + (isFootballView(activeLeague) ? " active" : "");
    footballBtn.innerHTML = `Football <span class="chev-dd">${footballMenuOpen ? "▴" : "▾"}</span>`;
    footballBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      footballMenuOpen = !footballMenuOpen;
      buildTabs();
    });
    footballWrap.appendChild(footballBtn);
    tabsEl.appendChild(footballWrap);

    if (footballMenuOpen) {
      const menu = document.createElement("div");
      menu.id = "football-dropdown-menu";
      menu.className = "football-dropdown";

      availableLeagues.forEach(code => {
        const league = data[code];
        const item = document.createElement("button");
        item.className = "dropdown-item" + (code === activeLeague ? " active" : "");
        item.innerHTML = league.league_name + ' <span class="count">' + league.upcoming_fixtures.length + '</span>';
        item.addEventListener("click", (e) => {
          e.stopPropagation();
          activeLeague = code; footballMenuOpen = false; render();
        });
        menu.appendChild(item);
      });

      const cupFixtures = (typeof STATPACK_DATA !== "undefined" && STATPACK_DATA.efl_cup)
        ? STATPACK_DATA.efl_cup.fixtures : [];
      const cashBuilderAvailable = typeof CASH_BUILDER_DATA !== "undefined"
        && CASH_BUILDER_DATA.chains && CASH_BUILDER_DATA.chains.length > 0;

      if (cupFixtures.length > 0 || cashBuilderAvailable) {
        const divider = document.createElement("div");
        divider.className = "dropdown-divider";
        menu.appendChild(divider);
      }

      if (cupFixtures.length > 0) {
        const item = document.createElement("button");
        item.className = "dropdown-item" + (activeLeague === EFL_CUP ? " active" : "");
        item.innerHTML = "EFL Cup " + `<span class="count">${cupFixtures.length}</span>`;
        item.addEventListener("click", (e) => {
          e.stopPropagation();
          activeLeague = EFL_CUP; footballMenuOpen = false; render();
        });
        menu.appendChild(item);
      }

      if (cashBuilderAvailable) {
        const item = document.createElement("button");
        item.className = "dropdown-item" + (activeLeague === CASH_BUILDER ? " active" : "");
        item.innerHTML = "Cash Builder";
        item.addEventListener("click", (e) => {
          e.stopPropagation();
          activeLeague = CASH_BUILDER; footballMenuOpen = false; render();
        });
        menu.appendChild(item);
      }

      // Appended to <body> with a computed fixed position, rather than
      // inside footballWrap, so it isn't clipped by .tabs' own horizontal
      // scroll container (see the .football-dropdown CSS comment).
      const btnRect = footballBtn.getBoundingClientRect();
      menu.style.position = "fixed";
      menu.style.top = `${btnRect.bottom + 4}px`;
      menu.style.left = `${btnRect.left}px`;
      document.body.appendChild(menu);
    }

    if (typeof NFL_STATPACK_DATA !== "undefined" && NFL_STATPACK_DATA.upcoming_fixtures) {
      const nflBtn = document.createElement("button");
      nflBtn.className = "tab" + (activeLeague === NFL ? " active" : "");
      nflBtn.innerHTML = "NFL " + `<span class="count">${NFL_STATPACK_DATA.upcoming_fixtures.length}</span>`;
      nflBtn.addEventListener("click", () => { activeLeague = NFL; footballMenuOpen = false; render(); });
      tabsEl.appendChild(nflBtn);
    }

    const raceBtn = document.createElement("button");
    raceBtn.className = "tab" + (activeLeague === RACING ? " active" : "");
    raceBtn.innerHTML = "Racing";
    raceBtn.addEventListener("click", () => { activeLeague = RACING; footballMenuOpen = false; render(); });
    tabsEl.appendChild(raceBtn);

    const bbBtn = document.createElement("button");
    bbBtn.className = "tab" + (activeLeague === BEST_BETS ? " active" : "");
    bbBtn.innerHTML = "★ Best Bets";
    bbBtn.addEventListener("click", () => { activeLeague = BEST_BETS; footballMenuOpen = false; render(); });
    tabsEl.appendChild(bbBtn);

    const slipBtn = document.createElement("button");
    slipBtn.className = "tab" + (activeLeague === SLIP ? " active" : "");
    slipBtn.innerHTML = "Bet Slip" + (slip.items.length ? ` <span class="count">${slip.items.length}</span>` : "");
    slipBtn.addEventListener("click", () => { activeLeague = SLIP; footballMenuOpen = false; render(); });
    tabsEl.appendChild(slipBtn);

    const bankBtn = document.createElement("button");
    bankBtn.className = "tab" + (activeLeague === BANKROLL ? " active" : "");
    bankBtn.innerHTML = "Bankroll" + (bank && bank.bets.some(b => b.status === "pending") ? ` <span class="count">${bank.bets.filter(b => b.status === "pending").length}</span>` : "");
    bankBtn.addEventListener("click", () => { activeLeague = BANKROLL; footballMenuOpen = false; render(); });
    tabsEl.appendChild(bankBtn);

    const trBtn = document.createElement("button");
    trBtn.className = "tab" + (activeLeague === TRACK_RECORD ? " active" : "");
    const trPct = (typeof BETS_LOG !== "undefined" && BETS_LOG.summary.overall.total > 0)
      ? ` ${BETS_LOG.summary.overall.pct}%` : "";
    trBtn.innerHTML = "Track Record" + trPct;
    trBtn.addEventListener("click", () => { activeLeague = TRACK_RECORD; footballMenuOpen = false; render(); });
    tabsEl.appendChild(trBtn);

    if (typeof BETS_LOG !== "undefined" && BETS_LOG.blocks) {
      const mcBtn = document.createElement("button");
      mcBtn.className = "tab" + (activeLeague === MODEL_CHECK ? " active" : "");
      mcBtn.innerHTML = "Odds &amp; Calibration";
      mcBtn.addEventListener("click", () => { activeLeague = MODEL_CHECK; footballMenuOpen = false; render(); });
      tabsEl.appendChild(mcBtn);
    }
  }

  function metricBlock(title, m, homeTeam, awayTeam, metricKey) {
    if (!m) return "";
    const metricLabel = ALL_METRIC_LABELS[metricKey] || title;
    const ouRows = (m.over_under || []).map(ou => {
      const overPct = ou.over;
      const barColor = overPct >= 0.5 ? "var(--green)" : "var(--accent)";
      return `<div class="ou-row">
        <span class="ou-line">O/U ${ou.line}</span>
        <div class="ou-bar-wrap"><div class="ou-bar" style="width:${Math.round(overPct*100)}%;background:${barColor}"></div></div>
        <span class="ou-pct ${overPct >= 0.55 ? 'pct-hi' : overPct <= 0.4 ? 'pct-lo' : ''}">${pctBtn({ metric: metricKey, scope: "match", direction: "Over", line: ou.line,
          label: `${homeTeam} v ${awayTeam} - Over ${ou.line} ${metricLabel}` }, overPct)}</span>
      </div>`;
    }).join("");

    const bttsLabel = `${homeTeam} v ${awayTeam} - BTTS`;
    const btts = (m.btts_yes !== undefined)
      ? `<div class="btts-row">BTTS: <b>${pctBtn({ metric: "btts", scope: "match", direction: "Yes", label: bttsLabel + " Yes" }, m.btts_yes)}</b> yes / ${pctBtn({ metric: "btts", scope: "match", direction: "No", label: bttsLabel + " No" }, m.btts_no)} no</div>`
      : "";

    const split = m.home_over_under ? splitBlock(m, homeTeam, awayTeam, metricKey) : "";

    return `<div class="metric-card">
      <div class="metric-title">${title} <span style="opacity:0.6">· over %</span></div>
      <div class="metric-expected">${m.expected_total}<span class="label">expected</span></div>
      ${ouRows}
      ${btts}
      ${split}
    </div>`;
  }

  function splitSideRows(entries, team, scope, metricKey) {
    return entries.map(ou => `<div class="split-ou-row">
      <span class="split-ou-line">${ou.line}</span>
      <span class="split-ou-pct ${ou.over >= 0.55 ? 'pct-hi' : ou.over <= 0.4 ? 'pct-lo' : ''}">${pctBtn({ metric: metricKey, scope, team, direction: "Over", line: ou.line,
        label: `${team} - Over ${ou.line} ${ALL_METRIC_LABELS[metricKey] || metricKey}` }, ou.over)}</span>
    </div>`).join("");
  }

  function splitBlock(m, homeTeam, awayTeam, metricKey) {
    return `<div class="metric-split">
      <div class="metric-split-col">
        <div class="metric-split-title">${homeTeam || 'Home'}</div>
        <div class="metric-split-expected">${m.expected_home}</div>
        ${splitSideRows(m.home_over_under, homeTeam, "home", metricKey)}
      </div>
      <div class="metric-split-col">
        <div class="metric-split-title">${awayTeam || 'Away'}</div>
        <div class="metric-split-expected">${m.expected_away}</div>
        ${splitSideRows(m.away_over_under, awayTeam, "away", metricKey)}
      </div>
    </div>`;
  }

  function quickStat(fixture) {
    const g = fixture.predictions.goals;
    const c = fixture.predictions.corners;
    if (!g || !c) return "";
    const goalsLine = g.over_under.find(o => o.line === 2.5) || g.over_under[0];
    const cornersLine = c.over_under.find(o => o.line === 9.5) || c.over_under[0];
    return `<div class="quick-stats">
      <span class="quick-stat">O${goalsLine.line} GLS <b class="${goalsLine.over >= 0.55 ? 'pct-hi' : ''}">${pct(goalsLine.over)}</b></span>
      <span class="quick-stat">O${cornersLine.line} CRN <b class="${cornersLine.over >= 0.55 ? 'pct-hi' : ''}">${pct(cornersLine.over)}</b></span>
    </div>`;
  }

  function flagBadges(fixture) {
    // market_blended is a different kind of signal to everything else
    // here - the others are all CAUTIONS (treat this prediction with
    // more care), styled amber accordingly. Market blending means the
    // opposite - real bookmaker odds are backing this prediction, not
    // undermining it - so it gets its own green styling and comes
    // first, rather than being lumped in with the warning flags.
    const marketBadge = fixture.market_blended ? `<span class="flag-market">M</span>` : "";

    const flags = [];
    if (fixture.cross_league_data) flags.push('cross-league');
    if (fixture.cross_division) flags.push('cross-division');
    if (fixture.fuzzy_name_match) flags.push('name check');
    if (fixture.low_sample) flags.push('thin sample');
    return marketBadge + flags.map(f => `<span class="flag">${f}</span>`).join("");
  }

  function matchResultBlock(fixture) {
    const mr = fixture.predictions.goals?.match_result;
    if (!mr) return "";

    const options = [
      { label: fixture.home_team, position: fixture.home_position, key: "home_win", pct: mr.home_win,
        spec: { metric: "team_win", scope: "home", team: fixture.home_team, direction: fixture.home_team, label: `${fixture.home_team} to win` } },
      { label: "Draw", position: null, key: "draw", pct: mr.draw,
        spec: { metric: "draw", scope: "match", direction: "Draw", label: `${fixture.home_team} v ${fixture.away_team} - Draw` } },
      { label: fixture.away_team, position: fixture.away_position, key: "away_win", pct: mr.away_win,
        spec: { metric: "team_win", scope: "away", team: fixture.away_team, direction: fixture.away_team, label: `${fixture.away_team} to win` } },
    ];
    const highest = Math.max(mr.home_win, mr.draw, mr.away_win);

    return `<div class="mr-block">
      <div class="metric-title">Match Result</div>
      <div class="mr-row">
        ${options.map(o => `
          <div class="mr-option ${o.pct === highest ? 'mr-favourite' : ''}">
            <div class="mr-label">${o.label}${posBadge(o.position)}</div>
            <div class="mr-pct ${o.pct === highest ? 'pct-hi' : ''}">${pctBtn(o.spec, o.pct)}</div>
          </div>
        `).join("")}
      </div>
    </div>`;
  }

  // The card is built with slipCtx set to this fixture, so every
  // percentage knows which game it belongs to (see pctBtn).
  function fixtureCard(fixture, badge, leagueName) {
    slipCtx = { sport: "football", league: leagueName || (typeof badge === "string" ? badge : ""), fx: fixture };
    try { return fixtureCardHtml(fixture, badge); } finally { slipCtx = null; }
  }

  function fixtureCardHtml(fixture, badge) {
    const p = fixture.predictions;
    const flag = flagBadges(fixture);
    const note = fixture.note ? `<div class="note">⚠ ${fixture.note.trim()}</div>` : "";
    const badgeHtml = badge ? `<span class="fixture-badge">${badge}</span>` : "";

    return `<details class="fixture">
      <summary>
        <span class="kickoff">${fixture.time || "--:--"}</span>
        <span class="teams">${fixture.home_team}<span class="v">v</span>${fixture.away_team}</span>
        ${badgeHtml}
        ${flag}
        ${quickStat(fixture)}
        <span class="chev">▸</span>
      </summary>
      <div class="detail">
        ${note}
        ${matchResultBlock(fixture)}
        <div class="metric-grid">
          ${metricBlock("Full-Time Goals", p.goals, fixture.home_team, fixture.away_team, "goals")}
          ${metricBlock("Corners", p.corners, fixture.home_team, fixture.away_team, "corners")}
          ${metricBlock("Cards", p.cards, fixture.home_team, fixture.away_team, "cards")}
          ${metricBlock("1st-Half Goals", p.first_half_goals, fixture.home_team, fixture.away_team, "first_half_goals")}
          ${metricBlock("2nd-Half Goals", p.second_half_goals, fixture.home_team, fixture.away_team, "second_half_goals")}
        </div>
        <div class="sample-note">Form sample: ${fixture.home_form_sample} home games, ${fixture.away_form_sample} away games</div>
      </div>
    </details>`;
  }

  const METRIC_LABELS = {
    goals: "Full-Time Goals",
    corners: "Corners",
    cards: "Cards",
    first_half_goals: "1st-Half Goals",
    second_half_goals: "2nd-Half Goals",
  };

  // Best Bets is now a single FLAT list (see best_bets.py / nfl_best_bets.py) -
  // every qualifying pick across every league AND sport, sorted by
  // confidence, no category grouping. Each pick already carries a
  // ready-to-display "label" computed in Python, so rendering here is
  // just laying out common fields (time, league/sport badge, label,
  // confidence) rather than reconstructing pick-type-specific text.

  function escAttr(v) {
    return String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function slipKey(p) {
    return [p.sport || "football", p.home_team, p.away_team, p.date, p.metric, p.scope, p.direction, p.line == null ? "" : p.line].join("|");
  }
  function inSlip(p) { const k = slipKey(p); return slip.items.some(i => i.key === k); }

  function flatBestBetRow(pick, rank) {
    return `<div class="bb-row">
      <span class="bb-rank">${rank}</span>
      <span class="kickoff">${pick.time || "--:--"}</span>
      <span class="bb-teams" style="flex:2">${pick.label}</span>
      <span class="bb-league">${pick.league_name}</span>
      <span class="bb-pct ${pick.confidence >= 0.55 ? 'pct-hi' : pick.confidence <= 0.4 ? 'pct-lo' : ''}">${pct(pick.confidence)}</span>
      <button class="bb-add${inSlip(pick) ? " in-slip" : ""}" data-slip-key="${escAttr(slipKey(pick))}" title="Add to bet slip" aria-label="Add to bet slip">${inSlip(pick) ? "✓" : "+"}</button>
    </div>`;
  }

  // Groups picks by their underlying fixture (same sport/teams/date/
  // time), orders the GROUPS by kickoff time, and within each group
  // orders picks by confidence - so multiple picks on the same game
  // (e.g. a match-level Over plus a team-level corners pick) end up
  // sitting next to each other rather than scattered wherever their
  // individual confidence happens to place them.
  function groupPicksByGame(picks) {
    const groups = new Map();
    picks.forEach(p => {
      const key = `${p.sport}|${p.home_team}|${p.away_team}|${p.date}|${p.time}`;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(p);
    });
    const groupList = Array.from(groups.values());
    groupList.forEach(g => g.sort((a, b) => b.confidence - a.confidence));
    groupList.sort((a, b) => fixtureTimestamp(a[0]) - fixtureTimestamp(b[0]));
    return groupList.flat();
  }

  const ALL_METRIC_LABELS = {
    goals: "Goals",
    corners: "Corners",
    cards: "Cards",
    first_half_goals: "1st-Half Goals",
    second_half_goals: "2nd-Half Goals",
    btts: "BTTS",
    team_win: "Team Win",
    moneyline: "Moneyline",
    points: "Points",
    passing_tds: "Passing TDs",
    rushing_tds: "Rushing TDs",
    passing_yards: "Passing Yards",
    rushing_yards: "Rushing Yards",
  };

  // Checkbox filter row - built dynamically from whichever metrics
  // actually appear in TODAY's pool (not a fixed list), so a day with
  // no NFL picks simply doesn't show NFL-only checkboxes, and a new
  // metric added later needs no changes here to show up. Unchecking a
  // box hides that metric; everything defaults to checked (shown).
  function bestBetsFilterRow(picks) {
    const metricsPresent = [...new Set(picks.map(p => p.metric))];
    if (metricsPresent.length <= 1) return ""; // nothing meaningful to filter
    metricsPresent.sort();
    return `<div class="bb-filter-row">
      ${metricsPresent.map(m => `
        <label class="bb-filter-item">
          <input type="checkbox" data-metric="${m}" ${bestBetsHiddenMetrics.has(m) ? "" : "checked"}>
          ${ALL_METRIC_LABELS[m] || m}
        </label>
      `).join("")}
    </div>`;
  }

  // Market-matched filter - kept separate from the metric checkboxes above
  // because it isn't itself a metric, it's a data-quality signal (same
  // market_blended flag behind the green "M" badge on fixture cards, see
  // flagBadges). Only shown when at least one of today's picks actually has
  // it - most useful exactly on days like an international break, where
  // most fixtures are postponed and the handful still on are worth judging
  // by whether they're backed by real bookmaker odds rather than model-only.
  // Best Bets picks don't necessarily carry market_blended themselves -
  // they're generated from the fixtures that do, but the flattening in
  // best_bets.py / nfl_best_bets.py doesn't always carry every fixture-level
  // field along with it. This builds a lookup from the fixture data
  // (same team/date/time key used elsewhere to match a pick back to its
  // game) so the filter works whether or not the pick object itself has
  // the flag.
  function buildFixtureMarketMap() {
    const map = new Map();
    const addFx = fx => {
      map.set(`${fx.home_team}|${fx.away_team}|${fx.date}|${fx.time}`, !!fx.market_blended);
    };
    if (data) {
      Object.values(data).forEach(league => (league.upcoming_fixtures || []).forEach(addFx));
    }
    const cupFixtures = (typeof STATPACK_DATA !== "undefined" && STATPACK_DATA.efl_cup)
      ? STATPACK_DATA.efl_cup.fixtures : [];
    cupFixtures.forEach(addFx);
    if (typeof NFL_STATPACK_DATA !== "undefined" && NFL_STATPACK_DATA.upcoming_fixtures) {
      NFL_STATPACK_DATA.upcoming_fixtures.forEach(addFx);
    }
    return map;
  }

  function isMarketMatched(pick, fixtureMarketMap) {
    if (pick.market_blended !== undefined) return !!pick.market_blended;
    return !!fixtureMarketMap.get(`${pick.home_team}|${pick.away_team}|${pick.date}|${pick.time}`);
  }

  function bestBetsMarketToggle(picks, fixtureMarketMap) {
    const marketCount = picks.filter(p => isMarketMatched(p, fixtureMarketMap)).length;
    if (marketCount === 0) return "";
    return `<div class="bb-filter-row">
      <label class="bb-filter-item">
        <input type="checkbox" id="bb-market-only" ${bestBetsMarketOnly ? "checked" : ""}>
        Market-matched only <span style="color:var(--green)">(${marketCount})</span>
      </label>
    </div>`;
  }

  function bestBetsSortToggle() {
    const opt = (mode, label) => mode === bestBetsSortMode
      ? `<span class="sort-toggle-active">${label}</span>`
      : `<a href="#" class="sort-toggle-link" data-sort="${mode}">${label}</a>`;
    return `<div class="window-toggle">Sort: ${opt("confidence", "% Confidence")} · ${opt("game", "By Game")}</div>`;
  }

  function renderBestBets() {
    const footballPicks = (typeof STATPACK_DATA !== "undefined" && Array.isArray(STATPACK_DATA.best_bets))
      ? STATPACK_DATA.best_bets : [];
    const nflPicks = (typeof NFL_STATPACK_DATA !== "undefined" && Array.isArray(NFL_STATPACK_DATA.best_bets))
      ? NFL_STATPACK_DATA.best_bets : [];
    // A pick on a game that has already kicked off isn't a bet you can place
    // any more, so it drops off as soon as the kick-off time passes (the stat
    // pack itself only re-runs a few times a day).
    const nowMs = Date.now();
    const allPicksRaw = [...footballPicks, ...nflPicks];
    // Exact local kick-off (fixtureTimestamp reads the date as UTC, which in
    // summer time puts every kick-off an hour late - fine for sorting, not here).
    const kickoffMs = p => {
      const [dd, mo, yy] = (p.date || "").split("/").map(Number);
      if (!dd || !mo || !yy) return Infinity;
      const [hh, mm] = (p.time || "23:59").split(":").map(Number);
      return new Date(yy, mo - 1, dd, isNaN(hh) ? 23 : hh, isNaN(mm) ? 59 : mm).getTime();
    };
    const combined = allPicksRaw.filter(p => kickoffMs(p) > nowMs);
    const startedCount = allPicksRaw.length - combined.length;

    if (combined.length === 0) {
      mainEl.innerHTML = `<div class="empty">${startedCount ? `All ${startedCount} of today's picks are on games that have already started.<br>The next stat pack run brings in the next games.` : `No eligible picks today across any league or sport.`}<br>
        (Fixtures with a thin sample, cross-league, or name-match flag are excluded from Best Bets - check the league tabs for those.)</div>`;
      return;
    }

    const fixtureMarketMap = buildFixtureMarketMap();
    const filterRow = bestBetsFilterRow(combined);
    const marketToggleRow = bestBetsMarketToggle(combined, fixtureMarketMap);
    let visible = combined.filter(p => !bestBetsHiddenMetrics.has(p.metric));
    if (bestBetsMarketOnly) visible = visible.filter(p => isMarketMatched(p, fixtureMarketMap));
    const allPicks = bestBetsSortMode === "game"
      ? groupPicksByGame(visible)
      : [...visible].sort((a, b) => b.confidence - a.confidence);

    const listHtml = allPicks.length > 0
      ? allPicks.map((p, i) => flatBestBetRow(p, i + 1)).join("")
      : `<div class="bb-empty">No picks match the current filter</div>`;

    mainEl.innerHTML = `<div class="bb-intro">Every pick today, across every league and sport, that clears its confidence bar. Team-level picks (e.g. one side's own corner count) sit alongside match-level ones with no separate grouping.${startedCount ? ` <span class="tr-chip-n">${startedCount} pick${startedCount === 1 ? "" : "s"} hidden: the game has already started.</span>` : ""}</div>` +
      filterRow +
      marketToggleRow +
      bestBetsSortToggle() +
      listHtml;

    mainEl.querySelectorAll(".bb-filter-item input[data-metric]").forEach(box => {
      box.addEventListener("change", () => {
        const metric = box.dataset.metric;
        if (box.checked) bestBetsHiddenMetrics.delete(metric);
        else bestBetsHiddenMetrics.add(metric);
        render();
      });
    });

    const pickByKey = new Map(allPicks.map(p => [slipKey(p), p]));
    mainEl.querySelectorAll(".bb-add").forEach(btn => {
      btn.addEventListener("click", () => {
        const key = btn.dataset.slipKey;
        const idx = slip.items.findIndex(i => i.key === key);
        if (idx >= 0) {
          slip.items.splice(idx, 1);
        } else {
          const p = pickByKey.get(key);
          if (!p) return;
          slip.items.push({ key, label: p.label, league: p.league_name, date: p.date, time: p.time || "",
            confidence: p.confidence });
        }
        slipJustSaved = false;
        slipSave(SLIP_STORE, slip);
        const inNow = slip.items.some(i => i.key === key);
        btn.classList.toggle("in-slip", inNow);
        btn.textContent = inNow ? "✓" : "+";
        buildTabs();
      });
    });

    const marketBox = mainEl.querySelector("#bb-market-only");
    if (marketBox) {
      marketBox.addEventListener("change", () => {
        bestBetsMarketOnly = marketBox.checked;
        render();
      });
    }

    const toggle = mainEl.querySelector(".window-toggle");
    if (toggle) {
      toggle.querySelectorAll("a[data-sort]").forEach(link => {
        link.addEventListener("click", (e) => {
          e.preventDefault();
          bestBetsSortMode = link.dataset.sort;
          render();
        });
      });

    }
  }

  // ---------- Same-game joint probabilities ----------
  // Multiplying the legs of a same-game slip ignores that they move
  // together (a home win and over 1.5 goals, say). For legs from one game
  // we rebuild the game from the model's own expected numbers - goals as
  // Poisson counts, corners and cards the same, NFL points as bell curves -
  // work out the exact joint chance on that rebuilt game, and compare it
  // with the same legs multiplied. That ratio (how much the legs help or hurt
  // each other) is applied to the model's displayed percentages, so each
  // leg still carries exactly the % shown on the card. Different kinds of
  // leg (goals v corners v cards, or NFL points v touchdowns) are treated as
  // independent, because the model has no joint view of them.
  const NFL_TEAM_SD = 9.5;   // points scored by one NFL team in a game

  function poissonPmf(lambda, cap) {
    const out = [Math.exp(-lambda)];
    let sum = out[0];
    for (let k = 1; k <= cap && sum < 1 - 1e-10; k++) { out.push(out[k - 1] * lambda / k); sum += out[k]; }
    return out;
  }
  function normPmf(mean, sd, cap) {
    const cdf = x => 0.5 * (1 + erf((x - mean) / (sd * Math.SQRT2)));
    const out = [];
    for (let k = 0; k <= cap; k++) out.push(Math.max(0, cdf(k + 0.5) - cdf(k - 0.5)));
    const s = out.reduce((a, b) => a + b, 0);
    return out.map(v => v / s);
  }
  function erf(x) {   // Abramowitz-Stegun 7.1.26
    const s = x < 0 ? -1 : 1; x = Math.abs(x);
    const t = 1 / (1 + 0.3275911 * x);
    const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
    return s * y;
  }

  function parseLeg(item) {
    const [sport, home, away, date, metric, scope, direction, line] = item.key.split("|");
    return { sport, home, away, date, metric, scope, direction, line: line === "" ? null : Number(line), p: item.confidence };
  }

  function findPredictions(sport, home, away, date) {
    const same = fx => fx.home_team === home && fx.away_team === away && fx.date === date;
    if (sport === "nfl") {
      const list = (typeof NFL_STATPACK_DATA !== "undefined" && NFL_STATPACK_DATA.upcoming_fixtures) || [];
      const fx = list.find(same);
      return fx ? fx.predictions : null;
    }
    for (const lg of Object.values(data || {})) {
      const fx = (lg.upcoming_fixtures || []).find(same);
      if (fx) return fx.predictions;
    }
    const cups = (typeof STATPACK_DATA !== "undefined" && STATPACK_DATA.efl_cup) ? STATPACK_DATA.efl_cup.fixtures : [];
    const fx = cups.find(same);
    return fx ? fx.predictions : null;
  }

  // Each family returns { joint, indep } on its rebuilt game, or null.
  function familyRatio(kind, legs, preds) {
    let vars, evalLeg;
    if (kind === "goals") {
      const g = preds.goals, f1 = preds.first_half_goals, f2 = preds.second_half_goals;
      const halves = legs.some(l => l.metric === "first_half_goals" || l.metric === "second_half_goals");
      if (!g) return null;
      if (halves) {
        if (!f1 || !f2) return null;
        vars = [poissonPmf(f1.expected_home, 9), poissonPmf(f1.expected_away, 9), poissonPmf(f2.expected_home, 9), poissonPmf(f2.expected_away, 9)];
      } else {
        vars = [poissonPmf(g.expected_home, 14), poissonPmf(g.expected_away, 14)];
      }
      evalLeg = (l, s) => {
        const h1 = s[0], a1 = s[1], h2 = halves ? s[2] : 0, a2 = halves ? s[3] : 0;
        const h = h1 + h2, a = a1 + a2;
        const pick = (x, y, sc) => sc === "home" ? x : sc === "away" ? y : x + y;
        if (l.metric === "goals") return pick(h, a, l.scope) > l.line ? 1 : 0;
        if (l.metric === "first_half_goals") return pick(h1, a1, l.scope) > l.line ? 1 : 0;
        if (l.metric === "second_half_goals") return pick(h2, a2, l.scope) > l.line ? 1 : 0;
        if (l.metric === "btts") { const y = h > 0 && a > 0; return (l.direction === "Yes") === y ? 1 : 0; }
        if (l.metric === "team_win") return l.scope === "home" ? (h > a ? 1 : 0) : (a > h ? 1 : 0);
        if (l.metric === "draw") return h === a ? 1 : 0;
        return null;
      };
    } else if (kind === "corners" || kind === "cards") {
      const m = preds[kind];
      if (!m) return null;
      const cap = kind === "corners" ? 40 : 16;
      vars = [poissonPmf(m.expected_home, cap), poissonPmf(m.expected_away, cap)];
      evalLeg = (l, s) => (l.scope === "home" ? s[0] : l.scope === "away" ? s[1] : s[0] + s[1]) > l.line ? 1 : 0;
    } else if (kind === "nfl_points") {
      const m = preds.points;
      if (!m) return null;
      vars = [normPmf(m.expected_home, NFL_TEAM_SD, 70), normPmf(m.expected_away, NFL_TEAM_SD, 70)];
      evalLeg = (l, s) => {
        if (l.metric === "moneyline") { const d = s[0] - s[1]; const w = d > 0 ? 1 : d === 0 ? 0.5 : 0; return l.scope === "home" ? w : 1 - w; }
        return (l.scope === "home" ? s[0] : l.scope === "away" ? s[1] : s[0] + s[1]) > l.line ? 1 : 0;
      };
    } else return null;

    // Marginals and the joint over every cell of the rebuilt game.
    const marg = legs.map(() => 0);
    let joint = 0;
    const idx = vars.map(() => 0), s = vars.map(() => 0);
    (function walk(d, w) {
      if (d === vars.length) {
        let all = 1;
        for (let i = 0; i < legs.length; i++) {
          const v = evalLeg(legs[i], idx);
          if (v == null) { all = null; break; }
          marg[i] += w * v; all *= v;
        }
        if (all != null) joint += w * all;
        return;
      }
      for (let k = 0; k < vars[d].length; k++) { idx[d] = k; walk(d + 1, w * vars[d][k]); }
    })(0, 1);
    const indep = marg.reduce((a, b) => a * b, 1);
    if (!(indep > 1e-9) || !(joint >= 0)) return null;
    return { joint, indep };
  }

  const FAMILY_OF = { goals: "goals", first_half_goals: "goals", second_half_goals: "goals", btts: "goals", team_win: "goals", draw: "goals",
    corners: "corners", cards: "cards", points: "nfl_points", moneyline: "nfl_points" };

  // Returns { prob, approx } for a set of slip items.
  function slipJointProb(items) {
    const games = new Map();
    items.forEach(i => {
      const leg = parseLeg(i);
      const gk = [leg.sport, leg.home, leg.away, leg.date].join("|");
      if (!games.has(gk)) games.set(gk, []);
      games.get(gk).push(leg);
    });
    let prob = 1, approx = false;
    for (const legs of games.values()) {
      const fams = new Map();
      legs.forEach(l => {
        const f = FAMILY_OF[l.metric] || ("solo:" + l.metric + l.scope + l.direction + l.line);
        if (!fams.has(f)) fams.set(f, []);
        fams.get(f).push(l);
      });
      const preds = legs.length > 1 ? findPredictions(legs[0].sport, legs[0].home, legs[0].away, legs[0].date) : null;
      for (const [f, fl] of fams) {
        const product = fl.reduce((a, l) => a * l.p, 1);
        if (fl.length < 2) { prob *= product; continue; }
        const r = f.startsWith("solo:") || !preds ? null : familyRatio(f, fl, preds);
        if (!r) { prob *= product; approx = true; continue; }
        let adj = product * (r.joint / r.indep);
        const lo = Math.max(0, fl.reduce((a, l) => a + l.p, 0) - (fl.length - 1)), hi = Math.min(...fl.map(l => l.p));
        prob *= Math.min(hi, Math.max(lo, adj));
      }
    }
    return { prob, approx };
  }

  // ---------- Bankroll: virtual bets ----------
  // A pretend betting account. Pick a starting bankroll, record bets (stake
  // and the odds you'd have taken), then mark each Won / Lost / Void and
  // confirm what it returned. Everything is kept in this browser only
  // (localStorage), like the bet slip - use "Copy backup" before clearing
  // site data or switching phones.
  const BANK_STORE = "virtualBankroll";
  const BANK_SPORTS = ["Football", "NFL", "Horse racing", "Other"];
  const EW_TERMS = [["1/4", 4, 3], ["1/5", 5, 3], ["1/4", 4, 2], ["1/5", 5, 4], ["1/4", 4, 4], ["1/3", 3, 2]]; // label, denominator, places
  let bank = slipLoad(BANK_STORE, null);
  if (!bank || typeof bank !== "object" || !Array.isArray(bank.bets)) bank = null;
  let bankView = "all";                 // history filter: all / pending / settled
  let bankSettling = null;              // { id, outcome } while a result is being confirmed
  let bankDelArmed = null;
  let bankDraft = { sport: "Football", kind: "single", desc: "", stake: "", odds: "", ew: 1, when: "", fair: null, source: "" };
  let bankMsg = "";

  function bankSave() { slipSave(BANK_STORE, bank); }
  const gbp = n => (n < 0 ? "-" : "") + "£" + Math.abs(n).toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const gbpSigned = n => (n > 0 ? "+" : "") + gbp(n);

  // "5/2", "2.5", "evs" -> decimal odds, or null
  function parseOdds(text) {
    const t = String(text == null ? "" : text).trim().toLowerCase().replace(/\s+/g, "");
    if (!t) return null;
    if (t === "evs" || t === "evens" || t === "even") return 2;
    let m = t.match(/^(\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);
    if (m) { const d = Number(m[2]); return d > 0 ? 1 + Number(m[1]) / d : null; }
    m = t.match(/^\d+(?:\.\d+)?$/);
    if (m) { const v = Number(t); return v > 1 ? v : null; }
    return null;
  }
  const fmtOdds = d => d == null ? "-" : (Math.round(d * 100) / 100).toFixed(2);

  // Total money out: each way is two equal bets (win + place).
  const bankOutlay = b => b.stake * (b.kind === "ew" ? 2 : 1);

  // What a bet returns for an outcome, before any manual edit.
  function bankAutoReturn(b, outcome) {
    const s = b.stake, o = b.odds;
    if (outcome === "void") return bankOutlay(b);
    if (outcome === "lost") return 0;
    if (b.kind !== "ew") return outcome === "won" ? s * o : 0;
    const placePart = s * (1 + (o - 1) / (b.ewDen || 4));
    if (outcome === "won") return s * o + placePart;
    if (outcome === "placed") return placePart;
    return 0;
  }

  function bankStats() {
    const settled = bank.bets.filter(b => b.status !== "pending");
    const pending = bank.bets.filter(b => b.status === "pending");
    const outlayAll = bank.bets.reduce((a, b) => a + bankOutlay(b), 0);
    const returnsSettled = settled.reduce((a, b) => a + b.returns, 0);
    const cash = bank.start - outlayAll + returnsSettled;
    const inPlay = pending.reduce((a, b) => a + bankOutlay(b), 0);
    const group = (rows) => {
      const counted = rows.filter(b => b.status !== "void");      // void bets: stake back, not a result
      const staked = counted.reduce((a, b) => a + bankOutlay(b), 0);
      const ret = counted.reduce((a, b) => a + b.returns, 0);
      const wins = counted.filter(b => b.returns > bankOutlay(b) + 1e-9).length;
      return { n: counted.length, wins, staked, ret, pl: ret - staked, roi: staked > 0 ? (ret - staked) / staked : null };
    };
    return { cash, inPlay, total: cash + inPlay, settled, pending, all: group(settled),
      bySport: BANK_SPORTS.map(s => [s, group(settled.filter(b => b.sport === s))]).filter(([, g]) => g.n > 0),
      byKind: [["single", "Singles / win"], ["ew", "Each way"], ["builder", "Bet builders"]]
        .map(([k, n]) => [n, group(settled.filter(b => b.kind === k))]).filter(([, g]) => g.n > 0) };
  }

  function bankChart(st) {
    const rows = [...st.settled].sort((a, b) => (a.settledAt || "").localeCompare(b.settledAt || ""));
    if (rows.length < 2) return "";
    let run = bank.start;
    // running total of money out + returns up to each settled bet, counting stakes still pending as spent
    const pts = [bank.start];
    rows.forEach(b => { run += b.returns - bankOutlay(b); pts.push(run); });
    const W = 320, H = 110, pad = 6;
    const lo = Math.min(...pts, bank.start), hi = Math.max(...pts, bank.start);
    const span = hi - lo || 1;
    const x = i => pad + (W - 2 * pad) * (i / (pts.length - 1));
    const y = v => H - pad - (H - 2 * pad) * ((v - lo) / span);
    const line = pts.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    const col = pts[pts.length - 1] >= bank.start ? "var(--green)" : "var(--accent)";
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Bankroll after each settled bet" style="display:block;margin:6px 0">
      <line x1="${pad}" x2="${W - pad}" y1="${y(bank.start).toFixed(1)}" y2="${y(bank.start).toFixed(1)}" stroke="var(--meta)" stroke-dasharray="3 3" stroke-width="1"/>
      <polyline points="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="${x(pts.length - 1).toFixed(1)}" cy="${y(pts[pts.length - 1]).toFixed(1)}" r="3" fill="${col}"/>
    </svg>
    <div class="tr-chip-n">Money after each settled bet (dashed line = starting bankroll)</div>`;
  }

  function bankStatRow(label, g) {
    const cls = g.pl > 0 ? "pct-hi" : g.pl < 0 ? "pct-lo" : "";
    return `<tr><td>${label}</td><td>${g.n}</td><td>${g.wins} (${g.n ? Math.round(100 * g.wins / g.n) : 0}%)</td><td>${gbp(g.staked)}</td><td class="${cls}">${gbpSigned(g.pl)}</td><td class="${cls}">${g.roi == null ? "-" : (g.roi > 0 ? "+" : "") + (g.roi * 100).toFixed(1) + "%"}</td></tr>`;
  }

  function bankBetCard(b) {
    const kindLabel = b.kind === "ew" ? `Each way (${b.ewLabel || "1/4"}, ${b.ewPlaces || 3} places)` : b.kind === "builder" ? "Bet builder" : (b.sport === "Horse racing" ? "Win" : "Single");
    const when = new Date(b.placedAt).toLocaleDateString("en-GB", { day: "numeric", month: "short" }) + " " + new Date(b.placedAt).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
    const evTxt = b.eventAt ? (bankWhen(b) ? " &middot; starts " + bankWhen(b) : "") : "";
    const outlay = bankOutlay(b);
    const settled = b.status !== "pending";
    const pl = settled ? b.returns - outlay : 0;
    const chipText = { pending: "PENDING", won: "WON", lost: "LOST", void: "VOID", placed: "PLACED" }[b.status];
    const chipCls = b.status === "pending" ? "tr-pending" : (b.status === "won" || (b.status === "placed" && pl > 0)) ? "tr-hit" : b.status === "void" ? "tr-pending" : "tr-overdue";
    const stakeTxt = b.kind === "ew" ? `${gbp(b.stake)} e/w (${gbp(outlay)} total)` : gbp(b.stake);
    const edge = b.fair ? ` &middot; model fair ${fmtOdds(b.fair)}` : "";
    let action = "";
    if (!settled) {
      if (bankSettling && bankSettling.id === b.id) {
        const val = bankSettling.returns != null ? bankSettling.returns : Math.round(bankAutoReturn(b, bankSettling.outcome) * 100) / 100;
        action = `<div class="bank-settle">
          <div class="tr-chip-n">Result: <b>${bankSettling.outcome === "placed" ? "Placed only" : bankSettling.outcome.charAt(0).toUpperCase() + bankSettling.outcome.slice(1)}</b>. Total returned (stake included, change it for a cash-out or part payout):</div>
          <div class="slip-actions" style="margin:6px 0 0"><input class="slip-stake bank-ret" inputmode="decimal" value="${val}" style="width:100px" data-bank-ret>
            <button class="slip-btn primary" data-bank-confirm="${b.id}">Save result</button>
            <button class="slip-btn quiet" data-bank-cancel>Cancel</button></div></div>`;
      } else {
        action = `<label class="tr-chip-n" style="display:block;margin-top:8px">Start time (sets the order) <input type="time" class="slip-name" data-bank-when="${b.id}" value="${escAttr(bankWhen(b))}" style="width:100%"></label>
        <div class="slip-actions" style="margin:8px 0 0">
          <button class="slip-btn" data-bank-out="won" data-bank-id="${b.id}">Won</button>
          ${b.kind === "ew" ? `<button class="slip-btn" data-bank-out="placed" data-bank-id="${b.id}">Placed</button>` : ""}
          <button class="slip-btn" data-bank-out="lost" data-bank-id="${b.id}">Lost</button>
          <button class="slip-btn quiet" data-bank-out="void" data-bank-id="${b.id}">Void</button>
          <button class="slip-btn quiet" data-bank-del="${b.id}">${bankDelArmed === b.id ? "Tap again to delete" : "Delete"}</button></div>`;
      }
    } else {
      action = `<div class="slip-actions" style="margin:8px 0 0">
        <button class="slip-btn quiet" data-bank-reopen="${b.id}">Reopen</button>
        <button class="slip-btn quiet" data-bank-del="${b.id}">${bankDelArmed === b.id ? "Tap again to delete" : "Delete"}</button></div>`;
    }
    return `<div class="slip-summary bank-bet">
      <div class="slip-line"><b>${escAttr(b.desc) || "(no description)"}</b><span class="tr-badge ${chipCls}">${chipText}</span></div>
      <div class="tr-chip-n">${escAttr(b.sport)} &middot; ${kindLabel} &middot; ${when}${evTxt}</div>
      <div class="slip-line" style="margin-top:6px"><span>Stake ${stakeTxt} @ ${fmtOdds(b.odds)}${edge}</span>
        <span>${settled ? `<b class="${pl > 0 ? "pct-hi" : pl < 0 ? "pct-lo" : ""}">${gbpSigned(pl)}</b> <span class="tr-chip-n">(returned ${gbp(b.returns)})</span>` : `<span class="tr-chip-n">to return ${gbp(bankAutoReturn(b, "won"))}</span>`}</span></div>
      ${action}</div>`;
  }

  function bankFormHtml(st) {
    const d = bankDraft, racing = d.sport === "Horse racing";
    const kindOpts = [["single", racing ? "Win" : "Single"], ...(racing ? [["ew", "Each way"]] : []), ["builder", "Bet builder / multiple"]];
    if (!kindOpts.some(([k]) => k === d.kind)) d.kind = "single";
    const dec = parseOdds(d.odds), stake = Number(d.stake);
    const outlay = stake > 0 ? stake * (d.kind === "ew" ? 2 : 1) : 0;
    return `<div class="tr-section-title">Place a virtual bet</div>
      ${d.source ? `<div class="tr-note">Filled in from your ${escAttr(d.source)}. Add the odds you'd have taken and your stake.${d.fair ? ` The model's fair odds for it are <b>${fmtOdds(d.fair)}</b>; a price above that is value if the model is right.` : ""}</div>` : ""}
      <div class="bank-form">
        <label>Sport <select class="slip-name" data-bank-f="sport">${BANK_SPORTS.map(s => `<option${s === d.sport ? " selected" : ""}>${s}</option>`).join("")}</select></label>
        <label>Bet type <select class="slip-name" data-bank-f="kind">${kindOpts.map(([k, n]) => `<option value="${k}"${k === d.kind ? " selected" : ""}>${n}</option>`).join("")}</select></label>
        ${d.kind === "ew" ? `<label>Each way terms <select class="slip-name" data-bank-f="ew">${EW_TERMS.map((t, i) => `<option value="${i}"${i === Number(d.ew) ? " selected" : ""}>${t[0]} odds, ${t[2]} places</option>`).join("")}</select></label>` : ""}
        <label>Selection(s) <input class="slip-name" data-bank-f="desc" maxlength="160" placeholder="e.g. Nashville to win + Over 1.5 goals" value="${escAttr(d.desc)}"></label>
        <div class="bank-row">
          <label>${d.kind === "ew" ? "Stake per part (£)" : "Stake (£)"} <input class="slip-stake" data-bank-f="stake" inputmode="decimal" placeholder="10" value="${escAttr(d.stake)}" style="width:100%"></label>
          <label>Odds <input class="slip-odds" data-bank-f="odds" inputmode="decimal" placeholder="2.5" value="${escAttr(d.odds)}" style="width:100%"></label>
        </div>
        <label>Start time (optional, keeps pending bets in order) <input class="slip-name" type="time" data-bank-f="when" value="${escAttr(bankWhen({ eventAt: d.when }))}"></label>
        <div class="tr-chip-n" id="bank-hint">${bankHint(d)}</div>
        <div class="slip-actions"><button class="slip-btn primary" data-bank-place>Place bet</button><button class="slip-btn quiet" data-bank-clear>Clear</button></div>
        ${bankMsg ? `<div class="slip-note slip-warn">${bankMsg}</div>` : ""}
      </div>`;
  }

  function bankHint(d) {
    const dec = parseOdds(d.odds), stake = Number(d.stake);
    const parts = [];
    if (d.odds && dec == null) parts.push("Odds not recognised - use decimal (2.5) or fractional (5/2, evs).");
    else if (dec != null) parts.push(`Decimal odds ${fmtOdds(dec)}`);
    if (stake > 0) {
      const outlay = stake * (d.kind === "ew" ? 2 : 1);
      parts.push(`stake out ${gbp(outlay)}`);
      if (dec != null) {
        const t = EW_TERMS[Number(d.ew)] || EW_TERMS[0];
        const ret = d.kind === "ew" ? stake * dec + stake * (1 + (dec - 1) / t[1]) : stake * dec;
        parts.push(`${d.kind === "ew" ? "if it wins" : "returns"} ${gbp(ret)}`);
      }
    }
    return parts.join(" &middot; ");
  }

  function renderBankroll() {
    if (!bank) {
      mainEl.innerHTML = `<div class="bb-intro">A pretend betting account to test the picks without risking anything. Choose a starting bankroll, record bets with the stake and odds you'd have taken (win, each way or bet builder), then mark each one won or lost and what it returned. It tracks profit and loss overall and by sport.</div>
        <div class="slip-summary"><div class="slip-line"><span>Starting bankroll (£)</span><input class="slip-stake" id="bank-start" inputmode="decimal" value="1000" style="width:110px"></div>
        <div class="slip-actions"><button class="slip-btn primary" data-bank-start>Start</button></div>
        <div class="slip-note">Kept in this browser only. Use "Copy backup" on this page now and then, in case you clear site data or change phone.</div></div>`;
      bindBankroll();
      return;
    }
    const st = bankStats();
    const g = st.all;
    const plCls = g.pl > 0 ? "pct-hi" : g.pl < 0 ? "pct-lo" : "";
    const header = `<div class="tr-summary">
      <div class="tr-summary-main"><span class="tr-summary-pct ${st.total > bank.start ? "pct-hi" : st.total < bank.start ? "pct-lo" : ""}">${gbp(st.total)}</span>
        <span class="tr-summary-label">bankroll (started ${gbp(bank.start)})</span></div>
      <div class="tr-form">
        <span>Available <b>${gbp(st.cash)}</b></span>
        <span>In play <b>${gbp(st.inPlay)}</b> <span class="tr-chip-n">(${st.pending.length} bet${st.pending.length === 1 ? "" : "s"})</span></span>
        <span>Profit / loss <b class="${plCls}">${gbpSigned(g.pl)}</b></span>
        <span>ROI <b class="${plCls}">${g.roi == null ? "-" : (g.roi > 0 ? "+" : "") + (g.roi * 100).toFixed(1) + "%"}</b></span>
        <span>Winning bets <b>${g.wins}/${g.n}</b> <span class="tr-chip-n">(${g.n ? Math.round(100 * g.wins / g.n) : 0}%)</span></span>
      </div>
      ${bankChart(st)}</div>`;

    const statsTable = st.settled.length ? `<div class="tr-section-title">Results by sport</div>
      <table class="rc-score bank-table"><thead><tr><th></th><th>Bets</th><th>Won</th><th>Staked</th><th>P/L</th><th>ROI</th></tr></thead>
      <tbody>${bankStatRow("Overall", g)}${st.bySport.map(([s, x]) => bankStatRow(s, x)).join("")}</tbody></table>
      ${st.byKind.length > 1 ? `<div class="tr-section-title">By bet type</div><table class="rc-score bank-table"><thead><tr><th></th><th>Bets</th><th>Won</th><th>Staked</th><th>P/L</th><th>ROI</th></tr></thead><tbody>${st.byKind.map(([n, x]) => bankStatRow(n, x)).join("")}</tbody></table>` : ""}
      <div class="tr-note">A bet counts as <b>won</b> when it returns more than the money staked (so an each-way bet that only places and pays back less than its two stakes isn't a win). Void bets are given back and left out of the counts. ROI is profit divided by money staked.</div>` : "";

    const shown = bank.bets.filter(b => bankView === "all" || (bankView === "pending" ? b.status === "pending" : b.status !== "pending"))
      .sort(bankOrder);
    const toggle = `<div class="tr-sport-toggle">${[["all", "All"], ["pending", "Pending"], ["settled", "Settled"]]
      .map(([k, n]) => `<a data-bank-view="${k}" class="${bankView === k ? "tr-sport-active" : ""}">${n}</a>`).join("")}</div>`;
    const list = shown.length ? shown.map(bankBetCard).join("") : `<div class="empty">${bank.bets.length ? "No bets in this view." : "No bets yet. Add one above, or use the Place as virtual bet button on the Bet Slip tab."}</div>`;

    const tools = `<div class="tr-section-title">Backup and reset</div>
      <div class="slip-actions"><button class="slip-btn quiet" data-bank-copy>Copy backup</button><button class="slip-btn quiet" data-bank-restore-toggle>Restore from backup</button>
      <button class="slip-btn quiet" data-bank-reset>${bankDelArmed === "reset" ? "Tap again to reset everything" : "Reset bankroll"}</button></div>
      <div id="bank-restore-box" style="display:none"><textarea class="slip-name" id="bank-restore-text" rows="4" placeholder="Paste a backup here"></textarea>
