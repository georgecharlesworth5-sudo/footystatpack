    if (!link) return;
    link.addEventListener("click", (e) => {
      e.preventDefault();
      nflHideResults = link.dataset.nflResults === "hide";
      try { localStorage.setItem("nflHideResults", nflHideResults ? "1" : "0"); } catch (err) {}
      renderNfl();
    });
  }

  function renderNfl() {
    const fixtures = (typeof NFL_STATPACK_DATA !== "undefined") ? NFL_STATPACK_DATA.upcoming_fixtures : [];
    const recentResultsHtml = renderNflRecentResults();
    if (!fixtures || fixtures.length === 0) {
      mainEl.innerHTML = recentResultsHtml || `<div class="empty">No NFL fixtures loaded yet.</div>`;
      bindNflResultsToggle();
      return;
    }

    const sorted = sortByKickoff(fixtures);
    const groups = [];
    let currentDate = null, currentGroup = null;
    sorted.forEach(fx => {
      if (fx.date !== currentDate) {
        currentDate = fx.date;
        currentGroup = { date: fx.date, items: [] };
        groups.push(currentGroup);
      }
      currentGroup.items.push(fx);
    });

    const intro = `<div class="bb-intro">Points modelled as Normal-distributed (standard NFL power-rating approach); passing/rushing TDs modelled as Poisson (low, discrete counts, closer to football goals). Green "M" badge = real market odds blended in where available.</div>`;

    mainEl.innerHTML = intro + recentResultsHtml + groups.map(g => `
      <div class="date-group">
        <div class="date-label">${fmtDate(g.date)}</div>
        ${g.items.map(nflFixtureCard).join("")}
      </div>
    `).join("");
    bindNflResultsToggle();
  }

  // ---------- Today ----------
  const LATE_NIGHT_CUTOFF_HOUR = 6;

  // A fixture doesn't vanish the instant kickoff passes - a 3pm kickoff
  // is still very much "on" at 3:01pm, and most matches (football,
  // NFL) run 2-3.5 hours including stoppage/overtime. 4 hours gives a
  // comfortable margin past even a long game before it drops off,
  // while still being nowhere near long enough to let a game that
  // kicked off yesterday linger into today's list.
  const POST_KICKOFF_GRACE_HOURS = 4;

  function renderToday() {
    const now = new Date();
    const windowStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    const windowEnd = windowStart + (24 + LATE_NIGHT_CUTOFF_HOUR) * 3600000;

    // A fixture whose kickoff has already passed shouldn't show here
    // regardless of which day's window it falls in - a game that
    // kicked off Thursday evening US time (early Friday UK) is
    // correctly included on Thursday's page ahead of kickoff, but
    // once it's actually been played there's no reason for it to
    // linger into Friday's page too just because its own date field
    // says Friday. Checking against the CURRENT moment (not just the
    // date window) catches this - and also covers a backend-staleness
    // case: NFL's own data only refreshes once a day, so a game that
    // was still upcoming at that last refresh could have since kicked
    // off and finished by the time someone actually loads this page.
    const inWindow = fx => {
      const ts = fixtureTimestamp(fx);
      return ts >= windowStart && ts < windowEnd && ts >= now.getTime() - POST_KICKOFF_GRACE_HOURS * 3600000;
    };

    const items = [];

    if (data) {
      Object.entries(data).forEach(([code, league]) => {
        (league.upcoming_fixtures || []).forEach(fx => {
          if (inWindow(fx)) items.push({ ...fx, _badge: league.league_name, _kind: "football" });
        });
      });
    }

    const cupFixtures = (typeof STATPACK_DATA !== "undefined" && STATPACK_DATA.efl_cup)
      ? STATPACK_DATA.efl_cup.fixtures : [];
    cupFixtures.forEach(fx => {
      if (inWindow(fx)) items.push({ ...fx, _badge: "EFL Cup", _kind: "football" });
    });

    if (typeof NFL_STATPACK_DATA !== "undefined" && NFL_STATPACK_DATA.upcoming_fixtures) {
      NFL_STATPACK_DATA.upcoming_fixtures.forEach(fx => {
        if (inWindow(fx)) items.push({ ...fx, _badge: "NFL", _kind: "nfl" });
      });
    }

    if (items.length === 0) {
      mainEl.innerHTML = `<div class="empty">No games today across any league or sport.</div>`;
      return;
    }

    const sorted = sortByKickoff(items);
    const intro = `<div class="bb-intro">Every game today, across every league and sport - ${sorted.length} fixture${sorted.length === 1 ? "" : "s"}, in kickoff order. Late kickoffs after midnight are included as "tonight".</div>`;
    mainEl.innerHTML = intro + sorted.map(fx =>
      fx._kind === "nfl" ? nflFixtureCard(fx, fx._badge) : fixtureCard(fx, fx._badge)
    ).join("");
  }

  function renderEflCup() {
    const cupFixtures = (typeof STATPACK_DATA !== "undefined" && STATPACK_DATA.efl_cup)
      ? STATPACK_DATA.efl_cup.fixtures : [];

    if (cupFixtures.length === 0) {
      mainEl.innerHTML = `<div class="empty">No EFL Cup fixtures loaded.<br>Add them to cup_fixtures_manual/efl_cup.txt.</div>`;
      return;
    }

    const intro = `<div class="bb-intro">Fixtures crossing divisions ("cross-division") use each team's own
      league form with a rough cross-league adjustment (see cross_league.py) - treat these with more caution
      than same-league predictions.</div>`;

    const groups = [];
    let currentDate = null, currentGroup = null;
    sortByKickoff(cupFixtures).forEach(fx => {
      if (fx.date !== currentDate) {
        currentDate = fx.date;
        currentGroup = { date: fx.date, items: [] };
        groups.push(currentGroup);
      }
      currentGroup.items.push(fx);
    });

    mainEl.innerHTML = intro + groups.map(g => `
      <div class="date-group">
        <div class="date-label">${fmtDate(g.date)}</div>
        ${g.items.map(cupFixtureCard).join("")}
      </div>
    `).join("");
  }

  let lastRenderedView = null;

  function render() {
    buildTabs();

    // Because the tab bar is pinned, switching page while scrolled far down
    // would leave you part-way down the new page. When the page changes,
    // jump back so the new page starts just under the tab bar (the header
    // above it is left out of view). In-page toggles don't change the
    // view, so they never move the scroll position.
    if (lastRenderedView !== null && lastRenderedView !== activeLeague) {
      const top = document.querySelector("header").offsetHeight;   // where the tab bar sits unstuck
      if (window.scrollY > top) window.scrollTo(0, top);
    }
    lastRenderedView = activeLeague;

    // Keep the active tab visible in the (horizontally scrolling) tab bar.
    const activeTab = tabsEl.querySelector(".tab.active");
    if (activeTab) {
      const left = activeTab.offsetLeft, right = left + activeTab.offsetWidth;
      if (left < tabsEl.scrollLeft || right > tabsEl.scrollLeft + tabsEl.clientWidth) {
        tabsEl.scrollLeft = Math.max(0, left - 20);
      }
    }

    if (activeLeague === BEST_BETS) {
      renderBestBets();
      return;
    }
    if (activeLeague === TRACK_RECORD) {
      renderTrackRecord();
      return;
    }
    if (activeLeague === MODEL_CHECK) {
      renderModelCheck();
      return;
    }
    if (activeLeague === SLIP) {
      renderSlip();
      return;
    }
    if (activeLeague === BANKROLL) {
      renderBankroll();
      return;
    }
    if (activeLeague === RACING) {
      renderRacing();
      return;
    }
    if (activeLeague === EFL_CUP) {
      renderEflCup();
      return;
    }
    if (activeLeague === CASH_BUILDER) {
      renderCashBuilder();
      return;
    }
    if (activeLeague === NFL) {
      renderNfl();
      return;
    }
    if (activeLeague === TODAY) {
      renderToday();
      return;
    }

    const league = data[activeLeague];
    const allFixtures = league.upcoming_fixtures;
    const freshnessChip = leagueFreshnessChip(activeLeague);

    if (allFixtures.length === 0) {
      mainEl.innerHTML = freshnessChip + `<div class="empty">No upcoming fixtures loaded for ${league.league_name}.<br>Check fixtures_manual/ has the right CSV for this league.</div>`;
      return;
    }

    const now = new Date();
    const windowEnd = new Date(now);
    windowEnd.setDate(now.getDate() + NEAR_TERM_WINDOW_DAYS);

    const nearTerm = allFixtures.filter(fx => {
      const d = parseFixtureDate(fx.date);
      return !d || d <= windowEnd;
    });
    const fixtures = showFullSeason ? allFixtures : nearTerm;
    const hiddenCount = allFixtures.length - nearTerm.length;

    const toggle = hiddenCount > 0
      ? (showFullSeason
          ? `<div class="window-toggle">Showing full season (${allFixtures.length} fixtures) · <a href="#" id="toggle-window">Show next ${NEAR_TERM_WINDOW_DAYS} days only</a></div>`
          : `<div class="window-toggle">Showing next ${NEAR_TERM_WINDOW_DAYS} days · <a href="#" id="toggle-window">Show full season (${hiddenCount} more)</a></div>`)
      : "";

    if (fixtures.length === 0) {
      mainEl.innerHTML = freshnessChip + toggle + `<div class="empty">No fixtures in the next ${NEAR_TERM_WINDOW_DAYS} days for ${league.league_name}.<br>Try "Show full season" above.</div>`;
      attachToggleHandler();
      return;
    }

    const groups = [];
    let currentDate = null, currentGroup = null;
    sortByKickoff(fixtures).forEach(fx => {
      if (fx.date !== currentDate) {
        currentDate = fx.date;
        currentGroup = { date: fx.date, items: [] };
        groups.push(currentGroup);
      }
      currentGroup.items.push(fx);
    });

    mainEl.innerHTML = freshnessChip + toggle + groups.map(g => `
      <div class="date-group">
        <div class="date-label">${fmtDate(g.date)}</div>
        ${g.items.map(fx => fixtureCard(fx, undefined, league.league_name)).join("")}
      </div>
    `).join("");
    attachToggleHandler();
  }

  function attachToggleHandler() {
    const link = document.getElementById("toggle-window");
    if (link) {
      link.addEventListener("click", (e) => {
        e.preventDefault();
        showFullSeason = !showFullSeason;
        render();
      });
    }
  }

  // Was a single strip across every league in the header - moved to
  // per-league instead (shown inline on that league's own view) since
  // showing every league's freshness at once regardless of which one
  // you're actually looking at was taking up a lot of header space for
  // information only relevant one league at a time.
  function leagueFreshnessChip(code) {
    const freshness = (typeof STATPACK_DATA !== "undefined") ? STATPACK_DATA.data_freshness : null;
    const f = freshness && freshness[code];
    if (!f) return "";
    if (f.days_old === null) {
      return `<div class="freshness-strip"><span class="freshness-chip freshness-stale"><span class="dot-status"></span>${f.league_name}: no current-season data yet</span></div>`;
    }
    const status = f.days_old <= 3 ? "fresh" : f.days_old <= 7 ? "lagging" : "stale";
    const label = f.days_old === 0 ? "today" : f.days_old === 1 ? "1 day ago" : `${f.days_old} days ago`;
    return `<div class="freshness-strip"><span class="freshness-chip freshness-${status}"><span class="dot-status"></span>${f.league_name}: ${label}</span></div>`;
  }

  document.addEventListener("click", () => {
    if (footballMenuOpen) {
      footballMenuOpen = false;
      buildTabs();
    }
  });

  render();
})();
</script>
</body>
</html>
