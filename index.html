<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match Day Terminal — Stat Pack</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  :root {
    --bg: #0B0F14;
    --panel: #12181F;
    --panel-alt: #0E1319;
    --border: #232B33;
    --border-soft: #1C232B;
    --amber: #F2A93B;
    --amber-dim: #C9862A;
    --green: #4CAF7D;
    --red: #E5484D;
    --text: #F5F7FA;
    --muted: #8A96A3;
    --muted-dim: #6E7A87;
    --faint: #4A5561;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
  }
  .disp { font-family: 'Oswald', 'Arial Narrow', sans-serif; }
  a { color: var(--amber); text-decoration: none; }
  a:hover { color: #FFC469; }
  ::selection { background: var(--amber); color: var(--bg); }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 32px 20px 32px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 12px;
  }
  .wordmark { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .wordmark h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--text);
  }
  .wordmark .sub { font-size: 12px; color: var(--muted-dim); letter-spacing: 1px; }
  .header-right { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .clock { font-size: 12px; color: var(--muted); }
  .freshness {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; border-radius: 3px; font-size: 11px; letter-spacing: 0.5px;
  }
  .freshness.ok { border: 1px solid #2E6B4A; background: #10201A; color: #7FCBA0; }
  .freshness.stale { border: 1px solid #7A4A1E; background: #241708; color: var(--amber); }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.ok { background: var(--green); }
  .dot.stale { background: var(--amber); }

  /* League tabs */
  .tabs {
    display: flex; gap: 2px; padding: 16px 32px 0 32px; flex-wrap: wrap;
  }
  .tab {
    padding: 10px 18px;
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    background: #151B22;
    color: var(--muted);
    cursor: pointer;
    border: none;
  }
  .tab.active { background: var(--amber); color: var(--bg); }

  /* Fixture filter row */
  .toolbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 32px 0 32px; gap: 12px; flex-wrap: wrap;
  }
  .toolbar .count { font-size: 12px; color: var(--muted-dim); }
  select, input[type="text"] {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 7px 10px;
  }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
    padding: 20px 32px 8px 32px;
  }
  @media (max-width: 980px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }

  .tile { background: var(--panel); border: 1px solid var(--border); }
  .tile-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 14px; border-bottom: 1px solid var(--border);
    gap: 8px;
  }
  .tile-head .matchup {
    font-family: 'Oswald', sans-serif; font-size: 15px; font-weight: 700; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tile-head .kickoff { font-size: 10px; color: var(--muted-dim); text-align: right; white-space: nowrap; }
  .tile-head .positions { font-size: 10px; color: var(--faint); margin-top: 2px; }
  .tile-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .metric-label { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); margin-bottom: 4px; letter-spacing: 0.3px; }
  .metric-label span.pct { font-weight: 600; }
  .bar { display: flex; height: 7px; width: 100%; background: var(--border-soft); }
  .bar .fill { height: 7px; }
  .fill.goals { background: var(--green); }
  .fill.corners { background: var(--amber); }
  .fill.cards { background: var(--red); }
  .fill.rest { background: var(--border); }

  .legend { display: flex; gap: 22px; padding: 6px 32px 18px 32px; flex-wrap: wrap; }
  .legend .item { display: flex; align-items: center; gap: 7px; font-size: 10.5px; color: var(--muted); }
  .legend .swatch { width: 9px; height: 9px; }

  .empty {
    padding: 60px 32px; text-align: center; color: var(--muted-dim); font-size: 13px;
  }

  footer {
    margin-top: 24px;
    border-top: 1px solid var(--border);
    background: var(--panel-alt);
    padding: 12px 32px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; color: var(--muted-dim);
    flex-wrap: wrap; gap: 8px;
  }
  footer .v { color: var(--faint); }
</style>
</head>
<body>

<header>
  <div class="wordmark">
    <h1>MATCH DAY TERMINAL</h1>
    <div class="sub">GOALS / CORNERS / CARDS</div>
  </div>
  <div class="header-right">
    <div class="clock" id="clock"></div>
    <div class="freshness" id="freshness"></div>
  </div>
</header>

<div class="tabs" id="tabs"></div>

<div class="toolbar">
  <div class="count" id="fixtureCount"></div>
  <select id="sortSelect">
    <option value="date">SORT: KICKOFF DATE</option>
    <option value="goals">SORT: GOALS O/U %</option>
    <option value="corners">SORT: CORNERS O/U %</option>
    <option value="cards">SORT: CARDS O/U %</option>
  </select>
</div>

<div class="legend">
  <div class="item"><div class="swatch" style="background:#4CAF7D;"></div>GOALS MARKET</div>
  <div class="item"><div class="swatch" style="background:#F2A93B;"></div>CORNERS MARKET</div>
  <div class="item"><div class="swatch" style="background:#E5484D;"></div>CARDS MARKET</div>
  <div class="item"><div class="swatch" style="background:#232B33;"></div>UNDER / REMAINDER</div>
</div>

<div class="grid" id="grid"></div>
<div class="empty" id="emptyMsg" style="display:none;">NO FIXTURES LOADED FOR THIS LEAGUE</div>

<footer>
  <div id="footerNote">FIXTURES LOADED MANUALLY · RESULTS + PREDICTIONS AUTO-UPDATED VIA GITHUB ACTIONS</div>
  <div class="v">MATCH DAY TERMINAL · v3</div>
</footer>

<!-- Your existing data pipeline output. Must define a global object, referenced below as `statpackData`. -->
<script src="./statpack_data.js"></script>
<script>
(function () {
  // ---- CONFIG ---------------------------------------------------------
  // If your statpack_data.js exposes the data under a different global
  // name, change this one line only.
  var DATA = (typeof statpackData !== 'undefined') ? statpackData : (window.statpackData || null);

  var TARGET_LINES = { goals: 2.5, corners: 9.5, cards: 4.5 };

  var els = {
    tabs: document.getElementById('tabs'),
    grid: document.getElementById('grid'),
    empty: document.getElementById('emptyMsg'),
    freshness: document.getElementById('freshness'),
    clock: document.getElementById('clock'),
    fixtureCount: document.getElementById('fixtureCount'),
    sortSelect: document.getElementById('sortSelect'),
    footerNote: document.getElementById('footerNote')
  };

  var state = { league: null, sort: 'date' };

  // ---- Helpers ----------------------------------------------------------

  // Fixture dates are "DD/MM/YYYY"; kickoff times are "HH:MM"
  function parseFixtureDate(dateStr, timeStr) {
    if (!dateStr) return null;
    var parts = dateStr.split('/');
    if (parts.length !== 3) return null;
    var d = parseInt(parts[0], 10), m = parseInt(parts[1], 10) - 1, y = parseInt(parts[2], 10);
    var hh = 0, mm = 0;
    if (timeStr) {
      var tparts = timeStr.split(':');
      hh = parseInt(tparts[0], 10) || 0;
      mm = parseInt(tparts[1], 10) || 0;
    }
    return new Date(y, m, d, hh, mm);
  }

  function formatKickoff(dateStr, timeStr) {
    var d = parseFixtureDate(dateStr, timeStr);
    if (!d) return dateStr || '';
    var months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    return d.getDate() + ' ' + months[d.getMonth()] + ' \u2014 ' + (timeStr || '');
  }

  // Pick the over_under entry whose line is closest to target
  function pickLine(entries, target) {
    if (!entries || !entries.length) return null;
    var best = entries[0], bestDiff = Math.abs(entries[0].line - target);
    for (var i = 1; i < entries.length; i++) {
      var diff = Math.abs(entries[i].line - target);
      if (diff < bestDiff) { best = entries[i]; bestDiff = diff; }
    }
    return best;
  }

  function pct(n) { return Math.round(n * 100); }

  // ---- Freshness: compare earliest upcoming fixture to "now" -----------
  function computeFreshness(allLeaguesData) {
    var now = new Date();
    var earliest = null;
    Object.keys(allLeaguesData).forEach(function (code) {
      var fixtures = (allLeaguesData[code].upcoming_fixtures || []);
      fixtures.forEach(function (f) {
        var d = parseFixtureDate(f.date, f.time);
        if (d && (!earliest || d < earliest)) earliest = d;
      });
    });
    if (!earliest) return { ok: true, label: 'NO FIXTURES FOUND' };
    if (earliest < now) {
      return { ok: false, label: 'FIXTURES MAY BE OUT OF DATE' };
    }
    return { ok: true, label: 'DATA CURRENT' };
  }

  function renderFreshness() {
    if (!DATA) {
      els.freshness.className = 'freshness stale';
      els.freshness.innerHTML = '<div class="dot stale"></div><div>NO DATA LOADED</div>';
      return;
    }
    var fresh = computeFreshness(DATA);
    els.freshness.className = 'freshness ' + (fresh.ok ? 'ok' : 'stale');
    els.freshness.innerHTML = '<div class="dot ' + (fresh.ok ? 'ok' : 'stale') + '"></div><div>' + fresh.label + '</div>';
  }

  function renderClock() {
    var now = new Date();
    var days = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
    var months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    var hh = ('0' + now.getHours()).slice(-2);
    var mm = ('0' + now.getMinutes()).slice(-2);
    els.clock.textContent = days[now.getDay()] + ' ' + now.getDate() + ' ' + months[now.getMonth()] + ' \u2014 ' + hh + ':' + mm;
  }

  // ---- Tabs --------------------------------------------------------------
  function renderTabs() {
    els.tabs.innerHTML = '';
    if (!DATA) return;
    var codes = Object.keys(DATA);
    if (!state.league || codes.indexOf(state.league) === -1) state.league = codes[0];
    codes.forEach(function (code) {
      var btn = document.createElement('button');
      btn.className = 'tab disp' + (code === state.league ? ' active' : '');
      btn.textContent = (DATA[code].league_name || code).toUpperCase();
      btn.addEventListener('click', function () {
        state.league = code;
        renderTabs();
        renderGrid();
      });
      els.tabs.appendChild(btn);
    });
  }

  // ---- Fixture tile --------------------------------------------------------
  function buildTile(fixture) {
    var preds = fixture.predictions || {};
    var goalsLine = pickLine((preds.goals || {}).over_under, TARGET_LINES.goals);
    var cornersLine = pickLine((preds.corners || {}).over_under, TARGET_LINES.corners);
    var cardsLine = pickLine((preds.cards || {}).over_under, TARGET_LINES.cards);

    var tile = document.createElement('div');
    tile.className = 'tile';

    var head = document.createElement('div');
    head.className = 'tile-head';
    var matchupWrap = document.createElement('div');
    var matchup = document.createElement('div');
    matchup.className = 'matchup disp';
    matchup.textContent = fixture.home_team + ' v ' + fixture.away_team;
    var positions = document.createElement('div');
    positions.className = 'positions';
    if (fixture.home_position && fixture.away_position) {
      positions.textContent = (fixture.home_position) + (ordinalSuffix(fixture.home_position)) + ' v ' + (fixture.away_position) + ordinalSuffix(fixture.away_position);
    }
    matchupWrap.appendChild(matchup);
    matchupWrap.appendChild(positions);

    var kickoff = document.createElement('div');
    kickoff.className = 'kickoff';
    kickoff.textContent = formatKickoff(fixture.date, fixture.time);

    head.appendChild(matchupWrap);
    head.appendChild(kickoff);
    tile.appendChild(head);

    var body = document.createElement('div');
    body.className = 'tile-body';
    body.appendChild(buildMetricRow('GOALS', goalsLine, 'goals'));
    body.appendChild(buildMetricRow('CORNERS', cornersLine, 'corners'));
    body.appendChild(buildMetricRow('CARDS', cardsLine, 'cards'));
    tile.appendChild(body);

    return tile;
  }

  function ordinalSuffix(n) {
    var s = ['TH','ST','ND','RD'], v = n % 100;
    return s[(v - 20) % 10] || s[v] || s[0];
  }

  function buildMetricRow(label, lineEntry, cls) {
    var wrap = document.createElement('div');
    if (!lineEntry) {
      var lbl = document.createElement('div');
      lbl.className = 'metric-label';
      lbl.innerHTML = '<span>' + label + '</span><span class="pct">\u2014</span>';
      wrap.appendChild(lbl);
      var bar = document.createElement('div');
      bar.className = 'bar';
      wrap.appendChild(bar);
      return wrap;
    }
    var overPct = pct(lineEntry.over);
    var underPct = 100 - overPct;
    var lbl = document.createElement('div');
    lbl.className = 'metric-label';
    lbl.innerHTML = '<span>OVER ' + lineEntry.line + ' ' + label + '</span><span class="pct">' + overPct + '%</span>';
    wrap.appendChild(lbl);
    var bar = document.createElement('div');
    bar.className = 'bar';
    var fill = document.createElement('div');
    fill.className = 'fill ' + cls;
    fill.style.width = overPct + '%';
    var rest = document.createElement('div');
    rest.className = 'fill rest';
    rest.style.width = underPct + '%';
    bar.appendChild(fill);
    bar.appendChild(rest);
    wrap.appendChild(bar);
    return wrap;
  }

  // ---- Sorting -------------------------------------------------------------
  function sortFixtures(fixtures) {
    var copy = fixtures.slice();
    if (state.sort === 'date') {
      copy.sort(function (a, b) {
        var da = parseFixtureDate(a.date, a.time), db = parseFixtureDate(b.date, b.time);
        if (!da || !db) return 0;
        return da - db;
      });
    } else {
      var target = TARGET_LINES[state.sort];
      copy.sort(function (a, b) {
        var la = pickLine(((a.predictions || {})[state.sort] || {}).over_under, target);
        var lb = pickLine(((b.predictions || {})[state.sort] || {}).over_under, target);
        var oa = la ? la.over : -1, ob = lb ? lb.over : -1;
        return ob - oa;
      });
    }
    return copy;
  }

  // ---- Main grid render ----------------------------------------------------
  function renderGrid() {
    els.grid.innerHTML = '';
    if (!DATA || !state.league) {
      els.empty.style.display = 'block';
      els.fixtureCount.textContent = '';
      return;
    }
    var leagueData = DATA[state.league] || {};
    var fixtures = leagueData.upcoming_fixtures || [];
    els.fixtureCount.textContent = fixtures.length + ' FIXTURE' + (fixtures.length === 1 ? '' : 'S') + ' LOADED';

    if (!fixtures.length) {
      els.empty.style.display = 'block';
      return;
    }
    els.empty.style.display = 'none';

    var sorted = sortFixtures(fixtures);
    sorted.forEach(function (fixture) {
      els.grid.appendChild(buildTile(fixture));
    });
  }

  // ---- Init -----------------------------------------------------------------
  function init() {
    renderClock();
    setInterval(renderClock, 30000);
    renderFreshness();
    renderTabs();
    renderGrid();

    els.sortSelect.addEventListener('change', function (e) {
      state.sort = e.target.value;
      renderGrid();
    });

    if (!DATA) {
      els.footerNote.textContent = 'STATPACK_DATA.JS NOT FOUND OR DID NOT EXPOSE "statpackData" \u2014 CHECK THE SCRIPT TAG AND VARIABLE NAME';
    }
  }

  init();
})();
</script>
</body>
</html>
