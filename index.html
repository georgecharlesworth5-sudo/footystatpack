<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Footy Stat Pack</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF7F0;
    --surface: #FDFBF5;
    --surface-hover: #F3EDDC;
    --ink: #1A1A1A;
    --ink-dim: #4A4536;
    --accent: #8B1E1E;
    --green: #2F5233;
    --red: #8B1E1E;
    --meta: #8A8574;
    --rule: #DCD5C2;
    --data: 'Source Serif 4', Georgia, serif;
    --display: 'Playfair Display', Georgia, serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--data);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ---------- Ticker ---------- */
  /* ---------- Header ---------- */
  header {
    padding: 28px 20px 16px;
    max-width: 920px;
    margin: 0 auto;
  }
  .eyebrow {
    font-family: var(--data);
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--meta);
    margin-bottom: 6px;
  }
  h1 {
    font-family: var(--display);
    font-weight: 900;
    font-size: clamp(36px, 7vw, 56px);
    margin: 0;
    letter-spacing: -0.01em;
    text-align: center;
  }
  .freshness-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }
  .freshness-chip {
    font-family: var(--data);
    font-size: 11px;
    border-radius: 0;
    padding: 5px 9px;
    border: 1px solid var(--rule);
    color: var(--ink-dim);
    white-space: nowrap;
  }
  .freshness-chip .dot-status {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .freshness-fresh .dot-status { background: var(--green); }
  .freshness-lagging .dot-status { background: var(--accent); }
  .freshness-stale .dot-status { background: var(--red); }
  .freshness-fresh { border-color: rgba(107,155,110,0.4); }
  .freshness-lagging { border-color: rgba(232,163,61,0.4); }
  .freshness-stale { border-color: rgba(181,83,62,0.4); }

  /* ---------- League tabs ---------- */
  .tabs {
    display: flex;
    gap: 2px;
    max-width: 920px;
    margin: 0 auto;
    padding: 0 20px;
    border-bottom: 1px solid var(--rule);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab, .tab-wrap {
    flex-shrink: 0;
  }
  .tab {
    font-family: var(--data);
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--meta);
    background: none;
    border: none;
    padding: 12px 14px;
    cursor: pointer;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    transition: color 0.15s;
  }
  .tab:hover { color: var(--ink-dim); }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .tab:focus-visible, .fixture summary:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .tab .count {
    color: var(--meta);
    font-size: 10px;
    margin-left: 4px;
  }
  .tab-wrap {
    position: relative;
    display: inline-block;
  }
  .chev-dd {
    font-size: 9px;
    margin-left: 2px;
    display: inline-block;
  }
  .football-dropdown {
    /* position is set inline (fixed, with computed top/left) rather than
       here - see buildTabs(). It used to be position:absolute inside
       .tab-wrap, but .tabs now scrolls horizontally (overflow-x:auto),
       which per spec makes the browser clip vertical overflow too,
       cutting the dropdown off. Fixed positioning off the button's own
       on-screen rect sidesteps that clipping entirely. */
    z-index: 20;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 0;
    padding: 6px;
    min-width: 220px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .dropdown-item {
    display: block;
    width: 100%;
    text-align: left;
    font-family: var(--data);
    font-size: 13px;
    color: var(--ink-dim);
    background: none;
    border: none;
    padding: 9px 10px;
    cursor: pointer;
    border-radius: 0;
    white-space: nowrap;
  }
  .dropdown-item:hover {
    background: var(--surface-hover);
    color: var(--ink);
  }
  .dropdown-item.active {
    color: var(--accent);
  }
  .dropdown-item .count {
    color: var(--meta);
    font-size: 10px;
    margin-left: 4px;
  }
  .dropdown-divider {
    height: 1px;
    background: var(--rule);
    margin: 4px 2px;
  }

  .fixture-badge {
    font-family: var(--data);
    font-size: 10px;
    color: var(--meta);
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  /* ---------- Best Bets ---------- */
  .bb-intro {
    font-size: 12px;
    color: var(--meta);
    padding: 14px 4px 4px;
  }
  .window-toggle {
    font-family: var(--data);
    font-size: 12px;
    color: var(--meta);
    padding: 14px 4px 8px;
  }
  .window-toggle a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px dotted var(--accent);
  }
  .sort-toggle-active {
    color: var(--accent);
    font-weight: 600;
  }
  .window-toggle a.sort-toggle-link {
    color: var(--meta);
    text-decoration: none;
    border-bottom: 1px dotted var(--meta);
    cursor: pointer;
  }
  .sort-toggle-link:hover { color: var(--ink-dim); }
  .window-toggle a:hover { opacity: 0.8; }
  .bb-filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    padding: 10px 4px 4px;
    border-top: 1px solid var(--rule);
    margin-top: 8px;
  }
  .bb-filter-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: var(--data);
    font-size: 11px;
    color: var(--ink-dim);
    cursor: pointer;
    white-space: nowrap;
  }
  .bb-filter-item input[type="checkbox"] {
    accent-color: var(--accent);
    cursor: pointer;
  }
  .bb-category {
    margin: 18px 0 8px;
  }
  .bb-category-title {
    font-family: var(--data);
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--accent);
    padding: 8px 4px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 6px;
  }
  .bb-split {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
  }
  .bb-column-title {
    font-family: var(--data);
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--ink-dim);
    padding: 2px 4px 6px;
  }
  .bb-empty {
    font-family: var(--data);
    font-size: 11px;
    color: var(--meta);
    padding: 8px 4px;
  }
  .bb-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 0;
    padding: 10px 14px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .bb-rank {
    font-family: var(--data);
    font-size: 12px;
    color: var(--meta);
    width: 16px;
  }
  .bb-teams {
    font-family: var(--data);
    font-weight: 600;
    font-size: 13px;
    flex: 1;
    min-width: 160px;
  }
  .bb-teams .v { color: var(--meta); font-weight: 400; margin: 0 5px; }
  .bb-league {
    font-family: var(--data);
    font-size: 10px;
    color: var(--meta);
    letter-spacing: 0.04em;
  }
  .bb-label {
    font-family: var(--data);
    font-size: 12px;
    color: var(--ink-dim);
    min-width: 90px;
  }
  .bb-pct {
    font-family: var(--data);
    font-weight: 700;
    font-size: 14px;
    min-width: 44px;
    text-align: right;
  }

  /* ---------- Track Record ---------- */
  .tr-summary {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 0;
    padding: 18px;
    margin: 14px 0 20px;
  }
  .tr-summary-main {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 16px;
  }
  .tr-summary-pct {
    font-family: var(--data);
    font-weight: 700;
    font-size: 32px;
  }
  .tr-summary-label {
    font-family: var(--data);
    font-size: 12px;
    color: var(--ink-dim);
  }
  .tr-category-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 8px;
  }
  .tr-category-chip {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: 0;
    padding: 8px 10px;
    font-family: var(--data);
    font-size: 11px;
    color: var(--ink-dim);
  }
  .tr-chip-n { color: var(--meta); font-size: 10px; }
  .tr-badge {
    font-family: var(--data);
    font-size: 10px;
    letter-spacing: 0.05em;
    border-radius: 0;
    padding: 3px 8px;
    white-space: nowrap;
  }
  .tr-hit { color: var(--green); border: 1px solid var(--green); }
  .tr-miss { color: var(--red); border: 1px solid var(--red); }
  .tr-pending { color: var(--meta); border: 1px solid var(--meta); }

  /* ---------- Fixture list ---------- */
  main {
    max-width: 920px;
    margin: 0 auto;
    padding: 20px;
  }
  .date-group {
    margin-bottom: 6px;
  }
  .date-label {
    font-family: var(--data);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--meta);
    padding: 18px 4px 8px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 8px;
  }
  .fixture {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 0;
    margin-bottom: 8px;
    transition: background 0.15s;
  }
  .fixture:hover { background: var(--surface-hover); }
  .fixture summary {
    list-style: none;
    cursor: pointer;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .fixture summary::-webkit-details-marker { display: none; }
  .kickoff {
    font-family: var(--data);
    font-size: 12px;
    color: var(--meta);
    min-width: 44px;
  }
  .teams {
    font-family: var(--data);
    font-size: 14px;
    font-weight: 600;
    flex: 1;
    min-width: 180px;
  }
  .teams .v { color: var(--meta); font-weight: 400; margin: 0 6px; }
  .pos-badge {
    font-family: var(--data);
    font-size: 10px;
    font-weight: 400;
    color: var(--meta);
    margin-left: 4px;
    white-space: nowrap;
  }
  .quick-stats {
    display: flex;
    gap: 16px;
    font-family: var(--data);
    font-size: 11px;
  }
  .quick-stat { color: var(--ink-dim); white-space: nowrap; }
  .quick-stat b { color: var(--ink); }
  .pct-hi { color: var(--green); }
  .pct-lo { color: var(--red); }
  .flag {
    font-size: 10px;
    font-family: var(--data);
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 0;
    padding: 2px 6px;
    letter-spacing: 0.05em;
  }
  .flag-market {
    font-size: 10px;
    font-weight: 700;
    font-family: var(--data);
    color: var(--green);
    border: 1px solid var(--green);
    border-radius: 0;
    padding: 2px 5px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .chev {
    color: var(--meta);
    font-family: var(--data);
    transition: transform 0.15s;
  }
  .fixture[open] .chev { transform: rotate(90deg); }

  /* ---------- Expanded detail ---------- */
  .detail {
    padding: 4px 16px 18px;
    border-top: 1px solid var(--rule);
  }
  .note {
    font-size: 12px;
    color: var(--accent);
    background: rgba(232,163,61,0.08);
    border: 1px solid rgba(232,163,61,0.25);
    border-radius: 0;
    padding: 8px 10px;
    margin: 12px 0;
    line-height: 1.5;
  }
  .cup-leagues {
    font-family: var(--data);
    font-size: 11px;
    color: var(--meta);
    letter-spacing: 0.04em;
    margin-top: 4px;
  }
  .metric-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-top: 14px;
  }
  .mr-block {
    margin-top: 14px;
  }
  .mr-row {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }
  .mr-option {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: 0;
    padding: 12px 10px;
    text-align: center;
  }
  .mr-option.mr-favourite {
    border-color: var(--green);
  }
  .mr-label {
    font-family: var(--data);
    font-size: 11px;
    color: var(--ink-dim);
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mr-pct {
    font-family: var(--data);
    font-weight: 700;
    font-size: 18px;
  }
  .metric-card {
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: 0;
    padding: 12px 14px;
  }
  .metric-title {
    font-family: var(--data);
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--meta);
    margin-bottom: 8px;
  }
  .metric-expected {
    font-family: var(--data);
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .metric-expected .label { font-size: 10px; color: var(--meta); font-weight: 400; margin-left: 4px; }
  .ou-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--data);
    font-size: 12px;
    padding: 4px 0;
    border-top: 1px solid var(--rule);
  }
  .ou-row:first-of-type { border-top: none; }
  .ou-line { color: var(--ink-dim); }
  .ou-bar-wrap {
    flex: 1;
    height: 6px;
    background: var(--rule);
    border-radius: 0;
    margin: 0 10px;
    overflow: hidden;
  }
  .ou-bar {
    height: 100%;
    background: var(--accent);
  }
  .ou-pct { min-width: 38px; text-align: right; }
  .btts-row {
    font-family: var(--data);
    font-size: 12px;
    color: var(--ink-dim);
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--rule);
  }
  .metric-split {
    display: flex;
    gap: 10px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--rule);
  }
  .metric-split-col {
    flex: 1;
    min-width: 0;
  }
  .metric-split-title {
    font-family: var(--data);
    font-size: 10px;
    color: var(--meta);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .metric-split-expected {
    font-family: var(--data);
    font-weight: 700;
    font-size: 15px;
    margin: 2px 0 4px;
  }
  .split-ou-row {
    display: flex;
    justify-content: space-between;
    font-family: var(--data);
    font-size: 10px;
    padding: 2px 0;
    color: var(--ink-dim);
  }
  .split-ou-line { color: var(--meta); }
  .sample-note {
    font-family: var(--data);
    font-size: 10px;
    color: var(--meta);
    margin-top: 12px;
  }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--meta);
    font-family: var(--data);
    font-size: 13px;
    line-height: 1.8;
  }

  footer {
    max-width: 920px;
    margin: 20px auto 40px;
    padding: 0 20px;
    color: var(--meta);
    font-family: var(--data);
    font-size: 11px;
  }

  @media (max-width: 560px) {
    .quick-stats { display: none; }
    .teams { font-size: 13px; }
  }
</style>
</head>
<body>

  <header>
    <h1>Footy Stat Pack</h1>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main id="main">
    <div class="empty">Loading…</div>
  </main>

  <footer>
    Data: football-data.co.uk (results) + fixturedownload.com (fixtures). Poisson model — treat as a signal, not a certainty.
  </footer>

<script src="statpack_data.js"></script>
<script src="bets_log.js"></script>
<script src="nfl_statpack_data.js"></script>
<script>
(function () {
  const LEAGUE_ORDER = ["E0", "E1", "E2", "E3", "SC0", "I1", "SP1", "D1", "F1"];
  const BEST_BETS = "__BEST_BETS__";
  const TODAY = "__TODAY__";
  const TRACK_RECORD = "__TRACK_RECORD__";
  const EFL_CUP = "__EFL_CUP__";
  const CASH_BUILDER = "__CASH_BUILDER__";
  const NFL = "__NFL__";
  const NEAR_TERM_WINDOW_DAYS = 4; // one weekend round (Fri-Mon) - covers a single gameweek without pulling in next week's fixtures too
  let showFullSeason = false; // toggled by the "Show full season" link in league views
  let footballMenuOpen = false; // toggled by clicking the "Football" tab
  let bestBetsSortMode = "confidence"; // toggled by the sort-order links on the Best Bets tab
  let bestBetsHiddenMetrics = new Set(); // metrics unchecked by the filter row - empty means "show everything"
  let bestBetsMarketOnly = false; // toggled by the "Market-matched only" checkbox
  let data = (typeof STATPACK_DATA !== "undefined") ? STATPACK_DATA.generated_leagues : null;
  let activeLeague = null;

  const tabsEl = document.getElementById("tabs");
  const mainEl = document.getElementById("main");

  if (!data) {
    mainEl.innerHTML = '<div class="empty">No statpack_data.js found next to this file.<br>Run build_statpack.py, then open this page from the same folder.</div>';
    return;
  }

  const availableLeagues = LEAGUE_ORDER.filter(code => data[code]);
  if (availableLeagues.length === 0) {
    mainEl.innerHTML = '<div class="empty">No league data found. Run fetch_data.py and build_statpack.py first.</div>';
    return;
  }
  activeLeague = TODAY;

  function pct(n) { return Math.round(n * 100) + "%"; }

  function ordinal(n) {
    if (!n) return "";
    const s = ["th", "st", "nd", "rd"], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }

  function posBadge(position) {
    if (!position) return "";
    return `<span class="pos-badge">${ordinal(position)}</span>`;
  }

  function parseFixtureDate(d) {
    const parts = (d || "").split("/");
    if (parts.length !== 3) return null;
    const dt = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
    return isNaN(dt) ? null : dt;
  }

  // Sortable timestamp combining date + kickoff time - used to put
  // fixtures back into chronological order before grouping/display,
  // rather than trusting the source file's row order. Confirmed this
  // matters in practice: a rearranged fixture (e.g. moved to a later
  // date for European-fixture reasons) can sit earlier in the source
  // CSV than fixtures that kept their original, earlier date, which
  // otherwise showed matches out of date order on the page. Undated
  // fixtures sort last (Infinity) rather than disappearing or
  // clumping at the start.
  function fixtureTimestamp(fx) {
    const d = parseFixtureDate(fx.date);
    if (!d) return Infinity;
    const [hh, mm] = (fx.time || "00:00").split(":").map(Number);
    return d.getTime() + ((isNaN(hh) ? 0 : hh) * 60 + (isNaN(mm) ? 0 : mm)) * 60000;
  }

  function sortByKickoff(fixtures) {
    return [...fixtures].sort((a, b) => fixtureTimestamp(a) - fixtureTimestamp(b));
  }

  function fmtDate(d) {
    // d like "22/08/2026" -> "FRI 22 AUG"
    const parts = (d || "").split("/");
    if (parts.length !== 3) return d || "TBC";
    const dt = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
    if (isNaN(dt)) return d;
    return dt.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }).toUpperCase();
  }

  function isFootballView(league) {
    return availableLeagues.includes(league) || league === EFL_CUP || league === CASH_BUILDER;
  }

  function buildTabs() {
    tabsEl.innerHTML = "";
    // The football dropdown lives on <body>, not inside tabsEl (see below),
    // so clearing tabsEl doesn't remove a stale copy - do that here.
    const staleMenu = document.getElementById("football-dropdown-menu");
    if (staleMenu) staleMenu.remove();

    const todayBtn = document.createElement("button");
    todayBtn.className = "tab" + (activeLeague === TODAY ? " active" : "");
    todayBtn.innerHTML = "Today";
    todayBtn.addEventListener("click", () => { activeLeague = TODAY; footballMenuOpen = false; render(); });
    tabsEl.appendChild(todayBtn);

    // Football is a single top-level tab with a dropdown underneath it -
    // every league, EFL Cup, and Cash Builder used to each get their own
    // top-level slot, which stopped being manageable once NFL joined
    // them as a genuinely different sport needing its own space.
    const footballWrap = document.createElement("div");
    footballWrap.className = "tab-wrap";

    const footballBtn = document.createElement("button");
    footballBtn.className = "tab" + (isFootballView(activeLeague) ? " active" : "");
    footballBtn.innerHTML = `Football <span class="chev-dd">${footballMenuOpen ? "▴" : "▾"}</span>`;
    footballBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      footballMenuOpen = !footballMenuOpen;
      buildTabs();
    });
    footballWrap.appendChild(footballBtn);
    tabsEl.appendChild(footballWrap);

    if (footballMenuOpen) {
      const menu = document.createElement("div");
      menu.id = "football-dropdown-menu";
      menu.className = "football-dropdown";

      availableLeagues.forEach(code => {
        const league = data[code];
        const item = document.createElement("button");
        item.className = "dropdown-item" + (code === activeLeague ? " active" : "");
        item.innerHTML = league.league_name + ' <span class="count">' + league.upcoming_fixtures.length + '</span>';
        item.addEventListener("click", (e) => {
          e.stopPropagation();
          activeLeague = code; footballMenuOpen = false; render();
        });
        menu.appendChild(item);
      });

      const cupFixtures = (typeof STATPACK_DATA !== "undefined" && STATPACK_DATA.efl_cup)
        ? STATPACK_DATA.efl_cup.fixtures : [];
      const cashBuilderAvailable = typeof CASH_BUILDER_DATA !== "undefined"
        && CASH_BUILDER_DATA.chains && CASH_BUILDER_DATA.chains.length > 0;

      if (cupFixtures.length > 0 || cashBuilderAvailable) {
        const divider = document.createElement("div");
        divider.className = "dropdown-divider";
        menu.appendChild(divider);
      }

      if (cupFixtures.length > 0) {
        const item = document.createElement("button");
        item.className = "dropdown-item" + (activeLeague === EFL_CUP ? " active" : "");
        item.innerHTML = "EFL Cup " + `<span class="count">${cupFixtures.length}</span>`;
        item.addEventListener("click", (e) => {
          e.stopPropagation();
          activeLeague = EFL_CUP; footballMenuOpen = false; render();
        });
        menu.appendChild(item);
      }

      if (cashBuilderAvailable) {
        const item = document.createElement("button");
        item.className = "dropdown-item" + (activeLeague === CASH_BUILDER ? " active" : "");
        item.innerHTML = "Cash Builder";
        item.addEventListener("click", (e) => {
          e.stopPropagation();
          activeLeague = CASH_BUILDER; footballMenuOpen = false; render();
        });
        menu.appendChild(item);
      }

      // Appended to <body> with a computed fixed position, rather than
      // inside footballWrap, so it isn't clipped by .tabs' own horizontal
      // scroll container (see the .football-dropdown CSS comment).
      const btnRect = footballBtn.getBoundingClientRect();
      menu.style.position = "fixed";
      menu.style.top = `${btnRect.bottom + 4}px`;
      menu.style.left = `${btnRect.left}px`;
      document.body.appendChild(menu);
    }

    if (typeof NFL_STATPACK_DATA !== "undefined" && NFL_STATPACK_DATA.upcoming_fixtures) {
      const nflBtn = document.createElement("button");
      nflBtn.className = "tab" + (activeLeague === NFL ? " active" : "");
      nflBtn.innerHTML = "NFL " + `<span class="count">${NFL_STATPACK_DATA.upcoming_fixtures.length}</span>`;
      nflBtn.addEventListener("click", () => { activeLeague = NFL; footballMenuOpen = false; render(); });
      tabsEl.appendChild(nflBtn);
    }

    const bbBtn = document.createElement("button");
    bbBtn.className = "tab" + (activeLeague === BEST_BETS ? " active" : "");
    bbBtn.innerHTML = "★ Best Bets";
    bbBtn.addEventListener("click", () => { activeLeague = BEST_BETS; footballMenuOpen = false; render(); });
    tabsEl.appendChild(bbBtn);

    const trBtn = document.createElement("button");
    trBtn.className = "tab" + (activeLeague === TRACK_RECORD ? " active" : "");
    const trPct = (typeof BETS_LOG !== "undefined" && BETS_LOG.summary.overall.total > 0)
      ? ` ${BETS_LOG.summary.overall.pct}%` : "";
    trBtn.innerHTML = "Track Record" + trPct;
    trBtn.addEventListener("click", () => { activeLeague = TRACK_RECORD; footballMenuOpen = false; render(); });
    tabsEl.appendChild(trBtn);
  }

  function metricBlock(title, m, homeTeam, awayTeam) {
    if (!m) return "";
    const ouRows = (m.over_under || []).map(ou => {
      const overPct = ou.over;
      const barColor = overPct >= 0.5 ? "var(--green)" : "var(--accent)";
      return `<div class="ou-row">
        <span class="ou-line">O/U ${ou.line}</span>
        <div class="ou-bar-wrap"><div class="ou-bar" style="width:${Math.round(overPct*100)}%;background:${barColor}"></div></div>
        <span class="ou-pct ${overPct >= 0.55 ? 'pct-hi' : overPct <= 0.4 ? 'pct-lo' : ''}">${pct(overPct)}</span>
      </div>`;
    }).join("");

    const btts = (m.btts_yes !== undefined)
      ? `<div class="btts-row">BTTS: <b>${pct(m.btts_yes)}</b> yes / ${pct(m.btts_no)} no</div>`
      : "";

    const split = m.home_over_under ? splitBlock(m, homeTeam, awayTeam) : "";

    return `<div class="metric-card">
      <div class="metric-title">${title} <span style="opacity:0.6">· over %</span></div>
      <div class="metric-expected">${m.expected_total}<span class="label">expected</span></div>
      ${ouRows}
      ${btts}
      ${split}
    </div>`;
  }

  function splitSideRows(entries) {
    return entries.map(ou => `<div class="split-ou-row">
      <span class="split-ou-line">${ou.line}</span>
      <span class="split-ou-pct ${ou.over >= 0.55 ? 'pct-hi' : ou.over <= 0.4 ? 'pct-lo' : ''}">${pct(ou.over)}</span>
    </div>`).join("");
  }

  function splitBlock(m, homeTeam, awayTeam) {
    return `<div class="metric-split">
      <div class="metric-split-col">
        <div class="metric-split-title">${homeTeam || 'Home'}</div>
        <div class="metric-split-expected">${m.expected_home}</div>
        ${splitSideRows(m.home_over_under)}
      </div>
      <div class="metric-split-col">
        <div class="metric-split-title">${awayTeam || 'Away'}</div>
        <div class="metric-split-expected">${m.expected_away}</div>
        ${splitSideRows(m.away_over_under)}
      </div>
    </div>`;
  }

  function quickStat(fixture) {
    const g = fixture.predictions.goals;
    const c = fixture.predictions.corners;
    if (!g || !c) return "";
    const goalsLine = g.over_under.find(o => o.line === 2.5) || g.over_under[0];
    const cornersLine = c.over_under.find(o => o.line === 9.5) || c.over_under[0];
    return `<div class="quick-stats">
      <span class="quick-stat">O${goalsLine.line} GLS <b class="${goalsLine.over >= 0.55 ? 'pct-hi' : ''}">${pct(goalsLine.over)}</b></span>
      <span class="quick-stat">O${cornersLine.line} CRN <b class="${cornersLine.over >= 0.55 ? 'pct-hi' : ''}">${pct(cornersLine.over)}</b></span>
    </div>`;
  }

  function flagBadges(fixture) {
    // market_blended is a different kind of signal to everything else
    // here - the others are all CAUTIONS (treat this prediction with
    // more care), styled amber accordingly. Market blending means the
    // opposite - real bookmaker odds are backing this prediction, not
    // undermining it - so it gets its own green styling and comes
    // first, rather than being lumped in with the warning flags.
    const marketBadge = fixture.market_blended ? `<span class="flag-market">M</span>` : "";

    const flags = [];
    if (fixture.cross_league_data) flags.push('cross-league');
    if (fixture.cross_division) flags.push('cross-division');
    if (fixture.fuzzy_name_match) flags.push('name check');
    if (fixture.low_sample) flags.push('thin sample');
    return marketBadge + flags.map(f => `<span class="flag">${f}</span>`).join("");
  }

  function matchResultBlock(fixture) {
    const mr = fixture.predictions.goals?.match_result;
    if (!mr) return "";

    const options = [
      { label: fixture.home_team, position: fixture.home_position, key: "home_win", pct: mr.home_win },
      { label: "Draw", position: null, key: "draw", pct: mr.draw },
      { label: fixture.away_team, position: fixture.away_position, key: "away_win", pct: mr.away_win },
    ];
    const highest = Math.max(mr.home_win, mr.draw, mr.away_win);

    return `<div class="mr-block">
      <div class="metric-title">Match Result</div>
      <div class="mr-row">
        ${options.map(o => `
          <div class="mr-option ${o.pct === highest ? 'mr-favourite' : ''}">
            <div class="mr-label">${o.label}${posBadge(o.position)}</div>
            <div class="mr-pct ${o.pct === highest ? 'pct-hi' : ''}">${pct(o.pct)}</div>
          </div>
        `).join("")}
      </div>
    </div>`;
  }

  function fixtureCard(fixture, badge) {
    const p = fixture.predictions;
    const flag = flagBadges(fixture);
    const note = fixture.note ? `<div class="note">⚠ ${fixture.note.trim()}</div>` : "";
    const badgeHtml = badge ? `<span class="fixture-badge">${badge}</span>` : "";

    return `<details class="fixture">
      <summary>
        <span class="kickoff">${fixture.time || "--:--"}</span>
        <span class="teams">${fixture.home_team}<span class="v">v</span>${fixture.away_team}</span>
        ${badgeHtml}
        ${flag}
        ${quickStat(fixture)}
        <span class="chev">▸</span>
      </summary>
      <div class="detail">
        ${note}
        ${matchResultBlock(fixture)}
        <div class="metric-grid">
          ${metricBlock("Full-Time Goals", p.goals, fixture.home_team, fixture.away_team)}
          ${metricBlock("Corners", p.corners, fixture.home_team, fixture.away_team)}
          ${metricBlock("Cards", p.cards, fixture.home_team, fixture.away_team)}
          ${metricBlock("1st-Half Goals", p.first_half_goals, fixture.home_team, fixture.away_team)}
          ${metricBlock("2nd-Half Goals", p.second_half_goals, fixture.home_team, fixture.away_team)}
        </div>
        <div class="sample-note">Form sample: ${fixture.home_form_sample} home games, ${fixture.away_form_sample} away games</div>
      </div>
    </details>`;
  }

  const METRIC_LABELS = {
    goals: "Full-Time Goals",
    corners: "Corners",
    cards: "Cards",
    first_half_goals: "1st-Half Goals",
    second_half_goals: "2nd-Half Goals",
  };

  // Best Bets is now a single FLAT list (see best_bets.py / nfl_best_bets.py) -
  // every qualifying pick across every league AND sport, sorted by
  // confidence, no category grouping. Each pick already carries a
  // ready-to-display "label" computed in Python, so rendering here is
  // just laying out common fields (time, league/sport badge, label,
  // confidence) rather than reconstructing pick-type-specific text.
  function flatBestBetRow(pick, rank) {
    return `<div class="bb-row">
      <span class="bb-rank">${rank}</span>
      <span class="kickoff">${pick.time || "--:--"}</span>
      <span class="bb-teams" style="flex:2">${pick.label}</span>
      <span class="bb-league">${pick.league_name}</span>
      <span class="bb-pct ${pick.confidence >= 0.55 ? 'pct-hi' : pick.confidence <= 0.4 ? 'pct-lo' : ''}">${pct(pick.confidence)}</span>
    </div>`;
  }

  // Groups picks by their underlying fixture (same sport/teams/date/
  // time), orders the GROUPS by kickoff time, and within each group
  // orders picks by confidence - so multiple picks on the same game
  // (e.g. a match-level Over plus a team-level corners pick) end up
  // sitting next to each other rather than scattered wherever their
  // individual confidence happens to place them.
  function groupPicksByGame(picks) {
    const groups = new Map();
    picks.forEach(p => {
      const key = `${p.sport}|${p.home_team}|${p.away_team}|${p.date}|${p.time}`;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(p);
    });
    const groupList = Array.from(groups.values());
    groupList.forEach(g => g.sort((a, b) => b.confidence - a.confidence));
    groupList.sort((a, b) => fixtureTimestamp(a[0]) - fixtureTimestamp(b[0]));
    return groupList.flat();
  }

  const ALL_METRIC_LABELS = {
    goals: "Goals",
    corners: "Corners",
    cards: "Cards",
    first_half_goals: "1st-Half Goals",
    second_half_goals: "2nd-Half Goals",
    btts: "BTTS",
    team_win: "Team Win",
    moneyline: "Moneyline",
    points: "Points",
    passing_tds: "Passing TDs",
    rushing_tds: "Rushing TDs",
  };

  // Checkbox filter row - built dynamically from whichever metrics
  // actually appear in TODAY's pool (not a fixed list), so a day with
  // no NFL picks simply doesn't show NFL-only checkboxes, and a new
  // metric added later needs no changes here to show up. Unchecking a
  // box hides that metric; everything defaults to checked (shown).
  function bestBetsFilterRow(picks) {
    const metricsPresent = [...new Set(picks.map(p => p.metric))];
    if (metricsPresent.length <= 1) return ""; // nothing meaningful to filter
    metricsPresent.sort();
    return `<div class="bb-filter-row">
      ${metricsPresent.map(m => `
        <label class="bb-filter-item">
          <input type="checkbox" data-metric="${m}" ${bestBetsHiddenMetrics.has(m) ? "" : "checked"}>
          ${ALL_METRIC_LABELS[m] || m}
        </label>
      `).join("")}
    </div>`;
  }

  // Market-matched filter - kept separate from the metric checkboxes above
  // because it isn't itself a metric, it's a data-quality signal (same
  // market_blended flag behind the green "M" badge on fixture cards, see
  // flagBadges). Only shown when at least one of today's picks actually has
  // it - most useful exactly on days like an international break, where
  // most fixtures are postponed and the handful still on are worth judging
  // by whether they're backed by real bookmaker odds rather than model-only.
  // Best Bets picks don't necessarily carry market_blended themselves -
  // they're generated from the fixtures that do, but the flattening in
  // best_bets.py / nfl_best_bets.py doesn't always carry every fixture-level
  // field along with it. This builds a lookup from the fixture data
  // (same team/date/time key used elsewhere to match a pick back to its
  // game) so the filter works whether or not the pick object itself has
  // the flag.
  function buildFixtureMarketMap() {
    const map = new Map();
    const addFx = fx => {
      map.set(`${fx.home_team}|${fx.away_team}|${fx.date}|${fx.time}`, !!fx.market_blended);
    };
    if (data) {
      Object.values(data).forEach(league => (league.upcoming_fixtures || []).forEach(addFx));
    }
    const cupFixtures = (typeof STATPACK_DATA !== "undefined" && STATPACK_DATA.efl_cup)
      ? STATPACK_DATA.efl_cup.fixtures : [];
    cupFixtures.forEach(addFx);
    if (typeof NFL_STATPACK_DATA !== "undefined" && NFL_STATPACK_DATA.upcoming_fixtures) {
      NFL_STATPACK_DATA.upcoming_fixtures.forEach(addFx);
    }
    return map;
  }

  function isMarketMatched(pick, fixtureMarketMap) {
    if (pick.market_blended !== undefined) return !!pick.market_blended;
    return !!fixtureMarketMap.get(`${pick.home_team}|${pick.away_team}|${pick.date}|${pick.time}`);
  }

  function bestBetsMarketToggle(picks, fixtureMarketMap) {
    const marketCount = picks.filter(p => isMarketMatched(p, fixtureMarketMap)).length;
    if (marketCount === 0) return "";
    return `<div class="bb-filter-row">
      <label class="bb-filter-item">
        <input type="checkbox" id="bb-market-only" ${bestBetsMarketOnly ? "checked" : ""}>
        Market-matched only <span style="color:var(--green)">(${marketCount})</span>
      </label>
    </div>`;
  }

  function bestBetsSortToggle() {
    const opt = (mode, label) => mode === bestBetsSortMode
      ? `<span class="sort-toggle-active">${label}</span>`
      : `<a href="#" class="sort-toggle-link" data-sort="${mode}">${label}</a>`;
    return `<div class="window-toggle">Sort: ${opt("confidence", "% Confidence")} · ${opt("game", "By Game")}</div>`;
  }

  function renderBestBets() {
    const footballPicks = (typeof STATPACK_DATA !== "undefined" && Array.isArray(STATPACK_DATA.best_bets))
      ? STATPACK_DATA.best_bets : [];
    const nflPicks = (typeof NFL_STATPACK_DATA !== "undefined" && Array.isArray(NFL_STATPACK_DATA.best_bets))
      ? NFL_STATPACK_DATA.best_bets : [];
    const combined = [...footballPicks, ...nflPicks];

    if (combined.length === 0) {
      mainEl.innerHTML = `<div class="empty">No eligible picks today across any league or sport.<br>
        (Fixtures with a thin sample, cross-league, or name-match flag are excluded from Best Bets - check the league tabs for those.)</div>`;
      return;
    }

    const fixtureMarketMap = buildFixtureMarketMap();
    const filterRow = bestBetsFilterRow(combined);
    const marketToggleRow = bestBetsMarketToggle(combined, fixtureMarketMap);
    let visible = combined.filter(p => !bestBetsHiddenMetrics.has(p.metric));
    if (bestBetsMarketOnly) visible = visible.filter(p => isMarketMatched(p, fixtureMarketMap));
    const allPicks = bestBetsSortMode === "game"
      ? groupPicksByGame(visible)
      : [...visible].sort((a, b) => b.confidence - a.confidence);

    const listHtml = allPicks.length > 0
      ? allPicks.map((p, i) => flatBestBetRow(p, i + 1)).join("")
      : `<div class="bb-empty">No picks match the current filter</div>`;

    mainEl.innerHTML = `<div class="bb-intro">Every pick today, across every league and sport, that clears its confidence bar. Team-level picks (e.g. one side's own corner count) sit alongside match-level ones with no separate grouping.</div>` +
      filterRow +
      marketToggleRow +
      bestBetsSortToggle() +
      listHtml;

    mainEl.querySelectorAll(".bb-filter-item input[data-metric]").forEach(box => {
      box.addEventListener("change", () => {
        const metric = box.dataset.metric;
        if (box.checked) bestBetsHiddenMetrics.delete(metric);
        else bestBetsHiddenMetrics.add(metric);
        render();
      });
    });

    const marketBox = mainEl.querySelector("#bb-market-only");
    if (marketBox) {
      marketBox.addEventListener("change", () => {
        bestBetsMarketOnly = marketBox.checked;
        render();
      });
    }

    const toggle = mainEl.querySelector(".window-toggle");
    if (toggle) {
      toggle.querySelectorAll("a[data-sort]").forEach(link => {
        link.addEventListener("click", (e) => {
          e.preventDefault();
          bestBetsSortMode = link.dataset.sort;
          render();
        });
      });

    }
  }

  function renderTrackRecord() {
    if (typeof BETS_LOG === "undefined") {
      mainEl.innerHTML = `<div class="empty">No bets_log.js found yet.<br>This is generated by track_bets.py, which runs automatically as part of the daily Action - check back after the next run.</div>`;
      return;
    }

    const { summary } = BETS_LOG;
    const overall = summary.overall;

    const summaryHtml = `<div class="tr-summary">
      <div class="tr-summary-main">
        <span class="tr-summary-pct ${overall.pct >= 55 ? 'pct-hi' : overall.pct <= 40 ? 'pct-lo' : ''}">${overall.total > 0 ? overall.pct + '%' : '—'}</span>
        <span class="tr-summary-label">${overall.hits}/${overall.total} settled picks hit${summary.pending_count ? ` · ${summary.pending_count} pending` : ''}</span>
      </div>
      <div class="tr-category-grid">
        ${summary.by_category.map(c => {
          const label = c.metric === "btts" ? `BTTS ${c.direction}`
            : (c.metric === "team_win" || c.metric === "moneyline") ? "Team Win"
            : `${METRIC_LABELS[c.metric] || c.metric} ${c.direction}`;
          return `<div class="tr-category-chip">
            <span>${label}</span>
            <span class="${c.pct >= 55 ? 'pct-hi' : c.pct <= 40 ? 'pct-lo' : ''}">${c.pct}% <span class="tr-chip-n">(${c.hits}/${c.total})</span></span>
          </div>`;
        }).join("") || '<div class="bb-empty">No settled picks yet</div>'}
      </div>
    </div>`;

    mainEl.innerHTML = `<div class="bb-intro">Tracking every Best Bets pick since logging started - settled automatically once each match is played. NFL picks currently log as pending but aren't reconciled against results yet.</div>` +
      summaryHtml;
  }

  function cupFixtureCard(fixture) {
    const p = fixture.predictions;
    const flag = flagBadges(fixture);
    const note = fixture.note ? `<div class="note">⚠ ${fixture.note.trim()}</div>` : "";
    const leagueLine = fixture.cross_division
      ? `<div class="cup-leagues">${fixture.home_league} v ${fixture.away_league}</div>`
      : "";

    return `<details class="fixture">
      <summary>
        <span class="kickoff">${fixture.time || "--:--"}</span>
        <span class="teams">${fixture.home_team}<span class="v">v</span>${fixture.away_team}</span>
        ${flag}
        ${quickStat(fixture)}
        <span class="chev">▸</span>
      </summary>
      <div class="detail">
        ${leagueLine}
        ${note}
        ${matchResultBlock(fixture)}
        <div class="metric-grid">
          ${metricBlock("Full-Time Goals", p.goals, fixture.home_team, fixture.away_team)}
          ${metricBlock("Corners", p.corners, fixture.home_team, fixture.away_team)}
          ${metricBlock("Cards", p.cards, fixture.home_team, fixture.away_team)}
          ${metricBlock("1st-Half Goals", p.first_half_goals, fixture.home_team, fixture.away_team)}
          ${metricBlock("2nd-Half Goals", p.second_half_goals, fixture.home_team, fixture.away_team)}
        </div>
        <div class="sample-note">Form sample: ${fixture.home_form_sample} home games, ${fixture.away_form_sample} away games</div>
      </div>
    </details>`;
  }

  // ---------- NFL ----------
  function nflMoneylineBlock(fixture) {
    const ml = fixture.predictions?.points?.moneyline;
    if (!ml) return "";
    const highest = Math.max(ml.home_win, ml.away_win);
    const options = [
      { label: fixture.home_team, pct: ml.home_win },
      { label: fixture.away_team, pct: ml.away_win },
    ];
    return `<div class="mr-block">
      <div class="metric-title">Moneyline</div>
      <div class="mr-row">
        ${options.map(o => `
          <div class="mr-option ${o.pct === highest ? 'mr-favourite' : ''}">
            <div class="mr-label">${o.label}</div>
            <div class="mr-pct ${o.pct === highest ? 'pct-hi' : ''}">${pct(o.pct)}</div>
          </div>
        `).join("")}
      </div>
    </div>`;
  }

  function nflOuRows(entries) {
    return (entries || []).map(ou => {
      const overPct = ou.over;
      const barColor = overPct >= 0.5 ? "var(--green)" : "var(--accent)";
      return `<div class="ou-row">
        <span class="ou-line">O/U ${ou.line}</span>
        <div class="ou-bar-wrap"><div class="ou-bar" style="width:${Math.round(overPct*100)}%;background:${barColor}"></div></div>
        <span class="ou-pct ${overPct >= 0.55 ? 'pct-hi' : overPct <= 0.4 ? 'pct-lo' : ''}">${pct(overPct)}</span>
      </div>`;
    }).join("");
  }

  function nflTotalPointsCard(fixture) {
    const p = fixture.predictions?.points;
    if (!p) return "";
    return `<div class="metric-card">
      <div class="metric-title">Total Points <span style="opacity:0.6">· over %</span></div>
      <div class="metric-expected">${p.expected_total}<span class="label">expected</span></div>
      ${nflOuRows(p.total_over_under)}
    </div>`;
  }

  function nflSplitRows(entries) {
    return (entries || []).map(ou => `<div class="split-ou-row">
      <span class="split-ou-line">${ou.line}</span>
      <span class="split-ou-pct ${ou.over >= 0.55 ? 'pct-hi' : ou.over <= 0.4 ? 'pct-lo' : ''}">${pct(ou.over)}</span>
    </div>`).join("");
  }

  function nflSplitCard(title, m, homeTeam, awayTeam) {
    if (!m) return "";
    return `<div class="metric-card">
      <div class="metric-title">${title} <span style="opacity:0.6">· over %</span></div>
      <div class="metric-split" style="border-top:none;padding-top:0;margin-top:0">
        <div class="metric-split-col">
          <div class="metric-split-title">${homeTeam}</div>
          <div class="metric-split-expected">${m.expected_home}</div>
          ${nflSplitRows(m.home_over_under)}
        </div>
        <div class="metric-split-col">
          <div class="metric-split-title">${awayTeam}</div>
          <div class="metric-split-expected">${m.expected_away}</div>
          ${nflSplitRows(m.away_over_under)}
        </div>
      </div>
    </div>`;
  }

  function nflFixtureCard(fixture, badge) {
    const p = fixture.predictions;
    const marketBadge = fixture.market_blended ? `<span class="flag-market">M</span>` : "";
    const flag = fixture.low_sample ? `<span class="flag">thin sample</span>` : "";
    const note = fixture.note ? `<div class="note">⚠ ${fixture.note.trim()}</div>` : "";
    const badgeHtml = badge ? `<span class="fixture-badge">${badge}</span>` : "";

    return `<details class="fixture">
      <summary>
        <span class="kickoff">${fixture.time || "--:--"}</span>
        <span class="teams">${fixture.home_team}<span class="v">v</span>${fixture.away_team}</span>
        ${badgeHtml}
        ${marketBadge}${flag}
        <span class="chev">▸</span>
      </summary>
      <div class="detail">
        ${note}
        ${nflMoneylineBlock(fixture)}
        <div class="metric-grid">
          ${nflTotalPointsCard(fixture)}
          ${nflSplitCard("Team Points", p.points, fixture.home_team, fixture.away_team)}
          ${nflSplitCard("Passing TDs", p.passing_tds, fixture.home_team, fixture.away_team)}
          ${nflSplitCard("Rushing TDs", p.rushing_tds, fixture.home_team, fixture.away_team)}
        </div>
        <div class="sample-note">Form sample: ${fixture.home_form_sample} home games, ${fixture.away_form_sample} away games</div>
      </div>
    </details>`;
  }

  function renderNfl() {
    const fixtures = (typeof NFL_STATPACK_DATA !== "undefined") ? NFL_STATPACK_DATA.upcoming_fixtures : [];
    if (!fixtures || fixtures.length === 0) {
      mainEl.innerHTML = `<div class="empty">No NFL fixtures loaded yet.</div>`;
      return;
    }

    const sorted = sortByKickoff(fixtures);
    const groups = [];
    let currentDate = null, currentGroup = null;
    sorted.forEach(fx => {
      if (fx.date !== currentDate) {
        currentDate = fx.date;
        currentGroup = { date: fx.date, items: [] };
        groups.push(currentGroup);
      }
      currentGroup.items.push(fx);
    });

    const intro = `<div class="bb-intro">Points modelled as Normal-distributed (standard NFL power-rating approach); passing/rushing TDs modelled as Poisson (low, discrete counts, closer to football goals). Green "M" badge = real market odds blended in where available.</div>`;

    mainEl.innerHTML = intro + groups.map(g => `
      <div class="date-group">
        <div class="date-label">${fmtDate(g.date)}</div>
        ${g.items.map(nflFixtureCard).join("")}
      </div>
    `).join("");
  }

  // ---------- Today ----------
  const LATE_NIGHT_CUTOFF_HOUR = 6;

  // A fixture doesn't vanish the instant kickoff passes - a 3pm kickoff
  // is still very much "on" at 3:01pm, and most matches (football,
  // NFL) run 2-3.5 hours including stoppage/overtime. 4 hours gives a
  // comfortable margin past even a long game before it drops off,
  // while still being nowhere near long enough to let a game that
  // kicked off yesterday linger into today's list.
  const POST_KICKOFF_GRACE_HOURS = 4;

  function renderToday() {
    const now = new Date();
    const windowStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    const windowEnd = windowStart + (24 + LATE_NIGHT_CUTOFF_HOUR) * 3600000;

    // A fixture whose kickoff has already passed shouldn't show here
    // regardless of which day's window it falls in - a game that
    // kicked off Thursday evening US time (early Friday UK) is
    // correctly included on Thursday's page ahead of kickoff, but
    // once it's actually been played there's no reason for it to
    // linger into Friday's page too just because its own date field
    // says Friday. Checking against the CURRENT moment (not just the
    // date window) catches this - and also covers a backend-staleness
    // case: NFL's own data only refreshes once a day, so a game that
    // was still upcoming at that last refresh could have since kicked
    // off and finished by the time someone actually loads this page.
    const inWindow = fx => {
      const ts = fixtureTimestamp(fx);
      return ts >= windowStart && ts < windowEnd && ts >= now.getTime() - POST_KICKOFF_GRACE_HOURS * 3600000;
    };

    const items = [];

    if (data) {
      Object.entries(data).forEach(([code, league]) => {
        (league.upcoming_fixtures || []).forEach(fx => {
          if (inWindow(fx)) items.push({ ...fx, _badge: league.league_name, _kind: "football" });
        });
      });
    }

    const cupFixtures = (typeof STATPACK_DATA !== "undefined" && STATPACK_DATA.efl_cup)
      ? STATPACK_DATA.efl_cup.fixtures : [];
    cupFixtures.forEach(fx => {
      if (inWindow(fx)) items.push({ ...fx, _badge: "EFL Cup", _kind: "football" });
    });

    if (typeof NFL_STATPACK_DATA !== "undefined" && NFL_STATPACK_DATA.upcoming_fixtures) {
      NFL_STATPACK_DATA.upcoming_fixtures.forEach(fx => {
        if (inWindow(fx)) items.push({ ...fx, _badge: "NFL", _kind: "nfl" });
      });
    }

    if (items.length === 0) {
      mainEl.innerHTML = `<div class="empty">No games today across any league or sport.</div>`;
      return;
    }

    const sorted = sortByKickoff(items);
    const intro = `<div class="bb-intro">Every game today, across every league and sport - ${sorted.length} fixture${sorted.length === 1 ? "" : "s"}, in kickoff order. Late kickoffs after midnight are included as "tonight".</div>`;
    mainEl.innerHTML = intro + sorted.map(fx =>
      fx._kind === "nfl" ? nflFixtureCard(fx, fx._badge) : fixtureCard(fx, fx._badge)
    ).join("");
  }

  function renderEflCup() {
    const cupFixtures = (typeof STATPACK_DATA !== "undefined" && STATPACK_DATA.efl_cup)
      ? STATPACK_DATA.efl_cup.fixtures : [];

    if (cupFixtures.length === 0) {
      mainEl.innerHTML = `<div class="empty">No EFL Cup fixtures loaded.<br>Add them to cup_fixtures_manual/efl_cup.txt.</div>`;
      return;
    }

    const intro = `<div class="bb-intro">Fixtures crossing divisions ("cross-division") use each team's own
      league form with a rough cross-league adjustment (see cross_league.py) - treat these with more caution
      than same-league predictions.</div>`;

    const groups = [];
    let currentDate = null, currentGroup = null;
    sortByKickoff(cupFixtures).forEach(fx => {
      if (fx.date !== currentDate) {
        currentDate = fx.date;
        currentGroup = { date: fx.date, items: [] };
        groups.push(currentGroup);
      }
      currentGroup.items.push(fx);
    });

    mainEl.innerHTML = intro + groups.map(g => `
      <div class="date-group">
        <div class="date-label">${fmtDate(g.date)}</div>
        ${g.items.map(cupFixtureCard).join("")}
      </div>
    `).join("");
  }

  function render() {
    buildTabs();

    if (activeLeague === BEST_BETS) {
      renderBestBets();
      return;
    }
    if (activeLeague === TRACK_RECORD) {
      renderTrackRecord();
      return;
    }
    if (activeLeague === EFL_CUP) {
      renderEflCup();
      return;
    }
    if (activeLeague === CASH_BUILDER) {
      renderCashBuilder();
      return;
    }
    if (activeLeague === NFL) {
      renderNfl();
      return;
    }
    if (activeLeague === TODAY) {
      renderToday();
      return;
    }

    const league = data[activeLeague];
    const allFixtures = league.upcoming_fixtures;
    const freshnessChip = leagueFreshnessChip(activeLeague);

    if (allFixtures.length === 0) {
      mainEl.innerHTML = freshnessChip + `<div class="empty">No upcoming fixtures loaded for ${league.league_name}.<br>Check fixtures_manual/ has the right CSV for this league.</div>`;
      return;
    }

    const now = new Date();
    const windowEnd = new Date(now);
    windowEnd.setDate(now.getDate() + NEAR_TERM_WINDOW_DAYS);

    const nearTerm = allFixtures.filter(fx => {
      const d = parseFixtureDate(fx.date);
      return !d || d <= windowEnd;
    });
    const fixtures = showFullSeason ? allFixtures : nearTerm;
    const hiddenCount = allFixtures.length - nearTerm.length;

    const toggle = hiddenCount > 0
      ? (showFullSeason
          ? `<div class="window-toggle">Showing full season (${allFixtures.length} fixtures) · <a href="#" id="toggle-window">Show next ${NEAR_TERM_WINDOW_DAYS} days only</a></div>`
          : `<div class="window-toggle">Showing next ${NEAR_TERM_WINDOW_DAYS} days · <a href="#" id="toggle-window">Show full season (${hiddenCount} more)</a></div>`)
      : "";

    if (fixtures.length === 0) {
      mainEl.innerHTML = freshnessChip + toggle + `<div class="empty">No fixtures in the next ${NEAR_TERM_WINDOW_DAYS} days for ${league.league_name}.<br>Try "Show full season" above.</div>`;
      attachToggleHandler();
      return;
    }

    const groups = [];
    let currentDate = null, currentGroup = null;
    sortByKickoff(fixtures).forEach(fx => {
      if (fx.date !== currentDate) {
        currentDate = fx.date;
        currentGroup = { date: fx.date, items: [] };
        groups.push(currentGroup);
      }
      currentGroup.items.push(fx);
    });

    mainEl.innerHTML = freshnessChip + toggle + groups.map(g => `
      <div class="date-group">
        <div class="date-label">${fmtDate(g.date)}</div>
        ${g.items.map(fixtureCard).join("")}
      </div>
    `).join("");
    attachToggleHandler();
  }

  function attachToggleHandler() {
    const link = document.getElementById("toggle-window");
    if (link) {
      link.addEventListener("click", (e) => {
        e.preventDefault();
        showFullSeason = !showFullSeason;
        render();
      });
    }
  }

  // Was a single strip across every league in the header - moved to
  // per-league instead (shown inline on that league's own view) since
  // showing every league's freshness at once regardless of which one
  // you're actually looking at was taking up a lot of header space for
  // information only relevant one league at a time.
  function leagueFreshnessChip(code) {
    const freshness = (typeof STATPACK_DATA !== "undefined") ? STATPACK_DATA.data_freshness : null;
    const f = freshness && freshness[code];
    if (!f) return "";
    if (f.days_old === null) {
      return `<div class="freshness-strip"><span class="freshness-chip freshness-stale"><span class="dot-status"></span>${f.league_name}: no current-season data yet</span></div>`;
    }
    const status = f.days_old <= 3 ? "fresh" : f.days_old <= 7 ? "lagging" : "stale";
    const label = f.days_old === 0 ? "today" : f.days_old === 1 ? "1 day ago" : `${f.days_old} days ago`;
    return `<div class="freshness-strip"><span class="freshness-chip freshness-${status}"><span class="dot-status"></span>${f.league_name}: ${label}</span></div>`;
  }

  document.addEventListener("click", () => {
    if (footballMenuOpen) {
      footballMenuOpen = false;
      buildTabs();
    }
  });

  render();
})();
</script>
</body>
</html>
