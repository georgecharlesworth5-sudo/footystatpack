<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Footy Stat Pack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0C0D0A;
    --surface: #171813;
    --surface-hover: #1D1F18;
    --ink: #EDE8D8;
    --ink-dim: #B8B3A0;
    --amber: #E8A33D;
    --green: #6B9B6E;
    --red: #B5533E;
    --meta: #6E6A5C;
    --rule: #2A2C22;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --sans: 'Inter', system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Ticker ---------- */
  /* ---------- Header ---------- */
  header {
    padding: 28px 20px 16px;
    max-width: 920px;
    margin: 0 auto;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--meta);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  h1 {
    font-family: var(--mono);
    font-weight: 700;
    font-size: clamp(28px, 5vw, 40px);
    margin: 0;
    letter-spacing: -0.01em;
  }
  h1 .dot { color: var(--amber); }
  .subhead {
    color: var(--ink-dim);
    font-size: 14px;
    margin-top: 8px;
  }
  .freshness-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }
  .freshness-chip {
    font-family: var(--mono);
    font-size: 11px;
    border-radius: 3px;
    padding: 5px 9px;
    border: 1px solid var(--rule);
    color: var(--ink-dim);
    white-space: nowrap;
  }
  .freshness-chip .dot-status {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .freshness-fresh .dot-status { background: var(--green); }
  .freshness-lagging .dot-status { background: var(--amber); }
  .freshness-stale .dot-status { background: var(--red); }
  .freshness-fresh { border-color: rgba(107,155,110,0.4); }
  .freshness-lagging { border-color: rgba(232,163,61,0.4); }
  .freshness-stale { border-color: rgba(181,83,62,0.4); }

  /* ---------- League tabs ---------- */
  .tabs {
    display: flex;
    gap: 2px;
    max-width: 920px;
    margin: 0 auto;
    padding: 0 20px;
    overflow-x: auto;
    border-bottom: 1px solid var(--rule);
  }
  .tab {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--meta);
    background: none;
    border: none;
    padding: 12px 14px;
    cursor: pointer;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    transition: color 0.15s;
  }
  .tab:hover { color: var(--ink-dim); }
  .tab.active {
    color: var(--amber);
    border-bottom-color: var(--amber);
  }
  .tab:focus-visible, .fixture summary:focus-visible, button:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }
  .tab .count {
    color: var(--meta);
    font-size: 10px;
    margin-left: 4px;
  }
  .tab-bestbets {
    color: var(--amber);
    font-weight: 600;
  }

  /* ---------- Best Bets ---------- */
  .bb-intro {
    font-size: 12px;
    color: var(--meta);
    padding: 14px 4px 4px;
  }
  .window-toggle {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--meta);
    padding: 14px 4px 8px;
  }
  .window-toggle a {
    color: var(--amber);
    text-decoration: none;
    border-bottom: 1px dotted var(--amber);
  }
  .window-toggle a:hover { opacity: 0.8; }
  .bb-category {
    margin: 18px 0 8px;
  }
  .bb-category-title {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--amber);
    padding: 8px 4px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 6px;
  }
  .bb-split {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
  }
  .bb-column-title {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-dim);
    padding: 2px 4px 6px;
  }
  .bb-empty {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--meta);
    padding: 8px 4px;
  }
  .bb-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 10px 14px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .bb-rank {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--meta);
    width: 16px;
  }
  .bb-teams {
    font-family: var(--mono);
    font-weight: 600;
    font-size: 13px;
    flex: 1;
    min-width: 160px;
  }
  .bb-teams .v { color: var(--meta); font-weight: 400; margin: 0 5px; }
  .bb-league {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--meta);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .bb-label {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-dim);
    min-width: 90px;
  }
  .bb-pct {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 14px;
    min-width: 44px;
    text-align: right;
  }

  /* ---------- Track Record ---------- */
  .tr-summary {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 18px;
    margin: 14px 0 20px;
  }
  .tr-summary-main {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 16px;
  }
  .tr-summary-pct {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 32px;
  }
  .tr-summary-label {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-dim);
  }
  .tr-category-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 8px;
  }
  .tr-category-chip {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 8px 10px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-dim);
  }
  .tr-chip-n { color: var(--meta); font-size: 10px; }
  .tr-badge {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    border-radius: 2px;
    padding: 3px 8px;
    white-space: nowrap;
  }
  .tr-hit { color: var(--green); border: 1px solid var(--green); }
  .tr-miss { color: var(--red); border: 1px solid var(--red); }
  .tr-pending { color: var(--meta); border: 1px solid var(--meta); }

  /* ---------- Fixture list ---------- */
  main {
    max-width: 920px;
    margin: 0 auto;
    padding: 20px;
  }
  .date-group {
    margin-bottom: 6px;
  }
  .date-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--meta);
    padding: 18px 4px 8px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 8px;
  }
  .fixture {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 3px;
    margin-bottom: 8px;
    transition: background 0.15s;
  }
  .fixture:hover { background: var(--surface-hover); }
  .fixture summary {
    list-style: none;
    cursor: pointer;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .fixture summary::-webkit-details-marker { display: none; }
  .kickoff {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--meta);
    min-width: 44px;
  }
  .teams {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 600;
    flex: 1;
    min-width: 180px;
  }
  .teams .v { color: var(--meta); font-weight: 400; margin: 0 6px; }
  .pos-badge {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 400;
    color: var(--meta);
    margin-left: 4px;
    white-space: nowrap;
  }
  .quick-stats {
    display: flex;
    gap: 16px;
    font-family: var(--mono);
    font-size: 11px;
  }
  .quick-stat { color: var(--ink-dim); white-space: nowrap; }
  .quick-stat b { color: var(--ink); }
  .pct-hi { color: var(--green); }
  .pct-lo { color: var(--red); }
  .flag {
    font-size: 10px;
    font-family: var(--mono);
    color: var(--amber);
    border: 1px solid var(--amber);
    border-radius: 2px;
    padding: 2px 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .chev {
    color: var(--meta);
    font-family: var(--mono);
    transition: transform 0.15s;
  }
  .fixture[open] .chev { transform: rotate(90deg); }

  /* ---------- Expanded detail ---------- */
  .detail {
    padding: 4px 16px 18px;
    border-top: 1px solid var(--rule);
  }
  .note {
    font-size: 12px;
    color: var(--amber);
    background: rgba(232,163,61,0.08);
    border: 1px solid rgba(232,163,61,0.25);
    border-radius: 3px;
    padding: 8px 10px;
    margin: 12px 0;
    line-height: 1.5;
  }
  .cup-leagues {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--meta);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-top: 4px;
  }
  .metric-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-top: 14px;
  }
  .mr-block {
    margin-top: 14px;
  }
  .mr-row {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }
  .mr-option {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 12px 10px;
    text-align: center;
  }
  .mr-option.mr-favourite {
    border-color: var(--green);
  }
  .mr-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-dim);
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mr-pct {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 18px;
  }
  .metric-card {
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 12px 14px;
  }
  .metric-title {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--meta);
    margin-bottom: 8px;
  }
  .metric-expected {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .metric-expected .label { font-size: 10px; color: var(--meta); font-weight: 400; margin-left: 4px; }
  .ou-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--mono);
    font-size: 12px;
    padding: 4px 0;
    border-top: 1px solid var(--rule);
  }
  .ou-row:first-of-type { border-top: none; }
  .ou-line { color: var(--ink-dim); }
  .ou-bar-wrap {
    flex: 1;
    height: 6px;
    background: var(--rule);
    border-radius: 3px;
    margin: 0 10px;
    overflow: hidden;
  }
  .ou-bar {
    height: 100%;
    background: var(--amber);
  }
  .ou-pct { min-width: 38px; text-align: right; }
  .btts-row {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-dim);
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--rule);
  }
  .metric-split {
    display: flex;
    gap: 10px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--rule);
  }
  .metric-split-col {
    flex: 1;
    min-width: 0;
  }
  .metric-split-title {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--meta);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .metric-split-expected {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 15px;
    margin: 2px 0 4px;
  }
  .split-ou-row {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 10px;
    padding: 2px 0;
    color: var(--ink-dim);
  }
  .split-ou-line { color: var(--meta); }
  .sample-note {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--meta);
    margin-top: 12px;
  }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--meta);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.8;
  }

  footer {
    max-width: 920px;
    margin: 20px auto 40px;
    padding: 0 20px;
    color: var(--meta);
    font-family: var(--mono);
    font-size: 11px;
  }

  @media (max-width: 560px) {
    .quick-stats { display: none; }
    .teams { font-size: 13px; }
  }
</style>
</head>
<body>

  <header>
    <h1>Footy Stat Pack<span class="dot">.</span></h1>
    <div class="subhead" id="generated-note">Goals, corners, cards &amp; half splits — Poisson model, 5 leagues.</div>
    <div class="freshness-strip" id="freshness-strip"></div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main id="main">
    <div class="empty">Loading…</div>
  </main>

  <footer>
    Data: football-data.co.uk (results) + fixturedownload.com (fixtures). Poisson model — treat as a signal, not a certainty.
  </footer>

<script src="statpack_data.js"></script>
<script src="bets_log.js"></script>
<script>
(function () {
  const LEAGUE_ORDER = ["E0", "E1", "E2", "E3", "SC0", "I1"];
  const BEST_BETS = "__BEST_BETS__";
  const TRACK_RECORD = "__TRACK_RECORD__";
  const EFL_CUP = "__EFL_CUP__";
  const CASH_BUILDER = "__CASH_BUILDER__";
  const NEAR_TERM_WINDOW_DAYS = 4; // one weekend round (Fri-Mon) - covers a single gameweek without pulling in next week's fixtures too
  let showFullSeason = false; // toggled by the "Show full season" link in league views
  let data = (typeof STATPACK_DATA !== "undefined") ? STATPACK_DATA.generated_leagues : null;
  let activeLeague = null;

  const tabsEl = document.getElementById("tabs");
  const mainEl = document.getElementById("main");

  if (!data) {
    mainEl.innerHTML = '<div class="empty">No statpack_data.js found next to this file.<br>Run build_statpack.py, then open this page from the same folder.</div>';
    return;
  }

  const availableLeagues = LEAGUE_ORDER.filter(code => data[code]);
  if (availableLeagues.length === 0) {
    mainEl.innerHTML = '<div class="empty">No league data found. Run fetch_data.py and build_statpack.py first.</div>';
    return;
  }
  activeLeague = availableLeagues[0];

  function pct(n) { return Math.round(n * 100) + "%"; }

  function ordinal(n) {
    if (!n) return "";
    const s = ["th", "st", "nd", "rd"], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }

  function posBadge(position) {
    if (!position) return "";
    return `<span class="pos-badge">${ordinal(position)}</span>`;
  }

  function parseFixtureDate(d) {
    const parts = (d || "").split("/");
    if (parts.length !== 3) return null;
    const dt = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
    return isNaN(dt) ? null : dt;
  }

  function fmtDate(d) {
    // d like "22/08/2026" -> "FRI 22 AUG"
    const parts = (d || "").split("/");
    if (parts.length !== 3) return d || "TBC";
    const dt = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
    if (isNaN(dt)) return d;
    return dt.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }).toUpperCase();
  }

  function buildTabs() {
    tabsEl.innerHTML = "";

    const bbBtn = document.createElement("button");
    bbBtn.className = "tab tab-bestbets" + (activeLeague === BEST_BETS ? " active" : "");
    bbBtn.innerHTML = "★ Best Bets";
    bbBtn.addEventListener("click", () => { activeLeague = BEST_BETS; render(); });
    tabsEl.appendChild(bbBtn);

    availableLeagues.forEach(code => {
      const league = data[code];
      const btn = document.createElement("button");
      btn.className = "tab" + (code === activeLeague ? " active" : "");
      btn.innerHTML = league.league_name + ' <span class="count">' + league.upcoming_fixtures.length + '</span>';
      btn.addEventListener("click", () => { activeLeague = code; render(); });
      tabsEl.appendChild(btn);
    });

    const cupFixtures = (typeof STATPACK_DATA !== "undefined" && STATPACK_DATA.efl_cup)
      ? STATPACK_DATA.efl_cup.fixtures : [];
    if (cupFixtures.length > 0) {
      const cupBtn = document.createElement("button");
      cupBtn.className = "tab tab-bestbets" + (activeLeague === EFL_CUP ? " active" : "");
      cupBtn.innerHTML = "EFL Cup " + `<span class="count">${cupFixtures.length}</span>`;
      cupBtn.addEventListener("click", () => { activeLeague = EFL_CUP; render(); });
      tabsEl.appendChild(cupBtn);
    }

    const trBtn = document.createElement("button");
    trBtn.className = "tab tab-bestbets" + (activeLeague === TRACK_RECORD ? " active" : "");
    const trPct = (typeof BETS_LOG !== "undefined" && BETS_LOG.summary.overall.total > 0)
      ? ` ${BETS_LOG.summary.overall.pct}%` : "";
    trBtn.innerHTML = "Track Record" + trPct;
    trBtn.addEventListener("click", () => { activeLeague = TRACK_RECORD; render(); });
    tabsEl.appendChild(trBtn);

    if (typeof CASH_BUILDER_DATA !== "undefined" && CASH_BUILDER_DATA.chains && CASH_BUILDER_DATA.chains.length > 0) {
      const cbBtn = document.createElement("button");
      cbBtn.className = "tab tab-bestbets" + (activeLeague === CASH_BUILDER ? " active" : "");
      cbBtn.innerHTML = "Cash Builder";
      cbBtn.addEventListener("click", () => { activeLeague = CASH_BUILDER; render(); });
      tabsEl.appendChild(cbBtn);
    }
  }

  function metricBlock(title, m, homeTeam, awayTeam) {
    if (!m) return "";
    const ouRows = (m.over_under || []).map(ou => {
      const overPct = ou.over;
      const barColor = overPct >= 0.5 ? "var(--green)" : "var(--amber)";
      return `<div class="ou-row">
        <span class="ou-line">O/U ${ou.line}</span>
        <div class="ou-bar-wrap"><div class="ou-bar" style="width:${Math.round(overPct*100)}%;background:${barColor}"></div></div>
        <span class="ou-pct ${overPct >= 0.55 ? 'pct-hi' : overPct <= 0.4 ? 'pct-lo' : ''}">${pct(overPct)}</span>
      </div>`;
    }).join("");

    const btts = (m.btts_yes !== undefined)
      ? `<div class="btts-row">BTTS: <b>${pct(m.btts_yes)}</b> yes / ${pct(m.btts_no)} no</div>`
      : "";

    const split = m.home_over_under ? splitBlock(m, homeTeam, awayTeam) : "";

    return `<div class="metric-card">
      <div class="metric-title">${title} <span style="opacity:0.6">· over %</span></div>
      <div class="metric-expected">${m.expected_total}<span class="label">expected</span></div>
      ${ouRows}
      ${btts}
      ${split}
    </div>`;
  }

  function splitSideRows(entries) {
    return entries.map(ou => `<div class="split-ou-row">
      <span class="split-ou-line">${ou.line}</span>
      <span class="split-ou-pct ${ou.over >= 0.55 ? 'pct-hi' : ou.over <= 0.4 ? 'pct-lo' : ''}">${pct(ou.over)}</span>
    </div>`).join("");
  }

  function splitBlock(m, homeTeam, awayTeam) {
    return `<div class="metric-split">
      <div class="metric-split-col">
        <div class="metric-split-title">${homeTeam || 'Home'}</div>
        <div class="metric-split-expected">${m.expected_home}</div>
        ${splitSideRows(m.home_over_under)}
      </div>
      <div class="metric-split-col">
        <div class="metric-split-title">${awayTeam || 'Away'}</div>
        <div class="metric-split-expected">${m.expected_away}</div>
        ${splitSideRows(m.away_over_under)}
      </div>
    </div>`;
  }

  function quickStat(fixture) {
    const g = fixture.predictions.goals;
    const c = fixture.predictions.corners;
    if (!g || !c) return "";
    const goalsLine = g.over_under.find(o => o.line === 2.5) || g.over_under[0];
    const cornersLine = c.over_under.find(o => o.line === 9.5) || c.over_under[0];
    return `<div class="quick-stats">
      <span class="quick-stat">O${goalsLine.line} GLS <b class="${goalsLine.over >= 0.55 ? 'pct-hi' : ''}">${pct(goalsLine.over)}</b></span>
      <span class="quick-stat">O${cornersLine.line} CRN <b class="${cornersLine.over >= 0.55 ? 'pct-hi' : ''}">${pct(cornersLine.over)}</b></span>
    </div>`;
  }

  function flagBadges(fixture) {
    const flags = [];
    if (fixture.cross_league_data) flags.push('cross-league');
    if (fixture.cross_division) flags.push('cross-division');
    if (fixture.fuzzy_name_match) flags.push('name check');
    if (fixture.low_sample) flags.push('thin sample');
    return flags.map(f => `<span class="flag">${f}</span>`).join("");
  }

  function matchResultBlock(fixture) {
    const mr = fixture.predictions.goals?.match_result;
    if (!mr) return "";

    const options = [
      { label: fixture.home_team, position: fixture.home_position, key: "home_win", pct: mr.home_win },
      { label: "Draw", position: null, key: "draw", pct: mr.draw },
      { label: fixture.away_team, position: fixture.away_position, key: "away_win", pct: mr.away_win },
    ];
    const highest = Math.max(mr.home_win, mr.draw, mr.away_win);

    return `<div class="mr-block">
      <div class="metric-title">Match Result</div>
      <div class="mr-row">
        ${options.map(o => `
          <div class="mr-option ${o.pct === highest ? 'mr-favourite' : ''}">
            <div class="mr-label">${o.label}${posBadge(o.position)}</div>
            <div class="mr-pct ${o.pct === highest ? 'pct-hi' : ''}">${pct(o.pct)}</div>
          </div>
        `).join("")}
      </div>
    </div>`;
  }

  function fixtureCard(fixture) {
    const p = fixture.predictions;
    const flag = flagBadges(fixture);
    const note = fixture.note ? `<div class="note">⚠ ${fixture.note.trim()}</div>` : "";

    return `<details class="fixture">
      <summary>
        <span class="kickoff">${fixture.time || "--:--"}</span>
        <span class="teams">${fixture.home_team}<span class="v">v</span>${fixture.away_team}</span>
        ${flag}
        ${quickStat(fixture)}
        <span class="chev">▸</span>
      </summary>
      <div class="detail">
        ${note}
        ${matchResultBlock(fixture)}
        <div class="metric-grid">
          ${metricBlock("Full-Time Goals", p.goals, fixture.home_team, fixture.away_team)}
          ${metricBlock("Corners", p.corners, fixture.home_team, fixture.away_team)}
          ${metricBlock("Cards", p.cards, fixture.home_team, fixture.away_team)}
          ${metricBlock("1st-Half Goals", p.first_half_goals, fixture.home_team, fixture.away_team)}
          ${metricBlock("2nd-Half Goals", p.second_half_goals, fixture.home_team, fixture.away_team)}
        </div>
        <div class="sample-note">Form sample: ${fixture.home_form_sample} home games, ${fixture.away_form_sample} away games</div>
      </div>
    </details>`;
  }

  const METRIC_LABELS = {
    goals: "Full-Time Goals",
    corners: "Corners",
    cards: "Cards",
    first_half_goals: "1st-Half Goals",
    second_half_goals: "2nd-Half Goals",
  };

  // Best Bets is now computed in Python (best_bets.py) at build time, not
  // recalculated here - this is so track_bets.py can log exactly what the
  // dashboard shows, with one shared source of truth. This function just
  // renders whatever STATPACK_DATA.best_bets already contains.
  function bestBetRow(entry, rank, isBtts) {
    const label = isBtts ? entry.direction : `${entry.direction} ${entry.line}`;
    return `<div class="bb-row">
      <span class="bb-rank">${rank}</span>
      <span class="bb-teams">${entry.home_team}<span class="v">v</span>${entry.away_team}</span>
      <span class="bb-league">${entry.league_name}</span>
      <span class="bb-label">${label}</span>
      <span class="bb-pct ${entry.confidence >= 0.55 ? 'pct-hi' : entry.confidence <= 0.4 ? 'pct-lo' : ''}">${pct(entry.confidence)}</span>
    </div>`;
  }

  // team_win is a different shape to every other category (a flat list,
  // not {over, under}) since it isn't an over/under market - each entry
  // is just "this team, at this confidence", so it gets its own row
  // renderer and its own (non-split) section in renderBestBets below.
  function teamWinRow(entry, rank) {
    return `<div class="bb-row">
      <span class="bb-rank">${rank}</span>
      <span class="bb-teams">${entry.home_team}<span class="v">v</span>${entry.away_team}</span>
      <span class="bb-league">${entry.league_name}</span>
      <span class="bb-label">${entry.team} to win</span>
      <span class="bb-pct ${entry.confidence >= 0.55 ? 'pct-hi' : entry.confidence <= 0.4 ? 'pct-lo' : ''}">${pct(entry.confidence)}</span>
    </div>`;
  }

  function renderBestBets() {
    const categories = (typeof STATPACK_DATA !== "undefined" && STATPACK_DATA.best_bets) || {};
    const hasAny = Object.values(categories).some(c => Array.isArray(c) ? c.length > 0 : (c.over?.length > 0 || c.under?.length > 0));

    if (!hasAny) {
      mainEl.innerHTML = `<div class="empty">No eligible fixtures in the near-term window yet.<br>
        (Fixtures with a thin sample, cross-league, or name-match flag are excluded from Best Bets - check the league tabs for those.)</div>`;
      return;
    }

    const teamWinSection = (categories.team_win && categories.team_win.length > 0)
      ? `<div class="bb-category">
          <div class="bb-category-title">Team Win</div>
          ${categories.team_win.map((e, i) => teamWinRow(e, i + 1)).join("")}
        </div>`
      : "";

    const order = ["goals", "btts", "corners", "cards", "first_half_goals", "second_half_goals"];
    mainEl.innerHTML = `<div class="bb-intro">Highest-confidence picks across all leagues. Thin-sample and cross-league fixtures are excluded.</div>` +
      teamWinSection +
      order.map(key => {
        const c = categories[key];
        if (!c || (c.over.length === 0 && c.under.length === 0)) return "";
        const title = key === "btts" ? "Both Teams To Score" : METRIC_LABELS[key];
        const overLabel = key === "btts" ? "Yes" : "Over";
        const underLabel = key === "btts" ? "No" : "Under";
        return `<div class="bb-category">
          <div class="bb-category-title">${title}</div>
          <div class="bb-split">
            <div class="bb-column">
              <div class="bb-column-title">${overLabel}</div>
              ${c.over.map((e, i) => bestBetRow(e, i + 1, key === "btts")).join("") || '<div class="bb-empty">No eligible fixtures</div>'}
            </div>
            <div class="bb-column">
              <div class="bb-column-title">${underLabel}</div>
              ${c.under.map((e, i) => bestBetRow(e, i + 1, key === "btts")).join("") || '<div class="bb-empty">No eligible fixtures</div>'}
            </div>
          </div>
        </div>`;
      }).join("");
  }

  function trackRecordRow(pick) {
    const isPending = pick.status === "pending";
    const label = pick.metric === "btts"
      ? `BTTS: ${pick.direction}`
      : `${pick.direction} ${pick.line} ${METRIC_LABELS[pick.metric] || pick.metric}`;
    const resultBadge = isPending
      ? '<span class="tr-badge tr-pending">Pending</span>'
      : `<span class="tr-badge ${pick.result === 'hit' ? 'tr-hit' : 'tr-miss'}">${pick.result === 'hit' ? 'Hit' : 'Miss'}</span>`;
    return `<div class="bb-row">
      <span class="bb-teams">${pick.home_team}<span class="v">v</span>${pick.away_team}</span>
      <span class="bb-league">${pick.league_name}</span>
      <span class="bb-label">${label}</span>
      ${resultBadge}
    </div>`;
  }

  function renderTrackRecord() {
    if (typeof BETS_LOG === "undefined") {
      mainEl.innerHTML = `<div class="empty">No bets_log.js found yet.<br>This is generated by track_bets.py, which runs automatically as part of the daily Action - check back after the next run.</div>`;
      return;
    }

    const { summary, recent } = BETS_LOG;
    const overall = summary.overall;

    const summaryHtml = `<div class="tr-summary">
      <div class="tr-summary-main">
        <span class="tr-summary-pct ${overall.pct >= 55 ? 'pct-hi' : overall.pct <= 40 ? 'pct-lo' : ''}">${overall.total > 0 ? overall.pct + '%' : '—'}</span>
        <span class="tr-summary-label">${overall.hits}/${overall.total} settled picks hit${summary.pending_count ? ` · ${summary.pending_count} pending` : ''}</span>
      </div>
      <div class="tr-category-grid">
        ${summary.by_category.map(c => {
          const label = c.metric === "btts" ? `BTTS ${c.direction}` : `${METRIC_LABELS[c.metric] || c.metric} ${c.direction}`;
          return `<div class="tr-category-chip">
            <span>${label}</span>
            <span class="${c.pct >= 55 ? 'pct-hi' : c.pct <= 40 ? 'pct-lo' : ''}">${c.pct}% <span class="tr-chip-n">(${c.hits}/${c.total})</span></span>
          </div>`;
        }).join("") || '<div class="bb-empty">No settled picks yet</div>'}
      </div>
    </div>`;

    const logHtml = recent.length
      ? `<div class="bb-category-title">Recent Picks</div>${recent.map(trackRecordRow).join("")}`
      : `<div class="bb-empty">No picks logged yet</div>`;

    mainEl.innerHTML = `<div class="bb-intro">Tracking every Best Bets pick since logging started - settled automatically once each match is played.</div>` +
      summaryHtml + logHtml;
  }

  function cupFixtureCard(fixture) {
    const p = fixture.predictions;
    const flag = flagBadges(fixture);
    const note = fixture.note ? `<div class="note">⚠ ${fixture.note.trim()}</div>` : "";
    const leagueLine = fixture.cross_division
      ? `<div class="cup-leagues">${fixture.home_league} v ${fixture.away_league}</div>`
      : "";

    return `<details class="fixture">
      <summary>
        <span class="kickoff">${fixture.time || "--:--"}</span>
        <span class="teams">${fixture.home_team}<span class="v">v</span>${fixture.away_team}</span>
        ${flag}
        ${quickStat(fixture)}
        <span class="chev">▸</span>
      </summary>
      <div class="detail">
        ${leagueLine}
        ${note}
        ${matchResultBlock(fixture)}
        <div class="metric-grid">
          ${metricBlock("Full-Time Goals", p.goals, fixture.home_team, fixture.away_team)}
          ${metricBlock("Corners", p.corners, fixture.home_team, fixture.away_team)}
          ${metricBlock("Cards", p.cards, fixture.home_team, fixture.away_team)}
          ${metricBlock("1st-Half Goals", p.first_half_goals, fixture.home_team, fixture.away_team)}
          ${metricBlock("2nd-Half Goals", p.second_half_goals, fixture.home_team, fixture.away_team)}
        </div>
        <div class="sample-note">Form sample: ${fixture.home_form_sample} home games, ${fixture.away_form_sample} away games</div>
      </div>
    </details>`;
  }

  function renderEflCup() {
    const cupFixtures = (typeof STATPACK_DATA !== "undefined" && STATPACK_DATA.efl_cup)
      ? STATPACK_DATA.efl_cup.fixtures : [];

    if (cupFixtures.length === 0) {
      mainEl.innerHTML = `<div class="empty">No EFL Cup fixtures loaded.<br>Add them to cup_fixtures_manual/efl_cup.txt.</div>`;
      return;
    }

    const intro = `<div class="bb-intro">Fixtures crossing divisions ("cross-division") use each team's own
      league form with a rough cross-league adjustment (see cross_league.py) - treat these with more caution
      than same-league predictions.</div>`;

    // group by date, same pattern as league fixture lists
    const groups = [];
    let currentDate = null, currentGroup = null;
    cupFixtures.forEach(fx => {
      if (fx.date !== currentDate) {
        currentDate = fx.date;
        currentGroup = { date: fx.date, items: [] };
        groups.push(currentGroup);
      }
      currentGroup.items.push(fx);
    });

    mainEl.innerHTML = intro + groups.map(g => `
      <div class="date-group">
        <div class="date-label">${fmtDate(g.date)}</div>
        ${g.items.map(cupFixtureCard).join("")}
      </div>
    `).join("");
  }

  function render() {
    buildTabs();

    if (activeLeague === BEST_BETS) {
      renderBestBets();
      return;
    }
    if (activeLeague === TRACK_RECORD) {
      renderTrackRecord();
      return;
    }
    if (activeLeague === EFL_CUP) {
      renderEflCup();
      return;
    }
    if (activeLeague === CASH_BUILDER) {
      renderCashBuilder();
      return;
    }

    const league = data[activeLeague];
    const allFixtures = league.upcoming_fixtures;

    if (allFixtures.length === 0) {
      mainEl.innerHTML = `<div class="empty">No upcoming fixtures loaded for ${league.league_name}.<br>Check fixtures_manual/ has the right CSV for this league.</div>`;
      return;
    }

    const now = new Date();
    const windowEnd = new Date(now);
    windowEnd.setDate(now.getDate() + NEAR_TERM_WINDOW_DAYS);

    const nearTerm = allFixtures.filter(fx => {
      const d = parseFixtureDate(fx.date);
      return !d || d <= windowEnd; // undated fixtures stay visible rather than vanishing
    });
    const fixtures = showFullSeason ? allFixtures : nearTerm;
    const hiddenCount = allFixtures.length - nearTerm.length;

    const toggle = hiddenCount > 0
      ? (showFullSeason
          ? `<div class="window-toggle">Showing full season (${allFixtures.length} fixtures) · <a href="#" id="toggle-window">Show next ${NEAR_TERM_WINDOW_DAYS} days only</a></div>`
          : `<div class="window-toggle">Showing next ${NEAR_TERM_WINDOW_DAYS} days · <a href="#" id="toggle-window">Show full season (${hiddenCount} more)</a></div>`)
      : "";

    if (fixtures.length === 0) {
      mainEl.innerHTML = toggle + `<div class="empty">No fixtures in the next ${NEAR_TERM_WINDOW_DAYS} days for ${league.league_name}.<br>Try "Show full season" above.</div>`;
      attachToggleHandler();
      return;
    }

    // group by date, preserving original order (already chronological from source)
    const groups = [];
    let currentDate = null, currentGroup = null;
    fixtures.forEach(fx => {
      if (fx.date !== currentDate) {
        currentDate = fx.date;
        currentGroup = { date: fx.date, items: [] };
        groups.push(currentGroup);
      }
      currentGroup.items.push(fx);
    });

    mainEl.innerHTML = toggle + groups.map(g => `
      <div class="date-group">
        <div class="date-label">${fmtDate(g.date)}</div>
        ${g.items.map(fixtureCard).join("")}
      </div>
    `).join("");
    attachToggleHandler();
  }

  function attachToggleHandler() {
    const link = document.getElementById("toggle-window");
    if (link) {
      link.addEventListener("click", (e) => {
        e.preventDefault();
        showFullSeason = !showFullSeason;
        render();
      });
    }
  }

  function renderFreshnessStrip() {
    const strip = document.getElementById("freshness-strip");
    const freshness = (typeof STATPACK_DATA !== "undefined") ? STATPACK_DATA.data_freshness : null;
    if (!freshness) { strip.innerHTML = ""; return; }

    strip.innerHTML = LEAGUE_ORDER.filter(code => freshness[code]).map(code => {
      const f = freshness[code];
      if (f.days_old === null) {
        return `<span class="freshness-chip freshness-stale"><span class="dot-status"></span>${f.league_name}: no current-season data yet</span>`;
      }
      const status = f.days_old <= 3 ? "fresh" : f.days_old <= 7 ? "lagging" : "stale";
      const label = f.days_old === 0 ? "today" : f.days_old === 1 ? "1 day ago" : `${f.days_old} days ago`;
      return `<span class="freshness-chip freshness-${status}"><span class="dot-status"></span>${f.league_name}: ${label}</span>`;
    }).join("");
  }

  renderFreshnessStrip();
  render();
})();
</script>
</body>
</html>
