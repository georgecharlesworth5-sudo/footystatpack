name: Update Today's Races

# Reads today's UK racecard (times, race names, distances, field sizes) from
# Sporting Life's public feed and writes racing_today.js, which the Racing
# tab maps onto the race-profile ratings. No results, prices or tips.
# Every run refreshes both today's card (racing_today.js) and tomorrow's
# (racing_tomorrow.js), so the page never depends on one particular run.
# It also records finished races (with going, jockey, trainer, odds and result)
# and rebuilds the race-profile ratings, which fold in those results whenever
# Betfair's own history can't be downloaded.

on:
  schedule:
    # GitHub's clock is UTC. 08:05 / 20:05 UTC is 09:05 / 21:05 UK time while
    # the clocks are on British Summer Time (to 25 Oct 2026); after the clocks
    # go back it becomes 08:05 / 20:05 UK time. Change the hours then if you
    # want 9am / 9pm exactly (use 9 and 21).
        - cron: '5 8 * * *'
    - cron: '5 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: racing-today
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch today's and tomorrow's cards
        run: python racing_today.py --debug
      - name: Record outcomes of finished races
        continue-on-error: true
        run: python racing_today.py --results

      - name: Rebuild the racing ratings (Betfair history if reachable, plus Sporting Life results)
        continue-on-error: true
        run: |
          python racing.py
          python racing.py --region ire

      - name: Probe yesterday's results (diagnostic only)
        continue-on-error: true
        run: python racing_today.py --probe-results

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add racing_today.js racing_tomorrow.js data/racing_probe.txt racing_results.js data/racing_results.json data/racing_runners.csv \
                  racing_data.js racing_data_ire.js data/racing_races.csv data/racing_races_ire.csv \
                  data/racing_files_done.txt data/racing_files_done_ire.txt
          git diff --staged --quiet || git commit -m "Auto-update today's races $(date -u +'%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $attempt failed - retrying..."
            sleep $((attempt * 5))
          done
