name: Update Today's Races

# Reads today's UK racecard (times, race names, distances, field sizes) from
# Sporting Life's public feed and writes racing_today.js, which the Racing
# tab maps onto the race-profile ratings. No results, prices or tips.
# Runs a few times a day because declared runners change through the morning.

on:
  schedule:
    - cron: '30 6 * * *'
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: racing-today
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch today's card
        run: python racing_today.py --debug
      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add racing_today.js
          git diff --staged --quiet || git commit -m "Auto-update today's races $(date -u +'%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $attempt failed - retrying..."
            sleep $((attempt * 5))
          done
