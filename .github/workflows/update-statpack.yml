name: Update Stat Pack

# Runs the results/predictions half of the pipeline automatically:
#   fetch_data.py    - pulls the latest results CSVs from football-data.co.uk
#   build_statpack.py - recalculates form + predictions, writes statpack.json
#                        and statpack_data.js (which the dashboard reads)
#
# Deliberately does NOT touch fixtures_manual/ - that stays a manual weekly
# download from fixturedownload.com (see load_fixtures.py for why), so this
# workflow only refreshes results/team-form, not the fixture list itself.

on:
  schedule:
    # 06:00 UTC daily. football-data.co.uk updates results within a day or
    # so of matches being played, so a daily refresh keeps form current
    # without hammering their server. Adjust the cron below if you'd
    # rather it ran at a different time - each field is
    # minute hour day-of-month month day-of-week, all in UTC.
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Lets you trigger a run manually from the Actions tab (or GitHub
    # Mobile: repo -> Actions -> Update Stat Pack -> Run workflow) any
    # time you don't want to wait for the schedule.

permissions:
  contents: write   # needed to commit the refreshed data back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch latest results
        run: python fetch_data.py

      - name: Build stat pack
        run: python build_statpack.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ statpack.json statpack_data.js
          git diff --staged --quiet || git commit -m "Auto-update stat pack $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
